name: Generate Dora MP3
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Pilot: first two lessons; all: all course lesson words and examples"
        type: choice
        options:
          - pilot
          - all
        default: pilot
  push:
    branches: [main]
    paths:
      - ".github/workflows/dora-audio.yml"
permissions:
  contents: write
concurrency:
  group: dora-audio-main
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DORA_SCOPE: ${{ inputs.scope || 'pilot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install kokoro==0.9.4 soundfile
      - name: Render Brazilian Portuguese audio
        run: python generate-dora.py --scope "$DORA_SCOPE"
      - name: Commit verified MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-dora dora-audio-index.js
          if git diff --cached --quiet; then
            echo "No new recordings"
          else
            git commit -m "Generate Dora pt-BR MP3 recordings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
