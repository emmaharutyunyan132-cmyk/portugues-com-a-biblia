["A2","Jerusalém","Oração e respostas","Молитва и ответы","bíblico","Pronomes de objeto: me, te, nos; no Brasil, a próclise é comum.","Me — меня/мне, te — тебя/тебе, nos — нас/нам; в Бразилии часто перед глаголом.",[["resposta","ответ"],["responder","отвечать"],["escuta","слушание"],["atender","откликаться"]],[["Deus me ajuda.","Бог мне помогает."],["Ela nos ouviu com atenção.","Она внимательно нас выслушала."],["Eu te agradeço pela ajuda.","Я благодарю тебя за помощь."]],{"example":1,"answer":"nos"}],

["A2","Cafarnaum","O paralítico","Рассказ о парализованном человеке","bíblico","Pretérito perfeito irregular: trouxe, pôde, fez.","Trazer → trouxe, poder → pôde, fazer → fez в завершённом прошлом.",[["telhado","крыша"],["multidão","толпа"],["carregar","нести"],["cura","исцеление"]],[["Os amigos trouxeram o homem até Jesus.","Друзья принесли мужчину к Иисусу."],["Eles fizeram um esforço para ajudá-lo.","Они приложили усилие, чтобы помочь ему."],["Ele pôde voltar para casa.","Он смог вернуться домой."]],{"example":0,"answer":"trouxeram"}],
["A2","Jerusalém","A linguagem das Escrituras","Язык Писания","bíblico","Conosco é comum na fala; convosco é literário. Vos pode aparecer com vós.","Conosco — с нами, convosco — с вами (книжное); обычно com vocês.",[["conosco","с нами"],["convosco","с вами (книжное)"],["vos","вас или вам (при vós)"],["escritura","писание"]],[["Ele está conosco.","Он с нами."],["Quero conversar com vocês.","Я хочу поговорить с вами."],["A paz esteja convosco.","Да будет мир с вами."]],{"example":1,"answer":"com vocês"}],
["B1","Jerusalém","Mudança interior","Внутреннее изменение","bíblico","Para que + subjuntivo expressa finalidade.","Para que — чтобы; если меняется субъект, используем subjuntivo.",[["transformação","преобразование"],["renovar","обновлять"],["caráter","характер"],["finalidade","цель"]],[["Nós estudamos para que possamos compreender melhor.","Мы учимся, чтобы лучше понимать."],["Ela explicou tudo para que eu entendesse.","Она всё объяснила, чтобы я поняла."],["É necessário que cada pessoa reflita.","Необходимо, чтобы каждый человек размышлял."]]],
["B1","Galileia","A linguagem da oração","Язык молитвы","bíblico","Imperativo: ajuda (tu), ajude (você); em orações, ajuda-me ou me ajuda conforme o registro.","Ajuda — форма для tu, ajude — для você; ajuda-me более книжное, me ajuda — распространённое разговорное обращение.",[["suplicar","умолять"],["misericórdia","милосердие"],["abençoar","благословлять"],["guiar","направлять"]],[["Senhor, guia os meus passos.","Господи, направляй мои шаги."],["Ajude-nos a compreender a mensagem.","Помогите нам понять послание."],["Peço que Deus abençoe a minha família.","Я прошу, чтобы Бог благословил мою семью."]]],
["B1","Jericó","Resolver um mal-entendido","Решить недоразумение","Brasil","Se + imperfeito do subjuntivo; condicional: se soubesse, explicaria.","Гипотеза: se soubesse — если бы знала, explicaria — объяснила бы.",[["mal-entendido","недоразумение"],["esclarecer","прояснять"],["equívoco","ошибка"],["respeito","уважение"]],[["Se eu soubesse disso, explicaria melhor.","Если бы я знала об этом, я бы объяснила лучше."],["Gostaria que você esclarecesse a situação.","Я хотела бы, чтобы ты прояснила ситуацию."],["Podemos conversar com respeito.","Мы можем поговорить уважительно."]]],
["B2","Jerusalém","Traduzir contrastes","Перевод противопоставлений","bíblico","Apesar de + infinitivo; embora + subjuntivo; no entanto + indicativo.","Apesar de — несмотря на; embora — хотя с subjuntivo; no entanto — однако.",[["contraste","противопоставление"],["obstáculo","препятствие"],["concessão","уступка"],["determinação","решимость"]],[["Embora enfrentemos obstáculos, podemos manter a esperança.","Хотя мы сталкиваемся с препятствиями, мы можем сохранять надежду."],["Apesar de estar cansada, ela continuou.","Несмотря на усталость, она продолжила."],["A tarefa era difícil; no entanto, conseguimos terminá-la.","Задание было трудным, однако нам удалось его закончить."]]],
["B2","Betânia","A mensagem e o público","Послание и аудитория","bíblico","Orações relativas: o que, aquilo que, cujo/cuja (registro formal).","Cujo/cuja выражает принадлежность и согласуется со следующим существительным, без артикля.",[["público","аудитория"],["clareza","ясность"],["adequar","адаптировать"],["ambiguidade","двусмысленность"]],[["O texto cujo sentido discutimos é complexo.","Текст, смысл которого мы обсуждаем, сложен."],["O intérprete precisa compreender aquilo que ouve.","Переводчику нужно понимать то, что он слышит."],["É preciso evitar ambiguidades desnecessárias.","Нужно избегать ненужной двусмысленности."]]],
["B2","Jerusalém","Narrar e interpretar","Повествование и толкование","bíblico","Mais-que-perfeito composto: tinha + particípio; anterioridade em relação ao passado.","Tinha + причастие обозначает действие, совершившееся раньше другого прошлого действия.",[["anterioridade","предшествование"],["relato","повествование"],["ocorrência","событие"],["sequência","последовательность"]],[["Quando a reunião começou, ela já tinha chegado.","Когда собрание началось, она уже пришла."],["O narrador explicou o que tinha acontecido.","Рассказчик объяснил, что произошло ранее."],["A sequência dos acontecimentos esclarece o relato.","Последовательность событий проясняет повествование."]]],
["A1","Jerusalém","João 1 — A Palavra","Иоанна 1 — Слово","bíblico","O verbo era é o imperfeito de ser; no presente, é. Em João 1:1–5, o texto usa a imagem da luz. Exemplos didáticos, não citações.","Era — форма прошедшего времени ser, в настоящем é. Иоанна 1:1–5: образ света. Ниже авторские учебные примеры, не цитаты.",[["princípio","начало"],["Verbo","Слово (богословский термин)"],["trevas","тьма"],["existir","существовать"]],[["O capítulo fala sobre a luz.","Глава говорит о свете."],["A luz é uma imagem importante.","Свет — важный образ."],["Nós lemos o primeiro capítulo.","Мы читаем первую главу."]]],
["A1","Betânia","João 1 — João Batista","Иоанна 1 — Иоанн Креститель","bíblico","Quem pergunta sobre uma pessoa; quem é? João 1:19–34: João Batista dá testemunho sobre Jesus.","Quem — кто; Quem é? — Кто это? Иоанна 1:19–34: Иоанн Креститель свидетельствует об Иисусе.",[["batista","креститель"],["testemunhar","свидетельствовать"],["enviar","посылать"],["cordeiro","агнец"]],[["Quem é João Batista?","Кто такой Иоанн Креститель?"],["João fala sobre Jesus.","Иоанн говорит об Иисусе."],["Ele dá testemunho.","Он свидетельствует."]]],
["A1","Galileia","João 2 — Em Caná","Иоанна 2 — В Кане","bíblico","Na festa = em + a; dentro de indica interior. João 2:1–11: Jesus está em uma festa de casamento. Vocabulário descritivo, não uma citação.","Na festa — на празднике; dentro de — внутри. Иоанна 2:1–11: Иисус присутствует на свадьбе.",[["casamento","свадьба"],["convidado","гость"],["jarra","кувшин"],["recipiente","сосуд"]],[["Jesus está na festa.","Иисус находится на празднике."],["Maria fala com Jesus.","Мария разговаривает с Иисусом."],["Há água nos recipientes.","В сосудах есть вода."]]],
["A1","Jerusalém","João 3 — Nicodemos","Иоанна 3 — Никодим","bíblico","Perguntas com como e por que. João 3:1–21: Jesus conversa com Nicodemos sobre nascer de novo.","Como — как, por que — почему (в вопросе). Иоанна 3:1–21: беседа Иисуса с Никодимом о рождении свыше.",[["novo","новый"],["nascer de novo","родиться свыше"],["explicação","объяснение"],["perguntar","спрашивать"]],[["Nicodemos faz uma pergunta.","Никодим задаёт вопрос."],["Jesus fala sobre uma nova vida.","Иисус говорит о новой жизни."],["Como posso entender isso?","Как я могу это понять?"]]],
["A1","Samaria","João 4 — A mulher samaritana","Иоанна 4 — Самарянка","bíblico","Dar algo a alguém: eu dou, você dá, nós damos. João 4:1–26 usa a água como imagem espiritual.","Dar — давать: eu dou, você dá, nós damos. В Иоанна 4:1–26 вода также имеет духовный смысл.",[["poço","колодец"],["samaritana","самарянка"],["dar","давать"],["beber","пить"]],[["A mulher está perto do poço.","Женщина находится рядом с колодцем."],["Jesus conversa com a mulher.","Иисус беседует с женщиной."],["Eu dou água à visitante.","Я даю воду посетительнице."]]],
["A1","Galileia","João 6 — Os pães","Иоанна 6 — Хлебы","bíblico","Plural: pão → pães; peixe → peixes. João 6:1–15: Jesus alimenta uma multidão.","Множественное число: pão → pães, peixe → peixes. Иоанна 6:1–15: Иисус накормил множество людей.",[["peixe","рыба"],["cesto","корзина"],["alimentar","кормить"],["multiplicar","умножать"]],[["O menino tem cinco pães.","У мальчика пять хлебов."],["As pessoas recebem alimento.","Люди получают пищу."],["Os discípulos recolhem os pedaços.","Ученики собирают куски."]]],
["A1","Jerusalém","João 10 — O pastor e as ovelhas","Иоанна 10 — Пастырь и овцы","bíblico","Conhecer: eu conheço, você conhece. João 10:1–18: pastor e ovelhas são imagens de cuidado e relação.","Conhecer — знать, быть знакомым: conheço, conhece. Иоанна 10:1–18: образы пастыря и овец связаны с заботой и отношениями.",[["ovelha","овца"],["rebanho","стадо"],["conhecer","знать"],["seguir","следовать"]],[["O pastor conhece as ovelhas.","Пастырь знает овец."],["As ovelhas seguem o pastor.","Овцы следуют за пастырем."],["Luz é uma ovelha.","Луз — овечка."]]],
["A1","Betânia","João 11 — Lázaro","Иоанна 11 — Лазарь","bíblico","Sentir: eu sinto, você sente. João 11:1–44: Jesus visita Marta e Maria após a morte de Lázaro.","Sentir — чувствовать: sinto, sente. Иоанна 11:1–44: Иисус приходит к Марфе и Марии после смерти Лазаря.",[["tristeza","печаль"],["chorar","плакать"],["irmã","сестра"],["consolar","утешать"]],[["Marta é irmã de Lázaro.","Марфа — сестра Лазаря."],["Maria sente tristeza.","Мария чувствует печаль."],["Os amigos oferecem consolo.","Друзья предлагают утешение."]]],
["A1","Jerusalém","João 13 — Servir aos outros","Иоанна 13 — Служить другим","bíblico","Servir: eu sirvo, você serve, nós servimos. João 13:1–17: Jesus lava os pés dos discípulos, exemplo de serviço.","Servir — служить: sirvo, serve, servimos. Иоанна 13:1–17: омовение ног как пример служения.",[["toalha","полотенце"],["lavar","мыть"],["pé","нога (ступня)"],["exemplo","пример"]],[["Jesus dá um exemplo de serviço.","Иисус даёт пример служения."],["Eu sirvo aos outros com alegria.","Я служу другим с радостью."],["Os discípulos observam Jesus.","Ученики наблюдают за Иисусом."]]],
["A1","Jerusalém","João 15 — A videira","Иоанна 15 — Виноградная лоза","bíblico","Produzir: eu produzo, você produz; permanecer em. João 15:1–8: videira e ramos são uma metáfora.","Produzir — производить: produzo, produz. Permanecer em — пребывать в. Иоанна 15:1–8: лоза и ветви — метафора.",[["videira","виноградная лоза"],["ramo","ветвь"],["fruto","плод"],["permanecer","пребывать"]],[["A videira tem muitos ramos.","У лозы много ветвей."],["O ramo produz frutos.","Ветвь приносит плоды."],["Nós queremos permanecer firmes na fé.","Мы хотим оставаться твёрдыми в вере."]]],
["A1","Jerusalém","João 20 — A notícia","Иоанна 20 — Весть","bíblico","Ver: vejo, vê, vemos; contar algo a alguém. João 20:11–18: Maria Madalena anuncia que viu Jesus.","Ver — видеть: vejo, vê, vemos. Иоанна 20:11–18: Мария Магдалина сообщает о встрече с Иисусом.",[["ressurreição","воскресение"],["notícia","новость"],["ver","видеть"],["anunciar","возвещать"]],[["Maria Madalena leva uma notícia aos discípulos.","Мария Магдалина приносит ученикам весть."],["Eu creio na ressurreição de Jesus.","Я верю в воскресение Иисуса."],["Nós vemos a alegria das pessoas.","Мы видим радость людей."]]],
["A1","Jerusalém","Capítulos e versículos","Главы и стихи","bíblico","Para referências: João, capítulo três, versículo dezesseis; Jo é abreviação de João.","Ссылку Jo 3:16 читают João, capítulo três, versículo dezesseis. Jo — сокращение от João.",[["referência","ссылка"],["dezesseis","шестнадцать"],["vinte","двадцать"],["primeiro","первый"]],[["Abra no capítulo três de João.","Открой третью главу Иоанна."],["Vamos ler o versículo dezesseis.","Давайте прочитаем шестнадцатый стих."],["João tem vinte e um capítulos.","В Евангелии от Иоанна двадцать одна глава."]]],
["A1","Betânia","Os obreiros e as obreiras","Служители и служительницы","bíblico","Singular e plural: obreiro, obreira, obreiros, obreiras. Na terminologia deste curso, obreiro significa служитель.","Род и число: obreiro, obreira, obreiros, obreiras. В терминологии курса — служитель и служительница.",[["obreiro","служитель"],["obreira","служительница"],["auxiliar","помогать"],["disponibilidade","готовность помочь"]],[["A obreira recebe os visitantes.","Служительница встречает посетителей."],["O obreiro ajuda na reunião.","Служитель помогает на собрании."],["Os obreiros conversam com as pessoas.","Служители разговаривают с людьми."]]],
["A1","Betânia","Conversar com o pastor","Разговор с пастором","bíblico","O senhor / a senhora + verbo na terceira pessoa: pode, tem, sabe.","Вежливое обращение o senhor / a senhora требует глагола в третьем лице: pode, tem, sabe.",[["bispo","епископ"],["dúvida","сомнение или вопрос"],["conselho","совет"],["atencioso","внимательный"]],[["Pastor, o senhor tem um minuto?","Пастор, у вас есть минутка?"],["Eu preciso de um conselho.","Мне нужен совет."],["O bispo fala com os pastores.","Епископ разговаривает с пасторами."]]],

let dictMode='all',dictQuery='',cardMode='all',cardDirection='pt',cardQueue=[],cardAt=0,cardOpen=false,cardKnown=0,cardMissed=0,verbGroup='all',verbSelected='crer',prepGroup=0,prepAt=0,prepScore=0,prepChoice=null,prepOrder=[];
function wordId(pt){return 'w:'+String(pt).normalize('NFC').toLowerCase().trim()}
function arg(v){return esc(JSON.stringify(v))}
function dictionary(){let map=new Map();for(const l of L)for(const [pt,ru] of l[7]){let id=wordId(pt),e=map.get(id);if(!e){e={id,pt,ru,levels:[]};map.set(id,e)}else if(!e.ru.split(' / ').includes(ru))e.ru+=' / '+ru;if(!e.levels.includes(l[0]))e.levels.push(l[0])}for(const [pt,ru,detail,example,translation] of IURD){let id=wordId(pt),e=map.get(id)||{id,pt,levels:[]};Object.assign(e,{ru,detail,example,translation,iurd:true});map.set(id,e)}for(const e of S.personalWords)if(e&&typeof e.id==='string'&&typeof e.pt==='string'&&typeof e.ru==='string')map.set(e.id,{...e,levels:[],personal:true});return [...map.values()].sort((a,b)=>a.pt.localeCompare(b.pt,'pt-BR'))}
function deck(mode){return dictionary().filter(e=>mode==='all'||mode==='iurd'&&e.iurd||mode==='mine'&&(e.personal||S.favorites.includes(e.id))||mode==='favorites'&&S.favorites.includes(e.id))}
function matches(e,v){return norm([e.pt,e.ru,e.detail,e.example,e.translation].join(' ')).includes(norm(v))}
function dictEntry(e){let fav=S.favorites.includes(e.id);return '<div class="word-entry"><div class="row"><h3>'+esc(e.pt)+'</h3><button class="tiny '+(fav?'pink':'secondary')+'" aria-pressed="'+fav+'" onclick="toggleFavorite('+arg(e.id)+')">'+(fav?'★':'☆')+' '+tr('Избранное','Favorito')+'</button></div><b>'+esc(e.ru)+'</b> '+(e.iurd?'<span class="tag">IURD</span>':'')+' <small>'+esc(e.levels.join(' · '))+'</small><p>'+audio(e.pt)+'</p>'+(e.detail?'<p>'+esc(e.detail)+'</p>':'')+(e.example?'<p>'+esc(e.example)+' '+audio(e.example)+'</p>':'')+(e.translation?'<p class="muted">'+esc(e.translation)+'</p>':'')+(e.personal?'<button class="secondary tiny" onclick="deletePersonal('+arg(e.id)+')">'+tr('Удалить','Excluir')+'</button>':'')+'</div>'}
function toggleFavorite(id){if(!dictionary().some(e=>e.id===id))return;S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render()}
function setDictMode(m){dictMode=m;dictQuery='';render()}
function searchDictionary(v){dictQuery=v;let all=deck(dictMode),shown=all.filter(e=>matches(e,v));$('#words').innerHTML=shown.map(dictEntry).join('');$('#dict-count').textContent=shown.length+' / '+all.length}
function addPersonal(){let pt=($('#personal-pt')?.value||'').trim(),ru=($('#personal-ru')?.value||'').trim(),example=($('#personal-example')?.value||'').trim();if(!pt||!ru||pt.length>120||ru.length>180||example.length>300){$('#dict-message').textContent=tr('Введи слово и перевод.','Informe palavra e tradução.');return}if(S.personalWords.some(e=>wordId(e.pt)===wordId(pt))){$('#dict-message').textContent=tr('Это слово уже есть в личном словаре.','Esta palavra já existe.');return}S.personalWords.push({id:'p:'+Date.now()+':'+Math.random().toString(36).slice(2,9),pt,ru,example});save();dictMode='mine';dictQuery='';render()}
function deletePersonal(id){if(!S.personalWords.some(e=>e.id===id))return;if(typeof confirm==='function'&&!confirm(tr('Удалить личное слово?','Excluir palavra pessoal?')))return;S.personalWords=S.personalWords.filter(e=>e.id!==id);S.favorites=S.favorites.filter(x=>x!==id);delete S.cardReviews[id];save();render()}
function dictionaryHTML(){let all=deck(dictMode),shown=all.filter(e=>matches(e,dictQuery));return '<h1>'+tr('Словарь','Vocabulário')+'</h1><div class="dict-tabs">'+[['all',tr('Все','Todas')],['iurd','IURD'],['mine',tr('Мой словарь','Meu vocabulário')],['favorites',tr('Избранное','Favoritos')]].map(([m,t])=>'<button class="'+(dictMode===m?'':'secondary')+'" onclick="setDictMode('+arg(m)+')">'+t+'</button>').join('')+'</div><p><button onclick="go(\'cards\')">🗂 '+tr('Карточки','Cartões')+'</button></p>'+(dictMode==='iurd'?'<p class="muted">'+tr('Учебная терминология, не официальный словарь церкви.','Glossário didático, não oficial da igreja.')+'</p>':'')+(dictMode==='mine'?'<article class="personal"><h2>'+tr('Добавить слово','Adicionar palavra')+'</h2><label>Português<input id="personal-pt" maxlength="120"></label><label>Русский<input id="personal-ru" maxlength="180"></label><label>'+tr('Пример (необязательно)','Exemplo (opcional)')+'<input id="personal-example" maxlength="300"></label><button onclick="addPersonal()">'+tr('Добавить','Adicionar')+'</button><p id="dict-message" role="status"></p><p class="muted">'+tr('Личные слова и избранное хранятся в браузере.','Palavras pessoais e favoritos ficam neste navegador.')+'</p></article>':'')+'<input id="search" value="'+esc(dictQuery)+'" placeholder="'+tr('Поиск по-русски или по-португальски','Buscar em russo ou português')+'" oninput="searchDictionary(this.value)"><p class="muted" id="dict-count">'+shown.length+' / '+all.length+'</p><p id="audio-status" role="status" class="muted"></p><article id="words">'+shown.map(dictEntry).join('')+'</article>'}
const intervals=[1,3,7,14,30,60],DAY=86400000;
function dueCards(mode=cardMode,now=Date.now()){return deck(mode).filter(e=>!S.cardReviews[e.id]||Number(S.cardReviews[e.id].due)<=now).sort((a,b)=>(Number(S.cardReviews[a.id]?.due)||0)-(Number(S.cardReviews[b.id]?.due)||0))}
function startCards(practice=false){cardQueue=(practice?shuffle(deck(cardMode)):dueCards()).slice(0,20).map(e=>e.id);cardAt=0;cardOpen=false;cardKnown=0;cardMissed=0;go('cardrun')}
function currentCard(){return dictionary().find(e=>e.id===cardQueue[cardAt])}
function revealCard(){if(currentCard()){cardOpen=true;render()}}
function rateCard(known){let e=currentCard();if(!e||!cardOpen)return;let prev=S.cardReviews[e.id]||{step:0},step=known?Math.min(intervals.length,Math.max(0,Number(prev.step)||0)+1):0;S.cardReviews[e.id]={step,due:Date.now()+(known?intervals[step-1]*DAY:600000),last:Date.now(),known:!!known};known?cardKnown++:cardMissed++;cardAt++;cardOpen=false;save();render()}

function buildQueue(i){let l=L[i],words=l[7],ex=l[8],low=['A1','A2'].includes(l[0]);let a=words.map(w=>({type:'Vocabulário',prompt:w[0],answer:w[1],opts:shuffle([...new Set(words.map(x=>x[1]))]),ex:w.join(' — '),target:'ru'}));
words.slice(0,2).forEach(w=>a.push({type:'Русский → Português',prompt:w[1],answer:w[0],opts:shuffle([...new Set(words.map(x=>x[0]))]),ex:w.join(' — '),target:'pt'}));
ex.forEach((w,j)=>{let recognition=(i===31&&j===1)||(i===73&&j===2);let variants=[w[0]];if(/^(Eu|Nós) /i.test(w[0]))variants.push(w[0].replace(/^(Eu|Nós) /i,''));if(recognition){let modern=i===31?'Vocês têm esperança.':'Que a paz esteja com vocês.';a.push({type:'Português atual',prompt:w[0],context:tr('Выбери современный эквивалент','Escolha o equivalente atual'),answer:modern,opts:shuffle([modern,...ex.filter((_,k)=>k!==j).map(x=>x[0])]),target:'pt',ex:modern+' · '+tr(l[6],l[5])})}else a.push({type:'Tradução',prompt:w[1],answer:w[0],accept:low?[]:variants,target:'pt',selfCheck:!low,ex:w.join(' — ')+' · '+tr(l[6],l[5])});a.push({type:'Português → Русский',prompt:w[0],answer:w[1],opts:shuffle([...new Set(ex.map(x=>x[1]))]),target:'ru',ex:w.join(' — ')});if(j===0)a.push({type:'Áudio',prompt:tr('Что ты услышала?','O que você ouviu?'),listen:w[0],answer:w[0],target:'pt',ex:w.join(' — '),fallback:{type:'Leitura',prompt:w[0],answer:w[1],target:'ru',opts:shuffle([...new Set(ex.map(x=>x[1]))]),ex:w.join(' — ')}});if(low&&j>0){let sentence=recognition?(i===31?'Vocês têm esperança.':'Que a paz esteja com vocês.'):w[0],bank=sentence.split(/\s+/);if(bank.length>=2){let mixed=shuffle(bank);if(mixed.join(' ')===bank.join(' ')&&bank.length>1)mixed.push(mixed.shift());a.push({type:'Monte a frase',prompt:w[1],answer:sentence,target:'pt',bank:mixed,ex:sentence+' — '+w[1]+' · '+tr(l[6],l[5])})}}});
if(l[9]){let w=ex[l[9].example],gap=l[9].answer; a.push({type:'Complete a frase',prompt:gapPrompt(w[0],gap),context:w[1],answer:gap,target:'pt',ex:w.join(' — ')+' · '+tr(l[6],l[5])})}else{let tokens=ex[0][0].split(/\s+/),idx=tokens.length>2?1:0;let gap=tokens[idx];a.push({type:'Complete a frase',prompt:tokens.map((t,j)=>j===idx?'___':t).join(' '),context:ex[0][1],answer:gap,target:'pt',ex:ex[0].join(' — ')+' · '+l[6]});}return a}
function start(i){const k=String(i);if(validDraft(S.drafts[k])){resumeLesson(k);return}active=i;review=false;queue=buildQueue(i);begin()}
function begin(){pos=0;score=0;locked=false;feedback=null;draftText='';picked=[];skipped=0;persist();go('quiz')}
function startReview(){if(validDraft(S.drafts.review)){resumeLesson('review');return}review=true;queue=Object.values(S.errors).filter(q=>q&&typeof q.prompt==='string'&&typeof q.answer==='string');if(!queue.length){go('review');return}begin()}
function errorKey(q){return q.type+q.prompt+(q.listen||'')}
function isPortuguese(q){return q.target==='pt'||(!q.target&&['Tradução','Áudio','Gramática','Monte a frase','Complete a frase'].includes(q.type))}
function check(v){v=String(v||'');if(locked||!v.trim())return;stopSpeech();let q=queue[pos];if(q.bank&&picked.length!==q.bank.length)return;locked=true;let variants=[q.answer,...(Array.isArray(q.accept)?q.accept:[])],ok=variants.some(a=>norm(v)===norm(a)),accent=ok&&isPortuguese(q)&&!variants.some(a=>canonical(v)===canonical(a));feedback={ok,accent,input:v};draftText=v;let key=errorKey(q);if(ok){score++;S.xp+=10;delete S.errors[key]}else S.errors[key]=q;let day=new Date().toLocaleDateString('en-CA');if(!S.days.includes(day))S.days.push(day);persist();render()}
function acceptSelf(){let q=queue[pos];if(!locked||!feedback||feedback.ok||!q.selfCheck)return;feedback.ok=true;feedback.self=true;score++;S.xp+=10;delete S.errors[errorKey(q)];persist();render()}
function writtenAlternative(){if(locked)return;const q=queue[pos];if(!q.listen)return;let fallback=q.fallback;if(!fallback&&typeof q.ex==='string'){let split=q.ex.split(' — ');if(split.length===2&&split[1].trim())fallback={type:'Leitura',prompt:q.listen,answer:split[1],target:'ru',ex:q.ex}}if(fallback){queue[pos]={...fallback};draftText='';picked=[];persist();render();return}queue.splice(pos,1);skipped++;draftText='';picked=[];if(pos>=queue.length)finish();else{persist();render()}}
function finish(){let k=draftKey();if(!review&&queue.length&&score/queue.length>=.8&&!S.done.includes(active))S.done.push(active);delete S.drafts[k];if(S.resume===k)S.resume=Object.keys(S.drafts).find(k=>validDraft(S.drafts[k]))||null;pos=queue.length;locked=false;save();go('result')}
function next(){if(!locked)return;stopSpeech();pos++;locked=false;feedback=null;draftText='';picked=[];if(pos>=queue.length)finish();else{persist();render()}}
function filterWords(v){document.querySelectorAll('.word').forEach(e=>e.hidden=!norm(e.textContent).includes(norm(v)))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='progresso.json';a.click();URL.revokeObjectURL(a.href)}initVoiceEvents();initMic();render();
</script></html>
