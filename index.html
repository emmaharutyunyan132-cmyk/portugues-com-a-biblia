function prepHTML(){return '<h1>'+tr('Предлоги','Preposições')+'</h1>'+PREPS.map((g,i)=>'<article><h2>'+esc(g[0])+'</h2><p>'+esc(g[1])+'</p><button onclick="startPrep('+i+')">'+tr('Практика: 4 задания','Prática: 4 exercícios')+'</button></article>').join('')}
function prepRunHTML(){let g=PREPS[prepGroup],q=g[prepAt+2];if(!q)return '<h1>'+tr('Результат','Resultado')+'</h1><article><h2>'+prepScore+' / '+(g.length-2)+'</h2><button onclick="startPrep('+prepGroup+')">'+tr('Повторить','Repetir')+'</button> <button class="secondary" onclick="go(\'preps\')">'+tr('К предлогам','Voltar')+'</button></article>';return '<div class="quiz-head"><b>'+(prepAt+1)+' / '+(g.length-2)+'</b><button class="secondary" onclick="go(\'preps\')">'+tr('К правилам','Voltar')+'</button></div><article><span class="tag">'+esc(g[0])+'</span><h2>'+esc(q[0])+'</h2>'+prepOrder.map(i=>'<button class="option" onclick="prepAnswer('+i+')" '+(prepChoice!==null?'disabled':'')+'>'+esc(q[i+1])+'</button>').join('')+(prepChoice!==null?'<div class="feedback '+(prepChoice===0?'':'bad')+'"><b>'+esc(q[1])+'</b><p>'+esc(q[5])+'</p></div><button onclick="nextPrep()">'+tr('Продолжить','Continuar')+'</button>':'')+'</article>'}


function saveA2Writing(i,v){if(L[i]?.[0]!=='A2'||!A2_WRITING[i])return;S.a2Writing[i]=String(v).slice(0,3000);save();let msg=$('#writing-status');if(msg)msg.textContent=tr('Сохранено в этом браузере','Salvo neste navegador')}
function a2WritingHTML(i){let w=A2_WRITING[i];if(!w)return '';return '<article class="write-practice"><h2>'+tr('Самостоятельное письмо','Produção escrita')+'</h2><p>'+esc(tr(w[0],w[1]))+'</p><p class="muted">'+tr('Напиши 2–4 фразы. Можно придумать ситуацию; личные данные не нужны. Необязательная практика, не влияет на результат урока.','Escreva de 2 a 4 frases. Pode inventar a situação; não informe dados pessoais. Prática opcional, sem efeito na nota.')+'</p><label for="a2-writing">'+tr('Твой текст','Seu texto')+'</label><textarea id="a2-writing" maxlength="3000" placeholder="Escreva em português..." oninput="saveA2Writing('+i+',this.value)">'+esc(S.a2Writing[i]||'')+'</textarea><p id="writing-status" role="status" class="muted">'+tr('Ответ хранится локально.','O texto fica salvo localmente.')+'</p><details><summary>'+tr('Сверить с образцом','Conferir modelo')+'</summary><p>'+esc(w[2])+'</p>'+audio(w[2])+'<p>'+tr('Проверь, соответствует ли смысл заданию, употреблена ли нужная грамматика и правильно ли согласованы слова. Другие верные ответы возможны; автоматической оценки нет.','Confira o sentido, a gramática pedida e a concordância. Outras respostas podem estar corretas; não há avaliação automática.')+'</p></details></article>'}

function saveB1Writing(i,v){if(L[i]?.[0]!=='B1'||!L[i][10])return;S.b1Writing[i]=String(v).slice(0,4000);save();let msg=$('#b1-writing-status');if(msg)msg.textContent=tr('Сохранено в этом браузере','Salvo neste navegador')}
function b1WritingHTML(i){let w=L[i]?.[10];if(!w||L[i][0]!=='B1')return '';return '<article class="write-practice"><h2>'+tr('Письменная практика B1','Produção escrita B1')+'</h2><p>'+esc(tr(w[0],w[1]))+'</p><p class="muted">'+tr('Напиши связный текст из 3–6 предложений (или короткий диалог). Используй лексику и грамматику урока. Вымышленные ситуации допустимы; личные данные не нужны. Не влияет на оценку.','Escreva de 3 a 6 frases conectadas (ou um diálogo breve). Use o vocabulário e a gramática da lição. Situações fictícias são válidas; não inclua dados pessoais. Não afeta a nota.')+'</p><label for="b1-writing">'+tr('Твой текст','Seu texto')+'</label><textarea id="b1-writing" lang="pt-BR" maxlength="4000" placeholder="Escreva em português..." oninput="saveB1Writing('+i+',this.value)">'+esc(S.b1Writing[i]||'')+'</textarea><p id="b1-writing-status" role="status" class="muted">'+tr('Текст сохраняется на устройстве.','O texto fica salvo no dispositivo.')+'</p><details><summary>'+tr('Открыть образец ответа','Ver modelo de resposta')+'</summary><p>'+esc(w[2])+'</p>'+audio(w[2])+'<p>'+tr('Самопроверка: понятна ли главная мысль? Связаны ли предложения? Правильно ли выбрано время или наклонение? Использована ли лексика урока? Другие ответы тоже могут быть верными.','Autoavaliação: a ideia principal está clara? As frases estão conectadas? O tempo ou modo verbal está adequado? O vocabulário da lição foi usado? Outras respostas podem estar corretas.')+'</p></details></article>'}

function saveB2Writing(i,v){if(L[i]?.[0]!=='B2'||!L[i][10])return;S.b2Writing[i]=String(v).slice(0,6000);save();let msg=$('#b2-writing-status');if(msg)msg.textContent=tr('Сохранено в этом браузере','Salvo neste navegador')}
function b2WritingHTML(i){let w=L[i]?.[10];if(!w||L[i][0]!=='B2')return '';return '<article class="write-practice"><h2>'+tr('Письменная практика B2','Produção escrita B2')+'</h2><p>'+esc(tr(w[0],w[1]))+'</p><p class="muted">'+tr('Напиши связный текст из 4–8 предложений, если задание не требует более короткого ответа, или диалог. Обоснуй вывод, используй грамматику и лексику урока. Вымышленные примеры допустимы; личные сведения не нужны. Не влияет на оценку.','Escreva de 4 a 8 frases conectadas, salvo se a tarefa pedir uma resposta mais curta, ou um diálogo. Fundamente a conclusão e use a gramática e o vocabulário da lição. Exemplos fictícios são válidos; não inclua dados pessoais. Não afeta a nota.')+'</p><label for="b2-writing">'+tr('Твой текст','Seu texto')+'</label><textarea id="b2-writing" lang="pt-BR" maxlength="6000" placeholder="Escreva em português..." oninput="saveB2Writing('+i+',this.value)">'+esc(S.b2Writing[i]||'')+'</textarea><p id="b2-writing-status" role="status" class="muted">'+tr('Текст сохраняется на устройстве.','O texto fica salvo no dispositivo.')+'</p><details><summary>'+tr('Открыть образец и проверить себя','Ver modelo e conferir')+'</summary><p>'+esc(w[2])+'</p>'+audio(w[2])+'<p>'+tr('Проверь структуру, точность смысла, связки между предложениями, выбор наклонения и уместность регистра. Образец — один из возможных ответов. Автоматической оценки свободного текста нет.','Confira a estrutura, a precisão do sentido, os conectores, o modo verbal e a adequação do registro. O modelo é uma resposta possível. Não há avaliação automática do texto livre.')+'</p><p class="muted">'+tr('Дополнительная практика: прослушай образец, затем устно перескажи его главную мысль и два важных подробных пункта без дословного повторения.','Prática adicional: ouça o modelo e depois reconte oralmente a ideia principal e dois detalhes importantes, sem repetir palavra por palavra.')+'</p></details></article>'}

function go(p){if(page==='speaking'&&p!=='speaking'){oralClear();oralSession=null;oralResult=null;micAllowed=false}if(p==='sermon'||p==='dialog'){itType=p;itLevel='all';p='interpreters'}else if(p==='interpreters'&&page==='home'){itLevel='all';itType='all'}if(page==='quiz'&&p!=='quiz'&&pos<queue.length)persist();stopSpeech();page=p;render();scrollTo(0,0);if(p==='profile'||S.ttsEngine==='dora'&&['game','intro','quiz','bible','prayer','dict','search','foundations','cardrun','speaking','interpreters','interpreter-run','verbs','preps','preprun'].includes(p))uxLoadAudio()}function stats(){$('#stats').textContent=`⭐ ${S.xp} XP · ${S.done.length}/${L.length}`;uxNav();document.documentElement.lang=S.lang==='pt'?'pt-BR':'ru'}
function render(){micReset();document.body.dataset.page=page;stats();let h='';if(page==='game'){h=gameHTML()}else if(page==='game-result'){h=gameResultHTML()}else if(page==='home'){h=uxHome()+releaseLinksHTML()}else if(page==='search'){h=uxGlobalSearchHTML()}else if(page==='lesson-list'){h=uxLessonListHTML()}else if(page==='welcome'){h=releaseGuideHTML()}else if(page==='about'){h=releaseAboutHTML()}else if(page==='feedback'){h=releaseFeedbackHTML()}else if(page==='map'){h=journeyHTML()}else if(page==='foundations'){h=foundationPageHTML()}else if(page==='intro'){let l=L[active];h=`<h1>${l[2]}</h1><span class="tag">${l[0]} · ${l[4]==="bíblico"?tr("Библия и церковь","Bíblia e igreja"):tr("Разговорный","Brasil cotidiano")}</span>${/^João \d+\b/.test(l[2])?`<p class="muted">${tr("Авторские учебные примеры по указанному отрывку; не цитаты ACF.","Exemplos didáticos originais, não citações da ACF.")} <a href="https://www.bibliaonline.com.br/acf/jo/${Number(l[2].match(/João (\d+)/)[1])}" target="_blank" rel="noopener noreferrer">ACF · João</a></p>`:""}<article><h2>${tr('Новые слова','Palavras novas')}</h2>${l[7].map(w=>`<div class="row"><b>${w[0]}</b>${w[1]}${audio(w[0])}</div>`).join('')}</article><article><h2>${tr('Грамматика','Gramática')}</h2>${tr(l[6],l[5])}<details><summary>${tr('Примеры','Exemplos')}</summary>${l[8].map(w=>`<p>${w[0]} — ${w[1]} ${audio(w[0])}</p>`).join('')}</details></article>${micPracticeHTML()}${l[0]==='A2'?a2WritingHTML(active):l[0]==='B1'?b1WritingHTML(active):l[0]==='B2'?b2WritingHTML(active):''}<p id="audio-status" class="muted" role="status"></p><button class="wide" onclick="start(${active})">${validDraft(S.drafts[String(active)])?tr("Продолжить упражнения","Continuar exercícios"):tr("К упражнениям","Praticar")}</button>${validDraft(S.drafts[String(active)])?`<button class="secondary" onclick="restartLesson(${active})">${tr("Начать заново","Recomeçar")}</button>`:""}`}else if(page==='interpreters'){h=itCatalogHTML()}else if(page==='interpreter-run'){h=itRunHTML()}else if(page==='speaking'){h=micPageHTML()}else if(page==='quiz'){h=quizHTML()}else if(page==='result'){h=`<article class="hero"><div><h1>${review||score/Math.max(1,queue.length)>=.8?"Parabéns!":tr("Ещё немного практики","Mais um pouco de prática")}</h1><p>${score}/${queue.length} · +${score*10} XP</p><progress max="${Math.max(1,queue.length)}" value="${score}"></progress>${skipped?`<p class="muted">${tr("Пропущено из-за отсутствия звука","Ignorados por falta de áudio")}: ${skipped}</p>`:""}<p>${review?tr("Повторение завершено","Revisão concluída"):score/queue.length>=.8?tr("Урок пройден!","Lição concluída!"):tr("Для прохождения нужно 80% правильных ответов. Попробуй ещё раз.","São necessários 80% de acertos. Tente novamente.")}</p>${!review&&score/queue.length<.8?`<button onclick="start(${active})">${tr("Повторить урок","Tentar de novo")}</button>`:""}<button onclick="go('map')">${tr('К карте','Mapa')}</button></div>${sheep}</article>`}else if(page==='dict'){h=dictionaryHTML()}else if(page==='cards'){h=cardsHTML()}else if(page==='cardrun'){h=cardRunHTML()}else if(page==='verbs'){h=verbsHTML()}else if(page==='preps'){h=prepHTML()}else if(page==='preprun'){h=prepRunHTML()}else if(page==='review'){h=`<h1>${tr('Повторение','Revisão')}</h1><article><h2>${tr('Карточки','Cartões')}</h2><p>${dueCards('learned').length} ${tr('к повторению','para revisar')}</p><button onclick="go('cards')">${tr('Открыть карточки','Abrir cartões')}</button></article><article>${Object.keys(S.errors).length} ${tr('ошибок','erros')}<p>${tr('Ошибочные задания сохраняются до правильного ответа.','Os erros ficam salvos até uma resposta correta.')}</p><button ${Object.keys(S.errors).length?'':'disabled'} onclick="startReview()">${validDraft(S.drafts.review)?tr("Продолжить повторение","Continuar revisão"):tr("Повторить","Revisar")}</button></article>`}else if(page==='grammar'){h=uxCatalogHTML('grammar')}else if(page==='bible'){h=bibleHTML()}else if(page==='prayer'){h=`<h1>Oração</h1><article><button onclick="itCatalog('prayer')">${tr('Тренировки перевода молитв','Prática de tradução de orações')}</button></article><article><p>${tr('Составь собственную молитву. Используй Senhor, agradecer, pedir, confiar.','Escreva sua oração usando Senhor, agradecer, pedir, confiar.')}</p><textarea id="note" rows="7">${esc(S.notes)}</textarea><button onclick="S.notes=$('#note').value;save();this.textContent='✓'">${tr('Сохранить','Salvar')}</button><button class="secondary" onclick="speak($('#note').value)">🔊</button><p class="muted">${tr('Личная запись хранится только на этом устройстве. Автоматической проверки смысла пока нет.','Nota local. Sem correção automática de significado.')}</p></article>`}else if(page==='profile'){h=`<h1>${tr('Профиль','Perfil')}</h1><p class="muted">Português com a Bíblia · 1.0.0</p><article><p>${S.xp} XP · ${S.days.length} ${tr('дней занятий','dias de estudo')}</p><p>${S.done.length?'🏅 Primeiros passos':'🔒 Primeiros passos'}</p><p>${S.xp>=100?'🏅 100 XP':'🔒 100 XP'}</p><label>Idioma<select onchange="S.lang=this.value;save();render()"><option value="ru" ${S.lang==='ru'?'selected':''}>Русский</option><option value="pt" ${S.lang==='pt'?'selected':''}>Português</option></select></label><div id="voice-panel">${voicePanelHTML()}</div><p id="audio-status" role="status" class="muted"></p><p class="muted">${tr('Гостевой режим без регистрации. Прогресс хранится в этом браузере.','Modo visitante sem cadastro. O progresso fica neste navegador.')}</p><button onclick="exportData()">${tr('Экспорт прогресса','Exportar progresso')}</button></article>`+releaseMilestonesHTML()+releaseLinksHTML()}$('#app').innerHTML=h}
function intro(i){gameCourse(i)}
function restartLesson(i){if(typeof confirm==='function'&&!confirm(tr('Начать это занятие заново? Незаконченная попытка будет заменена, XP и завершённые уроки сохранятся.','Recomeçar? A tentativa em andamento será substituída; XP e lições concluídas ficam salvos.')))return;delete S.drafts[String(i)];start(i)}
function gapPrompt(sentence,gap){let from=0;while(from<sentence.length){let i=sentence.indexOf(gap,from);if(i<0)break;if((i===0||!/[\p{L}\p{M}\p{N}]/u.test(sentence[i-1]))&&(i+gap.length===sentence.length||!/[\p{L}\p{M}\p{N}]/u.test(sentence[i+gap.length])))return sentence.slice(0,i)+'___'+sentence.slice(i+gap.length);from=i+1}throw Error('Missing grammar target: '+gap)}
function buildQueue(i){let l=L[i],words=l[7],ex=l[8],low=['A1','A2'].includes(l[0]);let a=words.map(w=>({type:'Vocabulário',prompt:w[0],answer:w[1],opts:shuffle([...new Set(words.map(x=>x[1]))]),ex:w.join(' — '),target:'ru'}));
words.slice(0,2).forEach(w=>a.push({type:'Русский → Português',prompt:w[1],answer:w[0],opts:shuffle([...new Set(words.map(x=>x[0]))]),ex:w.join(' — '),target:'pt'}));
ex.forEach((w,j)=>{let recognition=(i===31&&j===1)||(i===73&&j===2);let variants=[w[0]];if(/^(Eu|Nós) /i.test(w[0]))variants.push(w[0].replace(/^(Eu|Nós) /i,''));if(recognition){let modern=i===31?'Vocês têm esperança.':'Que a paz esteja com vocês.';a.push({type:'Português atual',prompt:w[0],context:tr('Выбери современный эквивалент','Escolha o equivalente atual'),answer:modern,opts:shuffle([modern,...ex.filter((_,k)=>k!==j).map(x=>x[0])]),target:'pt',ex:modern+' · '+tr(l[6],l[5])})}else a.push({type:'Tradução',prompt:w[1],answer:w[0],accept:low?[]:variants,target:'pt',selfCheck:!low,ex:w.join(' — ')+' · '+tr(l[6],l[5])});a.push({type:'Português → Русский',prompt:w[0],answer:w[1],opts:shuffle([...new Set(ex.map(x=>x[1]))]),target:'ru',ex:w.join(' — ')});if(j===0)a.push({type:'Áudio',prompt:tr('Что ты услышала?','O que você ouviu?'),listen:w[0],answer:w[0],target:'pt',ex:w.join(' — '),fallback:{type:'Leitura',prompt:w[0],answer:w[1],target:'ru',opts:shuffle([...new Set(ex.map(x=>x[1]))]),ex:w.join(' — ')}});if(low&&j>0){let sentence=recognition?(i===31?'Vocês têm esperança.':'Que a paz esteja com vocês.'):w[0],bank=sentence.split(/\s+/);if(bank.length>=2){let mixed=shuffle(bank);if(mixed.join(' ')===bank.join(' ')&&bank.length>1)mixed.push(mixed.shift());a.push({type:'Monte a frase',prompt:w[1],answer:sentence,target:'pt',bank:mixed,ex:sentence+' — '+w[1]+' · '+tr(l[6],l[5])})}}});
if(l[9]){let w=ex[l[9].example],gap=l[9].answer; a.push({type:'Complete a frase',prompt:gapPrompt(w[0],gap),context:w[1],answer:gap,target:'pt',ex:w.join(' — ')+' · '+tr(l[6],l[5])})}else{let tokens=ex[0][0].split(/\s+/),idx=tokens.length>2?1:0;let gap=tokens[idx];a.push({type:'Complete a frase',prompt:tokens.map((t,j)=>j===idx?'___':t).join(' '),context:ex[0][1],answer:gap,target:'pt',ex:ex[0].join(' — ')+' · '+l[6]});}return a}
function start(i){const k=String(i);if(validDraft(S.drafts[k])){resumeLesson(k);return}active=i;review=false;queue=buildQueue(i);begin()}
function begin(){pos=0;score=0;locked=false;feedback=null;draftText='';picked=[];skipped=0;persist();go('quiz')}
function startReview(){if(validDraft(S.drafts.review)){resumeLesson('review');return}review=true;queue=Object.values(S.errors).filter(q=>q&&typeof q.prompt==='string'&&typeof q.answer==='string');if(!queue.length){go('review');return}begin()}
function errorKey(q){return q.type+q.prompt+(q.listen||'')}
function isPortuguese(q){return q.target==='pt'||(!q.target&&['Tradução','Áudio','Gramática','Monte a frase','Complete a frase'].includes(q.type))}
function check(v){v=String(v||'');if(locked||!v.trim())return;stopSpeech();let q=queue[pos];if(q.bank&&picked.length!==q.bank.length)return;locked=true;let variants=[q.answer,...(Array.isArray(q.accept)?q.accept:[])],ok=variants.some(a=>norm(v)===norm(a)),accent=ok&&isPortuguese(q)&&!variants.some(a=>canonical(v)===canonical(a));feedback={ok,accent,input:v};draftText=v;let key=errorKey(q);if(ok){score++;S.xp+=10;delete S.errors[key]}else S.errors[key]=q;let day=new Date().toLocaleDateString('en-CA');if(!S.days.includes(day))S.days.push(day);persist();render()}
function acceptSelf(){let q=queue[pos];if(!locked||!feedback||feedback.ok||!q.selfCheck)return;feedback.ok=true;feedback.self=true;score++;S.xp+=10;delete S.errors[errorKey(q)];persist();render()}
function writtenAlternative(){if(locked)return;const q=queue[pos];if(!q.listen)return;let fallback=q.fallback;if(!fallback&&typeof q.ex==='string'){let split=q.ex.split(' — ');if(split.length===2&&split[1].trim())fallback={type:'Leitura',prompt:q.listen,answer:split[1],target:'ru',ex:q.ex}}if(fallback){queue[pos]={...fallback};draftText='';picked=[];persist();render();return}queue.splice(pos,1);skipped++;draftText='';picked=[];if(pos>=queue.length)finish();else{persist();render()}}
function finish(){let k=draftKey();if(!review&&queue.length&&score/queue.length>=.8&&!S.done.includes(active))S.done.push(active);delete S.drafts[k];if(S.resume===k)S.resume=Object.keys(S.drafts).find(k=>validDraft(S.drafts[k]))||null;pos=queue.length;locked=false;save();go('result')}
function next(){if(!locked)return;stopSpeech();pos++;locked=false;feedback=null;draftText='';picked=[];if(pos>=queue.length)finish();else{persist();render()}}
function filterWords(v){document.querySelectorAll('.word').forEach(e=>e.hidden=!norm(e.textContent).includes(norm(v)))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='progresso.json';a.click();URL.revokeObjectURL(a.href)}initVoiceEvents();initMic();render();
</script></html>
