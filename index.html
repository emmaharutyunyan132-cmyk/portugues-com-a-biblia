["B2","Jerusalém","Ler uma epístola","Читать послание","bíblico","Dirigir-se a; em resposta a; levar em conta os destinatários.","Dirigir-se a — обращаться к; em resposta a — в ответ на; учитывать адресатов.",[["destinatário coletivo","коллективный адресат"],["saudação epistolar","приветствие в письме"],["exortação","увещевание"],["correspondência antiga","древняя переписка"],["situação comunicativa","коммуникативная ситуация"]],[["Uma epístola dirige-se a destinatários em circunstâncias específicas.","Послание обращено к адресатам в конкретных обстоятельствах."],["Uma exortação pode responder a uma questão da comunidade.","Увещевание может отвечать на вопрос общины."],["A saudação ajuda a identificar a situação comunicativa.","Приветствие помогает определить коммуникативную ситуацию."]],{"example":0,"answer":"dirige-se a"},["Объясни, как адресат помогает понять письмо.","Explique como o destinatário ajuda a compreender uma carta.","Uma carta é escrita para alguém em determinada situação. Conhecer o destinatário ajuda a compreender as referências e os pedidos. Sem esse contexto, o leitor pode aplicar uma orientação de modo inadequado."]],
["B2","Betânia","Atos e a expansão das comunidades","Деяния и распространение общин","bíblico","À medida que + indicativo expressa desenvolvimento proporcional.","À medida que + indicativo — по мере того как.",[["expansão","расширение"],["deslocamento geográfico","географическое перемещение"],["comunidade nascente","зарождающаяся община"],["circulação","распространение"],["trajetória histórica","исторический путь"]],[["À medida que o relato de Atos avança, aparecem novos lugares e comunidades.","По мере развития повествования Деяний появляются новые места и общины."],["Os deslocamentos ajudam a organizar a trajetória narrativa.","Перемещения помогают организовать ход повествования."],["O leitor pode acompanhar a circulação das mensagens no texto.","Читатель может проследить распространение посланий в тексте."]],{"example":0,"answer":"À medida que"},["Опиши, как отслеживать географию повествования Деяний.","Descreva como acompanhar a geografia de uma narrativa de Atos.","Primeiro, registro os lugares citados na passagem. Depois, observo a sequência dos deslocamentos e quem participa deles. Esse procedimento permite acompanhar o desenvolvimento narrativo sem inventar informações geográficas."]],
["B2","Nazaré","Romanos e a argumentação","Послание к Римлянам и аргументация","bíblico","Uma vez que pode indicar causa; daí que introduz consequência com subjuntivo em registro formal.","Uma vez que — поскольку; daí que — отсюда следует, часто с subjuntivo в формальном стиле.",[["encadeamento argumentativo","связь аргументов"],["premissa explícita","явная посылка"],["justificação","оправдание, обоснование"],["conclusão lógica","логическое заключение"],["argumento teológico","богословский довод"]],[["Uma vez que o texto desenvolve uma argumentação, convém observar seus conectores.","Поскольку текст развивает аргументацию, стоит обратить внимание на связки."],["Em Romanos, diferentes temas são articulados ao longo da carta.","В Послании к Римлянам различные темы связываются на протяжении письма."],["Uma conclusão precisa ser compreendida em relação às premissas.","Заключение нужно понимать в связи с посылками."]],{"example":0,"answer":"Uma vez que"},["Объясни метод чтения аргументации в послании.","Explique um método de leitura argumentativa de uma epístola.","Identifico primeiro a afirmação que o autor desenvolve. Em seguida, procuro os conectores de causa, contraste e conclusão. Por fim, resumo o encadeamento em minhas palavras e comparo o resumo com a passagem."]],
["B2","Galileia","O sentido de aliança","Смысл завета","bíblico","Conforme o contexto; referir-se a diferentes relações.","Conforme o contexto — в зависимости от контекста; referir-se a — относиться к.",[["aliança","завет, союз"],["pacto","соглашение"],["promessa solene","торжественное обещание"],["compromisso mútuo","взаимное обязательство"],["continuidade histórica","историческая преемственность"]],[["A palavra aliança pode referir-se a diferentes relações conforme o contexto.","Слово aliança может относиться к различным отношениям в зависимости от контекста."],["Um pacto envolve compromissos cuja natureza precisa ser examinada.","Соглашение включает обязательства, характер которых нужно изучить."],["A tradução deve preservar o sentido adotado na passagem.","Перевод должен сохранять смысл, принятый в отрывке."]],{"example":0,"answer":"referir-se a"},["Сравни aliança как библейский и повседневный термин.","Compare aliança como termo bíblico e como palavra cotidiana.","Em determinados textos bíblicos, aliança designa uma relação marcada por compromissos. No cotidiano brasileiro, a palavra também pode significar um anel ou um acordo entre grupos. O tradutor deve escolher o equivalente conforme o contexto."]],
["B2","Jerusalém","Graça e mérito","Благодать и заслуга","bíblico","Não equivale a; distinguir X de Y evita confundir conceitos.","Não equivale a — не равнозначно; distinguir X de Y — отличать X от Y.",[["mérito","заслуга"],["gratuidade","безвозмездность"],["favor","благоволение, услуга"],["distinção conceitual","понятийное различие"],["interpretação teológica","богословское толкование"]],[["Graça não equivale necessariamente a mérito em uma discussão teológica.","Благодать не обязательно равнозначна заслуге в богословской дискуссии."],["No cotidiano, de graça costuma indicar ausência de pagamento.","В повседневной речи de graça обычно означает отсутствие оплаты."],["A distinção conceitual evita traduções inadequadas.","Понятийное различие предотвращает неточные переводы."]],{"example":0,"answer":"não equivale"},["Объясни два употребления graça, не смешивая их.","Explique dois usos de graça sem confundi-los.","Na linguagem religiosa, graça pode designar o favor divino. Em uma conversa comercial, de graça indica que algo é oferecido sem pagamento. Os dois usos pertencem a contextos diferentes e exigem traduções adequadas."]],
["B2","Betânia","Arrependimento e mudança","Покаяние и изменение","bíblico","Não basta + infinitivo; pressupõe que + subjuntivo quando se trata de condição.","Não basta — недостаточно; pressupõe que + subjuntivo при условии.",[["contrição","сокрушение"],["mudança de conduta","изменение поведения"],["reparação possível","возможное возмещение вреда"],["reconhecimento de erro","признание ошибки"],["responsabilidade pessoal","личная ответственность"]],[["Não basta reconhecer um erro quando ainda é possível reparar suas consequências.","Недостаточно признать ошибку, когда ещё возможно исправить её последствия."],["Uma mudança de conduta pode exigir tempo e apoio.","Изменение поведения может требовать времени и поддержки."],["A palavra arrependimento assume nuances diferentes conforme o contexto.","Слово «покаяние» приобретает разные оттенки по контексту."]],{"example":0,"answer":"Não basta"},["Различи раскаяние, признание и исправление вреда в вымышленной ситуации.","Diferencie arrependimento, reconhecimento e reparação numa situação fictícia.","Uma personagem percebe que divulgou uma informação incorreta. Ela reconhece o erro e lamenta suas consequências. Para reparar o problema, corrige a informação e procura evitar que a situação se repita."]],
["B2","Nazaré","O conceito de reconciliação","Понятие примирения","bíblico","Depender de + substantivo; desde que + subjuntivo estabelece condição.","Depender de — зависеть от; desde que + subjuntivo — при условии.",[["reciprocidade","взаимность"],["reconstrução","восстановление"],["consentimento","согласие"],["relação interpessoal","межличностные отношения"],["limites mútuos","взаимные границы"]],[["A reconciliação pode ocorrer desde que ambas as partes desejem restabelecer o diálogo.","Примирение возможно при условии, что обе стороны хотят восстановить диалог."],["A reconstrução da confiança depende de atitudes concretas.","Восстановление доверия зависит от конкретных поступков."],["O respeito aos limites mútuos continua necessário.","Уважение взаимных границ остаётся необходимым."]],{"example":0,"answer":"desejem"},["Проанализируй вымышленное примирение с уважением самостоятельности сторон.","Analise uma reconciliação fictícia respeitando a autonomia das partes.","As duas pessoas podem reconhecer o conflito e decidir se desejam conversar. Caso ambas concordem, podem esclarecer as diferenças. A reconciliação não exige abandonar limites nem aceitar uma situação insegura."]],
["B2","Galileia","Esperança e linguagem figurada","Надежда и образная речь","bíblico","Não implica que + subjuntivo; sem que + subjuntivo.","Não implica que + subjuntivo — не означает, что; sem que — без того чтобы.",[["horizonte","горизонт"],["adversidade","неблагоприятное обстоятельство"],["alento","ободрение"],["expectativa fundamentada","обоснованное ожидание"],["imagem de futuro","образ будущего"]],[["Ter esperança não implica que todas as dificuldades desapareçam.","Иметь надежду не означает, что все трудности исчезнут."],["Uma imagem de horizonte pode representar novas possibilidades.","Образ горизонта может обозначать новые возможности."],["É possível oferecer alento sem que se façam promessas infundadas.","Можно ободрять, не давая необоснованных обещаний."]],{"example":0,"answer":"desapareçam"},["Напиши размышление о надежде без обещаний результата.","Escreva uma reflexão sobre esperança sem prometer resultados.","A esperança pode ajudar uma pessoa a reconhecer possibilidades em meio à dificuldade. Isso não significa que todos os problemas desaparecerão. Podemos confiar em Deus e, ao mesmo tempo, procurar apoio e agir com prudência."]],
["B2","Jerusalém","A linguagem do serviço","Язык служения","bíblico","Estar a serviço de; colocar algo à disposição de.","Estar a serviço de — служить кому-либо; colocar à disposição — предоставлять.",[["serviço voluntário","добровольное служение"],["disposição","готовность"],["cooperação comunitária","сотрудничество в общине"],["compromisso responsável","ответственное обязательство"],["distribuição de funções","распределение ролей"]],[["A equipe colocou os materiais à disposição dos participantes.","Команда предоставила материалы участникам."],["O serviço voluntário pressupõe uma escolha livre.","Добровольное служение предполагает свободный выбор."],["A distribuição de funções deve respeitar as possibilidades de cada pessoa.","Распределение ролей должно учитывать возможности каждого."]],{"example":0,"answer":"à disposição"},["Опиши принципы ответственного служения общине.","Descreva princípios de um serviço comunitário responsável.","O serviço comunitário pode beneficiar pessoas quando respeita suas necessidades. A participação deve ser voluntária, e as funções precisam ser claras. A equipe pode oferecer apoio sem ultrapassar os limites de seus integrantes."]],
["B2","Betânia","Discernimento e orientação","Рассудительность и наставление","bíblico","Por um lado... por outro lado... pondera perspectivas.","Por um lado… por outro lado… — с одной стороны… с другой стороны.",[["discernimento crítico","критическая рассудительность"],["ponderação ética","этическое взвешивание"],["critério de avaliação","критерий оценки"],["orientação responsável","ответственное наставление"],["consequência prática","практическое последствие"]],[["Por um lado, um conselho pode oferecer uma perspectiva nova.","С одной стороны, совет может предложить новый взгляд."],["Por outro lado, precisamos avaliar suas consequências práticas.","С другой стороны, нужно оценить его практические последствия."],["O discernimento inclui formular perguntas e considerar alternativas.","Рассудительность включает вопросы и рассмотрение альтернатив."]],{"example":0,"answer":"Por um lado"},["Оцени вымышленный совет, представив преимущества и ограничения.","Avalie um conselho fictício apresentando vantagens e limites.","Um colega sugeriu estudar em grupo. Por um lado, a troca de ideias pode facilitar a compreensão. Por outro, o horário precisa ser compatível com o descanso e as tarefas de todos. A decisão depende das circunstâncias."]],
["B2","Nazaré","A linguagem da hospitalidade","Язык гостеприимства","bíblico","Caso haja necessidade; esteja à vontade para + infinitivo.","Caso haja necessidade — при необходимости; esteja à vontade para — не стесняйтесь.",[["hospitalidade","гостеприимство"],["acolhida","радушный приём"],["atendimento respeitoso","уважительное обслуживание"],["informação acessível","доступная информация"],["recepcionar","встречать"]],[["Caso haja necessidade, podemos explicar novamente as orientações.","При необходимости можем ещё раз объяснить указания."],["Esteja à vontade para fazer perguntas sobre a atividade.","Не стесняйтесь задавать вопросы о мероприятии."],["A hospitalidade inclui disponibilizar informações de modo acessível.","Гостеприимство включает предоставление информации понятным способом."]],{"example":0,"answer":"haja"},["Составь ясное приветствие без давления.","Elabore uma mensagem de boas-vindas clara e sem pressão.","Seja bem-vindo ao nosso encontro de leitura. Caso queira conhecer a programação, podemos explicá-la com calma. Você pode participar das atividades que desejar ou apenas observar."]],
["B2","Galileia","A relação entre texto e tradução","Связь текста и перевода","bíblico","Em vez de reproduzir a forma, procurar preservar a função comunicativa.","Вместо воспроизведения формы стремиться сохранить коммуникативную функцию.",[["função comunicativa","коммуникативная функция"],["equivalência funcional","функциональная эквивалентность"],["fidelidade semântica","смысловая точность"],["estrutura de origem","исходная структура"],["língua de chegada","язык перевода"]],[["Em vez de reproduzir a ordem das palavras, o tradutor pode preservar a função comunicativa.","Вместо воспроизведения порядка слов переводчик может сохранить коммуникативную функцию."],["A estrutura de origem nem sempre é natural na língua de chegada.","Исходная структура не всегда естественна на языке перевода."],["A fidelidade semântica exige atenção aos elementos essenciais da mensagem.","Смысловая точность требует внимания к главным элементам послания."]],{"example":0,"answer":"Em vez de"},["Объясни, почему точный перевод не обязательно пословный.","Explique por que a tradução fiel não precisa ser palavra por palavra.","A ordem das palavras varia entre português e russo. Uma tradução literal pode produzir uma frase estranha ou mudar a ênfase. Por isso, preservo o sentido e procuro uma estrutura natural na língua de chegada."]],
["B2","Jerusalém","Equivalência lexical","Лексическая эквивалентность","bíblico","Nem sempre + indicativo; recorrer a + nome.","Nem sempre — не всегда; recorrer a — прибегать к.",[["lacuna lexical","лексический пробел"],["circunlóquio","описательный оборот"],["acepção contextual","контекстное значение"],["equivalência funcional","функциональная эквивалентность"]],[["Nem sempre há um equivalente direto entre duas línguas.","Между двумя языками не всегда есть прямое соответствие."],["Podemos recorrer a uma explicação breve.","Можно прибегнуть к короткому объяснению."],["A acepção contextual orienta a escolha do termo.","Контекстное значение направляет выбор термина."]],{"example":0,"answer":"há"},["Объясни перевод термина без прямого эквивалента.","Explique como traduzir um termo sem equivalente direto.","Primeiro, identifico o sentido do termo. Se não houver equivalente direto, procuro uma expressão descritiva que preserve a ideia. A explicação deve ser proporcional ao original."]],
["B2","Betânia","Falsos cognatos","Ложные друзья переводчика","bíblico","Ao contrário do que parece introduz contraste.","Ao contrário do que parece — вопреки впечатлению.",[["falso cognato","ложный друг переводчика"],["semelhança formal","формальное сходство"],["interferência linguística","языковая интерференция"],["consulta lexical","словарная проверка"]],[["Ao contrário do que parece, uma palavra semelhante pode ter outro sentido.","Вопреки впечатлению, похожее слово может иметь другой смысл."],["A interferência linguística pode causar erros.","Языковая интерференция может вызывать ошибки."],["Convém consultar um dicionário em caso de dúvida.","При сомнении стоит обратиться к словарю."]],{"example":0,"answer":"Ao contrário do que parece"},["Объясни риск перевода слова по внешнему сходству.","Explique o risco de traduzir uma palavra pela aparência.","Em português, família designa um grupo de parentes. Uma palavra russa de som semelhante pode designar o sobrenome de uma pessoa. Por isso, verifico a definição e o contexto antes de traduzir."]],
["B2","Galileia","Os sentidos de obra","Значения obra","bíblico","Conforme se trate de X ou Y exprime variação.","Conforme se trate de — в зависимости от того, о чём речь.",[["obra literária","литературное произведение"],["obra de construção","строительные работы"],["atividade ministerial","церковное служение"],["polissemia lexical","лексическая многозначность"]],[["A tradução de obra varia conforme se trate de um livro ou de uma atividade.","Перевод obra меняется в зависимости от того, речь о книге или деятельности."],["Obra de Deus pode designar o serviço a Deus.","Obra de Deus может обозначать служение Богу."],["A mesma palavra exige atenção ao contexto.","Одно и то же слово требует внимания к контексту."]],{"example":0,"answer":"se trate"},["Сравни три значения obra.","Compare três sentidos de obra.","Uma obra literária é uma criação escrita. Uma obra de construção é um trabalho de construção. Na linguagem da igreja, obra de Deus pode referir-se ao serviço religioso."]],
["B2","Nazaré","Crer e confiar","Верить и доверять","bíblico","Crer em, confiar em, ter fé em: regência e nuance.","Crer em, confiar em, ter fé em: управление и оттенки.",[["convicção religiosa","религиозное убеждение"],["confiança mútua","взаимное доверие"],["nuance","оттенок"],["adesão","принятие"]],[["Crer em Deus e confiar em Deus são expressões próximas, mas distintas.","Верить в Бога и доверять Богу — близкие, но разные выражения."],["A escolha depende da nuance pretendida.","Выбор зависит от нужного оттенка."],["Ter fé em alguém pode expressar confiança em sua capacidade.","Верить в кого-то может означать доверие к его способностям."]],{"example":0,"answer":"Crer em"},["Сравни crer em, confiar em и ter fé em.","Compare crer em, confiar em e ter fé em.","Eu creio em Deus é uma declaração de fé. Confio em uma colega expressa confiança nessa pessoa. Tenho fé na capacidade da equipe indica uma expectativa positiva."]],
["B2","Jerusalém","Precisão dos números","Точность чисел","bíblico","Cerca de indica aproximação; exatamente indica precisão.","Cerca de — около; exatamente — точно.",[["aproximação numérica","числовое приближение"],["quantidade exata","точное количество"],["intervalo numérico","числовой диапазон"],["arredondamento","округление"]],[["O orador mencionou cerca de cinquenta participantes.","Выступающий упомянул около пятидесяти участников."],["Uma estimativa não equivale a um número exato.","Оценка не равнозначна точному числу."],["O intervalo deve ser preservado na tradução.","Диапазон следует сохранять в переводе."]],{"example":0,"answer":"cerca de"},["Объясни, как сохранять приблизительные числа.","Explique como preservar números aproximados.","Se o aviso informa que haverá entre vinte e trinta lugares, devo preservar o intervalo. Não seria correto afirmar que haverá exatamente trinta. A incerteza faz parte da informação."]],
["B2","Betânia","Referências bíblicas por extenso","Библейские ссылки словами","bíblico","Capítulo, versículo; de X a Y indica intervalo.","Capítulo — глава, versículo — стих; de X a Y — диапазон.",[["referência cruzada","перекрёстная ссылка"],["abreviatura","сокращение"],["numeração","нумерация"],["intervalo de versículos","диапазон стихов"]],[["O estudo remete a João, capítulo quinze, versículos um a cinco.","Занятие отсылает к Иоанну, глава пятнадцать, стихи с первого по пятый."],["As abreviaturas variam conforme a edição.","Сокращения различаются в зависимости от издания."],["Convém conferir a numeração da tradução utilizada.","Стоит сверять нумерацию используемого перевода."]],{"example":0,"answer":"versículos um a cinco"},["Напиши три библейские ссылки словами.","Escreva três referências bíblicas por extenso.","João, capítulo três, versículo dezesseis. Salmos, capítulo um, versículos um a três. Atos dos Apóstolos, capítulo quatro, versículo treze."]],

["B2","Galileia","Notas na interpretação","Заметки при устном переводе","bíblico","Ao + infinitivo exprime simultaneidade.","Ao + инфинитив выражает одновременность.",[["tomada de notas","ведение заметок"],["palavra-chave","ключевое слово"],["reconstrução discursiva","восстановление речи"],["símbolo gráfico","графический символ"]],[["Ao ouvir o segmento, registre as ideias-chave.","Слушая фрагмент, записывай ключевые мысли."],["As notas não precisam repetir cada palavra.","Заметки не должны повторять каждое слово."],["Reconstrua o sentido com coerência.","Связно восстанавливай смысл."]],{"example":0,"answer":"Ao ouvir"},["Опиши метод ведения заметок.","Descreva um método de anotações.","Registro o tema, os fatos e suas relações. Marco números e condições que não posso esquecer. Ao traduzir, uso as notas como apoio, sem inventar informações."]],
["B2","Nazaré","Segmentação do discurso","Деление речи на фрагменты","bíblico","À medida que + indicativo indica desenvolvimento.","À medida que + indicativo — по мере того как.",[["segmentação","сегментация"],["unidade de sentido","смысловая единица"],["carga cognitiva","когнитивная нагрузка"],["transição","переход"]],[["À medida que surgem novas ideias, identificamos unidades de sentido.","По мере появления новых мыслей выделяем смысловые единицы."],["A segmentação ajuda a organizar a informação.","Деление помогает организовать информацию."],["Uma transição marca a passagem a outro ponto.","Переход обозначает смену мысли."]],{"example":0,"answer":"À medida que"},["Раздели организационное послание на три фрагмента.","Divida uma mensagem de organização em três segmentos.","O primeiro segmento apresenta o objetivo do encontro. O segundo explica a distribuição das tarefas. O terceiro informa como comunicar uma alteração."]],

["B2","Nazaré","Confidencialidade","Конфиденциальность","bíblico","Desde que haja + nome; sem revelar + nome.","Desde que haja — при наличии; sem revelar — не раскрывая.",[["confidencialidade","конфиденциальность"],["dados pessoais","личные данные"],["consentimento informado","информированное согласие"],["anonimização","обезличивание"]],[["Uma história pessoal pode ser compartilhada desde que haja consentimento adequado.","Личной историей можно делиться при надлежащем согласии."],["A anonimização reduz a exposição de dados pessoais.","Обезличивание сокращает раскрытие личных данных."],["Um exercício pode usar situações fictícias.","Упражнение может использовать вымышленные ситуации."]],{"example":0,"answer":"haja consentimento"},["Объясни, как сохранять конфиденциальность в учебных примерах.","Explique como preservar a privacidade em exemplos didáticos.","Prefiro personagens e circunstâncias fictícias. Se um texto real for necessário, verifico as permissões e retiro dados identificadores. O estudo não precisa expor a vida de terceiros."]],
["B2","Jerusalém","Ética na interpretação","Этика устного перевода","bíblico","Cabe a alguém + infinitivo; não lhe cabe + infinitivo.","Cabe a alguém — обязанность; não lhe cabe — не его задача.",[["imparcialidade","беспристрастность"],["competência profissional","профессиональная компетентность"],["limites profissionais","профессиональные границы"],["responsabilidade comunicativa","коммуникативная ответственность"]],[["Cabe ao intérprete transmitir a mensagem com fidelidade.","Переводчик обязан точно передавать послание."],["Não lhe cabe inserir sua opinião na fala do orador.","Не его задача вставлять своё мнение в речь выступающего."],["Reconhecer os próprios limites é parte da responsabilidade.","Признание своих ограничений — часть ответственности."]],{"example":0,"answer":"Cabe ao intérprete"},["Проанализируй вымышленное разногласие переводчика и оратора.","Analise um caso fictício de discordância entre intérprete e orador.","Se discordasse do orador, procuraria ainda preservar sua mensagem. Não apresentaria minha opinião como parte do original. Se não pudesse realizar a tarefa adequadamente, explicaria a dificuldade separadamente."]],
["B2","Betânia","Avaliação da interpretação","Оценка устного перевода","bíblico","Ainda que + subjuntivo admite contraste.","Ainda que + subjuntivo — даже если.",[["critério de fidelidade","критерий точности"],["fluidez","плавность"],["omissão relevante","существенное упущение"],["variação estilística","стилистическое различие"]],[["Ainda que duas traduções sejam diferentes, ambas podem preservar o sentido.","Даже если два перевода различаются, оба могут сохранять смысл."],["Uma omissão relevante precisa ser corrigida.","Существенное упущение нужно исправить."],["A avaliação distingue conteúdo e estilo.","Оценка различает содержание и стиль."]],{"example":0,"answer":"sejam"},["Создай критерии оценки без требования одинаковых слов.","Crie critérios de avaliação sem exigir palavras idênticas.","Avalio se as informações essenciais foram preservadas, se os vínculos lógicos estão claros e se a linguagem é natural. Variações estilísticas podem ser aceitáveis. Alterações de fatos ou condições exigem revisão."]],
["B2","Jericó","Defender uma tese","Защищать тезис","Brasil","Sustentar que + indicativo; ainda que + subjuntivo para objeção.","Sustentar que + indicativo — утверждать; ainda que + subjuntivo — уступка.",[["tese central","главный тезис"],["argumento contrário","контраргумент"],["refutação","опровержение"],["sustentação","обоснование"],["pertinência","уместность"]],[["Sustento que a proposta merece uma avaliação cuidadosa.","Я утверждаю, что предложение заслуживает тщательной оценки."],["Ainda que existam objeções, podemos examinar os benefícios.","Даже если есть возражения, можно изучить преимущества."],["A pertinência de um argumento depende do tema discutido.","Уместность довода зависит от обсуждаемой темы."]],{"example":0,"answer":"Sustento que"},["Обоснуй предложение улучшить школьную библиотеку и рассмотри возражение.","Defenda uma proposta para melhorar uma biblioteca escolar e considere uma objeção.","Defendo que a biblioteca tenha um espaço de leitura silenciosa. Isso facilitaria a concentração dos estudantes. Ainda que haja pouco espaço, seria possível reorganizar parte das mesas. A proposta precisa considerar também quem trabalha em grupo."]],
["B2","Galileia","Distinguir fato e opinião","Различать факт и мнение","Brasil","O fato de que introduz informação; na avaliação de atribui opinião.","O fato de que вводит сообщение; na avaliação de указывает автора оценки.",[["afirmação verificável","проверяемое утверждение"],["juízo de valor","оценочное суждение"],["viés","предвзятость"],["verificação independente","независимая проверка"],["subjetividade","субъективность"]],[["Na avaliação da autora, a exposição foi bem organizada.","По оценке автора, выставка была хорошо организована."],["A data da inauguração é uma informação verificável.","Дата открытия — проверяемая информация."],["Um juízo de valor pode depender da experiência pessoal.","Оценочное суждение может зависеть от личного опыта."]],{"example":0,"answer":"Na avaliação da"},["Напиши вымышленную заметку с двумя фактами и явно обозначенным мнением.","Escreva uma nota fictícia com dois fatos e uma opinião claramente identificada.","A exposição fictícia abriu na segunda-feira e reúne vinte obras. Esses dados fazem parte do cenário imaginado. Na minha avaliação, a disposição das obras facilita a visita. Outro visitante poderia preferir uma organização diferente."]],
["B2","Nazaré","Analisar fontes de informação","Анализировать источники","Brasil","Não se pode concluir que + subjuntivo; verificar se + indicativo.","Não se pode concluir que + subjuntivo; verificar se + indicativo.",[["credibilidade","достоверность"],["rastreabilidade","прослеживаемость"],["fonte primária","первичный источник"],["corroboração independente","независимое подтверждение"],["descontextualização","изъятие из контекста"]],[["Não se pode concluir que uma informação seja verdadeira apenas porque circula muito.","Нельзя заключить, что информация верна, только потому что её широко распространяют."],["Uma fonte primária pode ajudar a verificar a origem de uma afirmação.","Первичный источник может помочь проверить происхождение утверждения."],["É importante examinar a data e o contexto da publicação.","Важно изучить дату и контекст публикации."]],{"example":0,"answer":"seja"},["Предложи метод проверки вымышленной новости.","Proponha um método de verificação de uma notícia fictícia.","Antes de compartilhar a notícia, identificaria o autor e a data. Procuraria a fonte primária e outras fontes independentes. Se os relatos divergissem, indicaria o que ainda não foi confirmado."]],
["B2","Betânia","Avaliar dados e tendências","Оценивать данные и тенденции","Brasil","Em comparação com; de X para Y; não confundir proporção com quantidade.","Em comparação com — по сравнению с; de X para Y — от X до Y; различать долю и количество.",[["amostra","выборка"],["tendência","тенденция"],["proporção","доля"],["variação percentual","процентное изменение"],["representatividade","репрезентативность"]],[["Em comparação com o mês anterior, houve aumento no número de respostas.","По сравнению с прошлым месяцем число ответов увеличилось."],["Uma amostra pequena pode não representar todo o grupo.","Малая выборка может не представлять всю группу."],["A proporção deve ser interpretada junto com a quantidade total.","Долю следует интерпретировать вместе с общим количеством."]],{"example":0,"answer":"Em comparação com"},["Интерпретируй вымышленные данные: 20 ответов в мае и 30 в июне, без обобщений.","Interprete dados fictícios: vinte respostas em maio e trinta em junho, sem generalizar.","Em junho, o número de respostas foi maior do que em maio. Houve dez respostas a mais, o que corresponde a um aumento de cinquenta por cento em relação a maio. Esses números, porém, não mostram por si só o motivo da mudança."]],
["B2","Jericó","Explicar causa e correlação","Объяснять причины и корреляции","Brasil","Não significa necessariamente que + subjuntivo; decorrer de indica origem.","Não significa necessariamente que + subjuntivo — не обязательно означает; decorrer de — происходить из.",[["correlação","корреляция"],["causalidade","причинность"],["variável","переменная"],["fator interveniente","промежуточный фактор"],["generalização indevida","необоснованное обобщение"]],[["Uma correlação não significa necessariamente que uma variável cause a outra.","Корреляция не обязательно означает, что одна переменная вызывает другую."],["Uma mudança pode decorrer de vários fatores.","Изменение может происходить по нескольким причинам."],["É preciso considerar explicações alternativas.","Нужно учитывать альтернативные объяснения."]],{"example":0,"answer":"cause"},["Объясни, почему два одновременных события не доказывают причинность.","Explique por que dois acontecimentos simultâneos não provam causalidade.","Imagine que uma escola tenha adquirido livros e recebido mais visitantes no mesmo período. A coincidência não prova que os livros causaram o aumento. Outros fatores, como uma nova programação, poderiam explicar a mudança."]],
["B2","Galileia","Escrever uma solicitação acadêmica","Писать академический запрос","Brasil","Venho solicitar; gostaria de saber se; agradeço antecipadamente.","Venho solicitar — обращаюсь с просьбой; gostaria de saber se — хотела бы узнать; agradeço antecipadamente — заранее благодарю.",[["requerimento","заявление"],["documentação","документация"],["pré-requisito","предварительное требование"],["processo seletivo","отборочный процесс"],["esclarecimento adicional","дополнительное разъяснение"]],[["Venho solicitar informações sobre os pré-requisitos do curso.","Обращаюсь с просьбой предоставить сведения о предварительных требованиях курса."],["Gostaria de saber se a documentação pode ser enviada por meio eletrônico.","Хотела бы узнать, можно ли отправить документы электронно."],["Agradeço antecipadamente pelos esclarecimentos.","Заранее благодарю за разъяснения."]],{"example":0,"answer":"Venho solicitar"},["Напиши вымышленное письмо с запросом учебной информации без личных данных.","Redija um e-mail fictício pedindo informações acadêmicas sem dados pessoais.","Prezados, gostaria de obter informações sobre os requisitos de uma atividade acadêmica. Poderiam esclarecer quais documentos são necessários e se há um prazo específico? Agradeço antecipadamente pela atenção. Atenciosamente, uma candidata fictícia."]],
["B2","Nazaré","Preparar uma entrevista","Готовиться к собеседованию","Brasil","Caso me perguntassem, responderia; evidenciar competência sem exageros.","Caso me perguntassem, responderia — если бы меня спросили, я бы ответила; показывать навыки без преувеличения.",[["competência","компетенция"],["qualificação","квалификация"],["experiência relevante","соответствующий опыт"],["capacidade de adaptação","способность адаптироваться"],["objetividade","объективность"]],[["Caso me perguntassem sobre minhas habilidades, apresentaria exemplos concretos.","Если бы меня спросили о навыках, я бы привела конкретные примеры."],["Uma resposta objetiva deve distinguir experiência e expectativa.","Объективный ответ должен различать опыт и ожидание."],["Não convém exagerar a própria qualificação.","Не стоит преувеличивать свою квалификацию."]],{"example":0,"answer":"perguntassem"},["Составь ответ на собеседовании для вымышленного начинающего персонажа.","Simule uma resposta de entrevista para uma personagem fictícia iniciante.","Ainda não tenho experiência profissional na área, mas participei de projetos escolares. Nessas atividades, aprendi a organizar materiais e colaborar com colegas. Gostaria de desenvolver novas habilidades com orientação adequada."]],
["B2","Betânia","Discutir escolhas educacionais","Обсуждать образовательный выбор","Brasil","Se por um lado... por outro...; ponderar em função de.","Se por um lado… por outro… — с одной стороны… с другой; ponderar em função de — взвешивать с учётом.",[["currículo","учебная программа"],["percurso acadêmico","академический путь"],["especialização","специализация"],["interdisciplinaridade","междисциплинарность"],["perspectiva profissional","профессиональная перспектива"]],[["Se por um lado a especialização aprofunda um tema, por outro limita o tempo disponível para outras áreas.","С одной стороны, специализация углубляет тему, с другой — ограничивает время на другие области."],["O currículo deve ser analisado em função dos objetivos de aprendizagem.","Учебную программу следует анализировать с учётом целей обучения."],["A interdisciplinaridade pode ampliar as perspectivas profissionais.","Междисциплинарность может расширить профессиональные перспективы."]],{"example":0,"answer":"Se por um lado"},["Сравни два вымышленных варианта образования с плюсами и ограничениями.","Compare duas opções fictícias de formação com vantagens e limites.","Uma formação mais específica permite aprofundar conhecimentos desde o início. Uma formação interdisciplinar, por sua vez, oferece contato com diferentes áreas. A melhor escolha para uma personagem dependeria de seus interesses, recursos e objetivos."]],
["B2","Jericó","Redigir um relatório","Составлять отчёт","Brasil","Verificou-se que + indicativo; recomenda-se que + subjuntivo.","Verificou-se que + indicativo — установлено; recomenda-se que + subjuntivo — рекомендуется.",[["metodologia","методика"],["constatação","установленный факт"],["indicador","показатель"],["limitação metodológica","методологическое ограничение"],["recomendação","рекомендация"]],[["Verificou-se que os materiais foram distribuídos conforme o planejamento.","Установлено, что материалы распределили согласно плану."],["Recomenda-se que a equipe registre as alterações futuras.","Рекомендуется, чтобы команда фиксировала будущие изменения."],["O relatório deve explicitar suas limitações metodológicas.","Отчёт должен явно указывать методологические ограничения."]],{"example":0,"answer":"Verificou-se que"},["Составь вымышленный отчёт о школьном мероприятии с результатом и рекомендацией.","Produza um relatório fictício de atividade escolar com resultado e recomendação.","A atividade foi realizada em dois grupos, conforme o planejamento. Verificou-se que todos os materiais previstos estavam disponíveis. Como não houve avaliação individual, não é possível concluir quanto cada participante aprendeu. Recomenda-se incluir uma pergunta de revisão no próximo encontro."]],
["B2","Galileia","Planejar com recursos limitados","Планировать при ограниченных ресурсах","Brasil","Diante de + nome; a menos que + subjuntivo para exceção.","Diante de — перед лицом; a menos que + subjuntivo — если только не.",[["restrição orçamentária","бюджетное ограничение"],["alocação","распределение"],["otimização","оптимизация"],["contingenciamento","ограничение расходов"],["alternativa viável","осуществимая альтернатива"]],[["Diante de uma restrição orçamentária, precisamos priorizar as despesas essenciais.","При бюджетном ограничении нужно выделить существенные расходы."],["O plano será mantido, a menos que surja uma alternativa mais viável.","План сохранится, если только не появится более осуществимая альтернатива."],["A alocação dos recursos deve ser transparente.","Распределение ресурсов должно быть прозрачным."]],{"example":0,"answer":"Diante de"},["Обоснуй вымышленный план с ограниченными ресурсами.","Justifique um plano fictício com recursos limitados.","O projeto possui recursos suficientes para os materiais básicos, mas não para todos os itens opcionais. Por isso, proponho aproveitar materiais já disponíveis. Se surgir uma alternativa mais econômica e adequada, poderemos reconsiderar a distribuição."]],
["B2","Nazaré","Negociar uma solução","Согласовывать решение","Brasil","Estaria disposto a + infinitivo; desde que + subjuntivo.","Estaria disposto a — был бы готов; desde que + subjuntivo — при условии.",[["concessão mútua","взаимная уступка"],["impasse","тупик"],["condição negociável","обсуждаемое условие"],["contrapartida","встречное обязательство"],["mediação","посредничество"]],[["Estaria disposto a reconsiderar o prazo, desde que o conteúdo não seja reduzido.","Я был бы готов пересмотреть срок, при условии, что содержание не сократят."],["Uma concessão mútua pode ajudar a superar o impasse.","Взаимная уступка может помочь преодолеть тупик."],["A mediação procura facilitar o diálogo entre as partes.","Посредничество направлено на облегчение диалога сторон."]],{"example":0,"answer":"seja reduzido"},["Напиши диалог переговоров о групповой работе.","Escreva um diálogo de negociação sobre um trabalho em grupo.","Ana: Posso aceitar um prazo maior, desde que todos contribuam. Rui: Concordo, mas precisamos dividir as tarefas claramente. Ana: Nesse caso, proponho registrar os compromissos. Rui: Parece uma solução razoável."]],
["B2","Betânia","Reclamar com fundamentação","Обосновывать претензию","Brasil","Solicito a revisão de; tendo em vista que + indicativo.","Solicito a revisão de — прошу пересмотреть; tendo em vista que — учитывая, что.",[["reclamação fundamentada","обоснованная претензия"],["divergência contratual","расхождение с условиями договора"],["registro de atendimento","запись обращения"],["solução solicitada","запрашиваемое решение"],["comprovação","подтверждение"]],[["Solicito a revisão do atendimento, tendo em vista que a informação fornecida foi diferente.","Прошу пересмотреть обслуживание, учитывая, что предоставленные сведения отличались."],["A reclamação deve indicar o problema e a solução solicitada.","Претензия должна указывать проблему и запрашиваемое решение."],["É útil conservar a comprovação das comunicações anteriores.","Полезно сохранять подтверждения предыдущих обращений."]],{"example":0,"answer":"tendo em vista que"},["Напиши вымышленную уважительную претензию о неполной доставке.","Redija uma reclamação fictícia e respeitosa sobre uma entrega incompleta.","Prezados, o pedido fictício chegou com um item a menos do que o previsto. Solicito a verificação da diferença e uma orientação sobre como resolver a situação. Posso apresentar o comprovante correspondente. Agradeço pela atenção."]],
["B2","Jericó","Entender termos de um serviço","Понимать условия услуги","Brasil","Mediante + nome; fica condicionado a; ressalvado o disposto em.","Mediante — посредством, при условии; fica condicionado a — обусловлено; ressalvado — с оговоркой.",[["condição de uso","условие использования"],["renovação automática","автоматическое продление"],["cláusula de cancelamento","условие отмены"],["prazo de vigência","срок действия"],["consentimento expresso","явное согласие"]],[["O acesso ao serviço fica condicionado à aceitação das condições apresentadas.","Доступ к услуге обусловлен принятием представленных условий."],["A renovação poderá ocorrer mediante consentimento expresso.","Продление может происходить при явном согласии."],["Convém verificar a cláusula de cancelamento antes de aceitar.","Стоит проверить условие отмены до принятия."]],{"example":0,"answer":"fica condicionado"},["Перескажи вымышленное условие услуги простым языком.","Parafraseie uma condição fictícia de serviço em linguagem simples.","O texto fictício informa que o serviço termina no fim do período contratado, salvo renovação autorizada. Em linguagem simples, o acesso acaba na data prevista, a menos que o usuário concorde com a renovação. O cancelamento deve ser explicado separadamente."]],
["B2","Galileia","Comunicar um problema técnico","Сообщать о технической проблеме","Brasil","Ocorre quando; desde que foi atualizado indica início temporal.","Ocorre quando — происходит, когда; desde que foi atualizado — с момента обновления.",[["reprodutibilidade","воспроизводимость"],["falha intermitente","периодический сбой"],["ambiente de execução","среда выполнения"],["diagnóstico preliminar","предварительная диагностика"],["comportamento esperado","ожидаемое поведение"]],[["A falha intermitente ocorre quando o aplicativo é aberto novamente.","Периодический сбой происходит при повторном открытии приложения."],["O comportamento esperado é diferente do resultado observado.","Ожидаемое поведение отличается от наблюдаемого результата."],["Um diagnóstico preliminar não confirma necessariamente a causa.","Предварительная диагностика не обязательно подтверждает причину."]],{"example":0,"answer":"ocorre quando"},["Опиши вымышленную техническую ошибку с ожидаемым и наблюдаемым поведением.","Descreva um erro técnico fictício com comportamento esperado e observado.","Ao abrir novamente o aplicativo fictício, a lista aparece vazia. O comportamento esperado seria mostrar os itens que foram salvos. A falha ocorre apenas em algumas tentativas. Ainda não tenho informações suficientes para determinar sua causa."]],
["B2","Nazaré","Segurança e privacidade digital","Цифровая безопасность и конфиденциальность","Brasil","Evitar que + subjuntivo; limitar o acesso a + nome.","Evitar que + subjuntivo — предотвращать; limitar o acesso a — ограничивать доступ к.",[["permissão de acesso","разрешение доступа"],["configuração de privacidade","настройка конфиденциальности"],["exposição indevida","неправомерное раскрытие"],["autenticação","аутентификация"],["minimização de dados","минимизация данных"]],[["Convém limitar as permissões para evitar que informações desnecessárias sejam expostas.","Стоит ограничивать разрешения, чтобы лишние сведения не раскрывались."],["A configuração de privacidade deve ser compreendida antes do compartilhamento.","Настройки конфиденциальности следует понимать до публикации."],["A minimização de dados reduz a quantidade de informação armazenada.","Минимизация данных уменьшает объём хранимой информации."]],{"example":0,"answer":"sejam expostas"},["Объясни принципы конфиденциальности вымышленной платформы.","Explique princípios de privacidade para uma plataforma fictícia.","A plataforma deve solicitar apenas os dados necessários para sua função. É importante explicar as permissões e oferecer controles compreensíveis. Os usuários não devem publicar informações identificadoras em exercícios públicos."]],
["B2","Betânia","Avaliar recursos digitais","Оценивать цифровые ресурсы","Brasil","Não obstante + nome ou oração; em termos de + nome.","Não obstante — несмотря на; em termos de — с точки зрения.",[["usabilidade","удобство использования"],["interoperabilidade","совместимость систем"],["acessibilidade digital","цифровая доступность"],["dependência tecnológica","технологическая зависимость"],["custo operacional","операционные затраты"]],[["Em termos de usabilidade, a interface precisa ser compreensível.","С точки зрения удобства интерфейс должен быть понятным."],["Não obstante suas vantagens, a ferramenta apresenta limitações.","Несмотря на преимущества, инструмент имеет ограничения."],["A acessibilidade digital deve integrar os critérios de avaliação.","Цифровая доступность должна входить в критерии оценки."]],{"example":0,"answer":"Em termos de"},["Сравни два вымышленных цифровых ресурса по явным критериям.","Compare dois recursos digitais fictícios com critérios explícitos.","A ferramenta A oferece uma interface simples, mas exige conexão constante. A ferramenta B funciona com menos dependência da internet, embora tenha menos recursos. A escolha dependeria da acessibilidade, da privacidade e das necessidades do usuário."]],
["B2","Jericó","Discutir uma obra cinematográfica","Обсуждать произведение кино","Brasil","Não se limita a + infinitivo; na medida em que indica relação explicativa.","Não se limita a — не ограничивается; na medida em que — поскольку, в той мере, в какой.",[["linguagem cinematográfica","язык кино"],["composição visual","визуальная композиция"],["arco narrativo","сюжетная дуга"],["montagem cinematográfica","монтаж кино"],["subtexto","подтекст"]],[["A composição visual não se limita a ilustrar a ação.","Визуальная композиция не ограничивается иллюстрацией действия."],["A montagem pode estabelecer relações entre cenas distintas.","Монтаж может устанавливать связи между разными сценами."],["O subtexto depende do que é sugerido, e não apenas do que é dito.","Подтекст зависит от подразумеваемого, а не только от сказанного."]],{"example":0,"answer":"não se limita a"},["Проанализируй сцену вымышленного фильма с учётом изображения и подтекста.","Analise uma cena de filme imaginário considerando imagem e subtexto.","Na cena fictícia, a personagem permanece à janela enquanto os demais conversam. A composição destaca seu distanciamento sem que ela explique seus sentimentos. A montagem alterna o grupo e a janela, sugerindo uma diferença de perspectivas."]],
["B2","Galileia","Escrever uma resenha crítica","Писать критический отзыв","Brasil","Embora + subjuntivo; por sua vez acrescenta contraste ou perspectiva.","Embora + subjuntivo — хотя; por sua vez — в свою очередь.",[["resenha crítica","критическая рецензия"],["mérito artístico","художественное достоинство"],["consistência narrativa","последовательность повествования"],["recurso expressivo","выразительное средство"],["avaliação fundamentada","обоснованная оценка"]],[["Embora o enredo seja simples, os recursos expressivos são variados.","Хотя сюжет прост, выразительные средства разнообразны."],["A trilha sonora, por sua vez, contribui para a atmosfera.","Музыка, в свою очередь, создаёт атмосферу."],["Uma resenha crítica deve justificar suas avaliações.","Критическая рецензия должна обосновывать оценки."]],{"example":0,"answer":"seja"},["Напиши рецензию на полностью вымышленное произведение.","Redija uma resenha de uma obra inteiramente fictícia.","O filme fictício apresenta uma estudante que organiza uma exposição com seus colegas. Embora a história seja previsível, a composição visual transmite bem a transformação do espaço. Algumas cenas poderiam desenvolver melhor as personagens. A obra se destaca pela coerência entre tema e linguagem visual."]],
["B2","Jericó","Patrimônio e memória","Наследие и память","Brasil","Não apenas... como também...; cuja para relação de pertencimento.","Не только… но и…; cuja выражает принадлежность.",[["patrimônio imaterial","нематериальное наследие"],["memória coletiva","коллективная память"],["preservação cultural","сохранение культуры"],["transmissão intergeracional","передача между поколениями"],["identidade plural","множественная идентичность"]],[["O patrimônio imaterial abrange não apenas celebrações, como também saberes transmitidos entre gerações.","Нематериальное наследие включает не только праздники, но и знания, передаваемые между поколениями."],["A memória coletiva pode ser preservada por diferentes práticas.","Коллективная память может сохраняться различными практиками."],["Uma tradição cuja origem é discutida exige pesquisa cuidadosa.","Традиция, происхождение которой обсуждается, требует тщательного исследования."]],{"example":0,"answer":"como também"},["Объясни важность сохранения традиции, не считая её неизменной.","Explique a importância de preservar uma tradição sem tratá-la como imutável.","A preservação de uma tradição pode fortalecer a memória coletiva. Entretanto, as práticas culturais mudam à medida que novas gerações participam delas. Preservar não significa impedir toda transformação. É importante reconhecer diferentes formas de pertencimento."]],
["B2","Galileia","Variação do português brasileiro","Вариативность бразильского португальского","Brasil","Variar de acordo com; não confundir variedade com falta de competência.","Variar de acordo com — меняться в зависимости от; не путать вариативность с отсутствием навыка.",[["variedade linguística","языковая разновидность"],["variação diatópica","территориальная вариативность"],["registro coloquial","разговорный регистр"],["adequação comunicativa","коммуникативная уместность"],["preconceito linguístico","языковое предубеждение"]],[["A pronúncia e o vocabulário podem variar de acordo com a região.","Произношение и словарный состав могут различаться по регионам."],["Uma variedade coloquial não constitui necessariamente um erro.","Разговорная разновидность не обязательно является ошибкой."],["A adequação comunicativa depende também do contexto.","Коммуникативная уместность зависит и от контекста."]],{"example":0,"answer":"variar de acordo com"},["Объясни, почему знание региональных разновидностей помогает понимать португальский.","Explique por que conhecer variedades regionais ajuda a compreender o português.","O português brasileiro apresenta diferenças de pronúncia, vocabulário e construções gramaticais. Conhecer essas diferenças facilita a compreensão de falantes de várias regiões. Embora a norma-padrão seja útil em contextos formais, a fala cotidiana possui regras próprias. Não devemos confundir diversidade linguística com incapacidade."]],
["B2","Nazaré","Debater uma adaptação literária","Обсуждать литературную адаптацию","Brasil","Em comparação com; divergir de; manter-se fiel a.","Em comparação com — по сравнению с; divergir de — отличаться; manter-se fiel a — оставаться верным.",[["adaptação literária","литературная адаптация"],["obra de origem","исходное произведение"],["licença artística","художественная свобода"],["transposição","перенос"],["interpretação autoral","авторское прочтение"]],[["Em comparação com a obra de origem, uma adaptação pode modificar a estrutura narrativa.","По сравнению с оригиналом адаптация может менять структуру повествования."],["A transposição entre meios exige escolhas expressivas.","Перенос между видами искусства требует выразительных решений."],["Manter-se fiel ao tema não significa reproduzir todos os detalhes.","Сохранять верность теме не означает воспроизводить все детали."]],{"example":0,"answer":"Em comparação com"},["Сравни две вымышленные версии одной истории.","Compare duas versões imaginárias de uma mesma história.","No conto fictício, a protagonista descreve suas dúvidas em primeira pessoa. Na adaptação cinematográfica, essas dúvidas aparecem principalmente por imagens e ações. A mudança altera a forma de apresentar a personagem, mas pode preservar o tema central."]],
["B2","Betânia","Argumentar sobre arte pública","Аргументировать об общественном искусстве","Brasil","É discutível se; cabe considerar que.","É discutível se — спорно, ли; cabe considerar que — следует учитывать, что.",[["arte pública","общественное искусство"],["espaço urbano","городское пространство"],["fruição estética","эстетическое восприятие"],["intervenção artística","художественная интервенция"],["participação comunitária","участие сообщества"]],[["É discutível se uma intervenção artística atende a todos os públicos.","Спорно, удовлетворяет ли художественная интервенция все аудитории."],["Cabe considerar que o espaço urbano possui usos diversos.","Следует учитывать, что городское пространство имеет разные способы использования."],["A participação comunitária pode ampliar o diálogo sobre a obra.","Участие сообщества может расширить обсуждение произведения."]],{"example":0,"answer":"É discutível se"},["Обоснуй вымышленное предложение общественного искусства с учётом разных мнений.","Defenda uma proposta fictícia de arte pública considerando opiniões diferentes.","Uma exposição ao ar livre poderia tornar a arte mais acessível. Entretanto, o projeto deve respeitar a circulação das pessoas e as características do local. Proponho consultar a comunidade antes de definir a instalação."]],
["B2","Jericó","Turismo e convivência cultural","Туризм и культурное взаимодействие","Brasil","Na medida em que; respeitar os costumes sem generalizar.","Na medida em que — в той мере, в какой; уважать обычаи без обобщений.",[["turismo responsável","ответственный туризм"],["sensibilidade cultural","культурная чуткость"],["impacto local","местное воздействие"],["fluxo turístico","туристический поток"],["convivência intercultural","межкультурное общение"]],[["O turismo pode beneficiar uma região na medida em que respeite suas necessidades locais.","Туризм может приносить пользу региону в той мере, в какой учитывает его местные потребности."],["A convivência intercultural exige atenção às diferenças.","Межкультурное общение требует внимания к различиям."],["O fluxo turístico pode gerar benefícios e desafios.","Туристический поток может создавать преимущества и трудности."]],{"example":0,"answer":"respeite"},["Предложи принципы ответственного туризма для вымышленного города.","Proponha princípios de turismo responsável para uma cidade fictícia.","O turismo responsável considera tanto os visitantes quanto os moradores. Um roteiro pode valorizar o patrimônio sem comprometer a rotina local. Convém informar os visitantes sobre regras de convivência e evitar generalizações sobre os costumes."]],
["B2","Galileia","Descrever uma experiência intercultural","Описывать межкультурный опыт","Brasil","Ao me deparar com; percebi que; o que me levou a.","Ao me deparar com — столкнувшись с; percebi que — заметила, что; o que me levou a — что побудило меня.",[["estranhamento","ощущение непривычности"],["adaptação cultural","культурная адаптация"],["pressuposto cultural","культурная предпосылка"],["sensibilização","повышение осведомлённости"],["observação participante","включённое наблюдение"]],[["Ao me deparar com um costume desconhecido, procurei compreender seu contexto.","Столкнувшись с незнакомым обычаем, я постаралась понять его контекст."],["O estranhamento inicial não determina o valor de uma prática.","Первоначальное ощущение непривычности не определяет ценность практики."],["A experiência levou-me a reconsiderar alguns pressupostos.","Опыт побудил меня пересмотреть некоторые предположения."]],{"example":0,"answer":"Ao me deparar com"},["Расскажи о вымышленном межкультурном опыте с итоговым размышлением.","Narre uma experiência intercultural fictícia com reflexão final.","Durante uma visita imaginária, percebi que os cumprimentos eram diferentes dos que conhecia. Em vez de interpretar a diferença como falta de educação, perguntei sobre o costume. A explicação ajudou-me a compreender a situação. Aprendi que minhas expectativas também dependem de meu contexto cultural."]],
["B2","Nazaré","Mobilidade urbana","Городская мобильность","Brasil","Quanto a + nome introduz tópico; em decorrência de indica consequência.","Quanto a — что касается; em decorrência de — вследствие.",[["mobilidade urbana","городская мобильность"],["infraestrutura viária","дорожная инфраструктура"],["integração modal","интеграция видов транспорта"],["acessibilidade física","физическая доступность"],["conectividade urbana","городская связанность"]],[["Quanto à mobilidade urbana, é necessário considerar diferentes necessidades.","Что касается городской мобильности, необходимо учитывать разные потребности."],["A integração entre meios de transporte pode facilitar deslocamentos.","Интеграция видов транспорта может облегчать передвижение."],["A acessibilidade física beneficia pessoas com mobilidade diversa.","Физическая доступность приносит пользу людям с разными возможностями передвижения."]],{"example":0,"answer":"Quanto à"},["Сравни два вымышленных решения городской мобильности.","Compare duas soluções fictícias de mobilidade urbana.","Uma rede de ônibus com horários integrados pode facilitar deslocamentos longos. Já caminhos acessíveis para pedestres favorecem trajetos curtos. As soluções são complementares e devem ser avaliadas conforme as necessidades dos moradores."]],
["B2","Betânia","Consumo consciente","Осознанное потребление","Brasil","Ao invés de marca oposição; em vez de serve à substituição geral.","Ao invés de — при противопоставлении; em vez de — вместо в общем смысле.",[["consumo consciente","осознанное потребление"],["ciclo de vida","жизненный цикл"],["reutilização","повторное использование"],["desperdício evitável","предотвратимые отходы"],["impacto ambiental","воздействие на среду"]],[["Em vez de descartar um objeto utilizável, podemos considerar sua reutilização.","Вместо того чтобы выбрасывать пригодный предмет, можно рассмотреть его повторное использование."],["O ciclo de vida de um produto inclui diferentes etapas.","Жизненный цикл товара включает разные этапы."],["O impacto ambiental não depende apenas do material empregado.","Воздействие на среду зависит не только от используемого материала."]],{"example":0,"answer":"Em vez de"},["Обсуди два способа уменьшить отходы в вымышленном проекте.","Discuta duas formas de reduzir desperdícios em um projeto fictício.","O grupo pode reutilizar materiais que já possui, desde que estejam em boas condições. Também pode planejar as quantidades antes de comprar novos itens. Essas escolhas reduzem desperdícios evitáveis sem comprometer a qualidade do projeto."]],
["B2","Jericó","Avaliar uma proposta ambiental","Оценивать экологическое предложение","Brasil","É indispensável que + subjuntivo; a curto e a longo prazo.","É indispensável que + subjuntivo; a curto e a longo prazo — в краткосрочной и долгосрочной перспективе.",[["sustentabilidade","устойчивость"],["viabilidade ambiental","экологическая осуществимость"],["mitigação","смягчение воздействия"],["indicador ambiental","экологический показатель"],["monitoramento contínuo","непрерывный мониторинг"]],[["É indispensável que a proposta considere seus efeitos a longo prazo.","Необходимо, чтобы предложение учитывало долгосрочные последствия."],["A mitigação depende das medidas efetivamente adotadas.","Смягчение воздействия зависит от реально принятых мер."],["O monitoramento permite avaliar os resultados observados.","Мониторинг позволяет оценить наблюдаемые результаты."]],{"example":0,"answer":"considere"},["Оцени вымышленное предложение переработки по ясным критериям.","Avalie uma proposta fictícia de reciclagem com critérios claros.","A proposta prevê separar papel e outros materiais em recipientes identificados. Para avaliá-la, verificaria se existe coleta adequada e se os participantes compreendem as orientações. Também seria necessário acompanhar a quantidade recolhida ao longo do tempo. A existência de recipientes, por si só, não garante a reciclagem."]],
["B2","Galileia","Acesso à informação","Доступ к информации","Brasil","De modo que + indicativo para consequência real; para que + subjuntivo para finalidade.","De modo que + indicativo — реальное следствие; para que + subjuntivo — цель.",[["letramento","грамотность"],["barreira comunicativa","коммуникативный барьер"],["formato acessível","доступный формат"],["inclusão informacional","информационная доступность"],["linguagem simples","простой язык"]],[["O aviso foi reescrito para que mais pessoas pudessem compreendê-lo.","Объявление переписали, чтобы больше людей смогли его понять."],["Um formato acessível pode reduzir barreiras comunicativas.","Доступный формат может уменьшать коммуникативные барьеры."],["O objetivo da linguagem simples é facilitar a compreensão sem perder informações.","Цель простого языка — облегчать понимание без потери информации."]],{"example":0,"answer":"pudessem"},["Перепиши сложное объявление простым языком с сохранением смысла.","Reescreva um aviso complexo em linguagem simples preservando seu sentido.","Aviso fictício: o acesso à sala fica condicionado à disponibilidade de lugares. Em linguagem simples: você poderá entrar na sala se houver lugar. A segunda versão preserva a condição e reduz a complexidade."]],
["B2","Nazaré","Comunicar limites com clareza","Ясно сообщать о границах","Brasil","Não me é possível + infinitivo; prefiro que + subjuntivo.","Não me é possível — я не могу; prefiro que + subjuntivo — предпочитаю, чтобы.",[["assertividade respeitosa","уважительная уверенность"],["limite pessoal","личная граница"],["sobrecarga de tarefas","перегрузка задачами"],["compromisso incompatível","несовместимое обязательство"],["recusa fundamentada","обоснованный отказ"]],[["Não me é possível assumir outra tarefa neste momento.","Я не могу взять ещё одну задачу в данный момент."],["Prefiro que conversemos sobre uma alternativa viável.","Предпочитаю, чтобы мы обсудили осуществимую альтернативу."],["Uma recusa pode ser clara sem desrespeitar o interlocutor.","Отказ может быть ясным, не проявляя неуважения к собеседнику."]],{"example":0,"answer":"Não me é possível"},["Напиши уважительный отказ от дополнительной вымышленной задачи.","Escreva uma recusa respeitosa de uma tarefa adicional fictícia.","Agradeço por terem pensado em mim para essa tarefa. No momento, já tenho compromissos que não consigo conciliar com uma atividade adicional. Prefiro que procuremos outra solução. Posso ajudar a esclarecer o que já foi preparado."]],

["B2","Jericó","Elaborar uma proposta de pesquisa","Составлять исследовательское предложение","Brasil","Pretende-se + infinitivo; a hipótese é que + indicativo ou subjuntivo conforme o sentido.","Pretende-se + инфинитив — предполагается; выбор наклонения после hipótese зависит от смысла.",[["questão de pesquisa","исследовательский вопрос"],["objetivo específico","конкретная цель"],["procedimento metodológico","методологическая процедура"],["viés de seleção","смещение отбора"],["delimitação temática","ограничение темы"]],[["Pretende-se investigar como os estudantes utilizam materiais de leitura.","Предполагается исследовать, как ученики используют материалы для чтения."],["A delimitação temática ajuda a formular uma questão clara.","Ограничение темы помогает сформулировать ясный вопрос."],["O procedimento metodológico deve respeitar a privacidade dos participantes.","Методологическая процедура должна уважать конфиденциальность участников."]],{"example":0,"answer":"Pretende-se"},["Составь вымышленное школьное исследовательское предложение без сбора личных данных.","Redija uma proposta fictícia de pesquisa escolar sem coletar dados pessoais.","Pretende-se comparar a clareza de dois textos didáticos fictícios. O objetivo específico é identificar diferenças na organização das informações. A análise será realizada diretamente nos textos, sem coletar dados pessoais de estudantes. Os resultados serão apresentados como observações limitadas ao material estudado."]],

["B2","Betânia","Revisar um texto argumentativo","Редактировать аргументативный текст","Brasil","Ainda que + subjuntivo; não se segue que + subjuntivo.","Ainda que + subjuntivo; não se segue que + subjuntivo — из этого не следует.",[["falácia","логическая ошибка"],["premissa insuficiente","недостаточная посылка"],["consistência argumentativa","последовательность аргументации"],["contraexemplo","контрпример"],["conclusão excessiva","чрезмерный вывод"]],[["Ainda que uma proposta tenha vantagens, não se segue que seja adequada a todas as situações.","Даже если у предложения есть преимущества, из этого не следует, что оно подходит всем ситуациям."],["Um contraexemplo pode revelar uma generalização indevida.","Контрпример может выявить необоснованное обобщение."],["A conclusão deve corresponder às premissas apresentadas.","Вывод должен соответствовать представленным посылкам."]],{"example":0,"answer":"seja adequada"},["Исправь чрезмерный вывод: метод сработал один раз, значит, сработает всегда.","Corrija esta conclusão exagerada: um método funcionou uma vez, portanto funcionará sempre.","O método produziu um resultado positivo em uma situação específica. Isso sugere que pode ser útil em condições semelhantes, mas não garante sua eficácia universal. Seria necessário avaliar outros casos antes de formular uma conclusão geral."]],

const canonical=s=>String(s).toLowerCase().normalize('NFC').replace(/[.,!?;:«»“”"¿¡]/g,'').replace(/\s+/g,' ').trim();
const norm=s=>canonical(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

const voiceSample='Olá! Eu sou Luz. Hoje vamos estudar português. Eu creio em Deus e vou à reunião.';
let speechTicket=0;
function voiceEngine(){return typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'?speechSynthesis:null}
function brazilVoices(){let engine=voiceEngine();if(!engine)return [];try{return engine.getVoices().filter(v=>String(v.lang).toLowerCase().replace(/_/g,'-')==='pt-br').sort((a,b)=>Number(b.localService)-Number(a.localService)||Number(/premium|enhanced|aprimorad|melhorad/i.test(b.name))-Number(/premium|enhanced|aprimorad|melhorad/i.test(a.name))||Number(b.default)-Number(a.default)||a.name.localeCompare(b.name,'pt-BR'))}catch(e){return []}}
function voiceKey(v){return v.voiceURI||v.name}
function pickVoice(mode=S.voicePrefs.mode){let vs=brazilVoices(),id=mode==='auto'?'':S.voicePrefs[mode];if(id)return vs.find(v=>voiceKey(v)===id)||null;return vs.find(v=>v.localService)||null}
function audioStatus(msg){let local=$('#audio-status'),global=$('#global-audio-status');if(local)local.textContent=msg;if(global)global.textContent=local?'':msg}
function stopSpeech(){micCancel();speechTicket++;let engine=voiceEngine();if(engine)engine.cancel();cancelDora();audioStatus('')}
function systemSpeak(s,rate=1,mode=S.voicePrefs.mode){let engine=voiceEngine();if(!engine){audioStatus(tr('Озвучка недоступна. Используй письменный вариант.','Áudio indisponível. Use a alternativa escrita.'));return false}let v=pickVoice(mode);if(!v){audioStatus(tr('Выбранный голос недоступен. Открой Perfil → Озвучивание, обнови список или установи голос pt-BR. Если звук недоступен, выбери письменный вариант.','Voz indisponível. Abra Perfil → Áudio, atualize a lista ou instale uma voz pt-BR. Use a alternativa escrita se necessário.'));return false}try{let ticket=++speechTicket;engine.cancel();let u=new SpeechSynthesisUtterance(String(s));u.lang='pt-BR';u.voice=v;u.rate=rate===0.75?0.75:1;u.pitch=1;u.volume=1;u.onstart=()=>{if(ticket===speechTicket)audioStatus('')};u.onerror=e=>{if(ticket===speechTicket&&!['canceled','interrupted'].includes(e.error))audioStatus(tr('Не удалось воспроизвести голос. Попробуй другой в профиле.','Não foi possível reproduzir a voz. Tente outra no perfil.'))};engine.speak(u);return true}catch(e){audioStatus(tr('Озвучка недоступна.','Áudio indisponível.'));return false}}


let doraPlayer=null,doraLast=null;
function doraNotice(message){audioStatus(message)}
function cancelDora(){if(doraPlayer){let player=doraPlayer;doraPlayer=null;player.onended=null;player.onerror=null;player.pause();player.removeAttribute('src');player.load()}doraLast=null;doraNotice('')}
function fallbackSpeech(){if(!doraLast)return;let {text,rate}=doraLast;stopSpeech();systemSpeak(text,rate,S.voicePrefs.mode)}
function doraPath(text){let key=String(text).normalize('NFC').trim().replace(/\s+/g,' ');let value=typeof DORA_AUDIO==='object'&&Object.prototype.hasOwnProperty.call(DORA_AUDIO,key)?DORA_AUDIO[key]:null;return typeof value==='string'&&/^audio-dora\/[a-f0-9]{64}\.mp3$/.test(value)?value:null}
function speak(text,rate=1,mode){stopSpeech();text=String(text).trim();rate=rate===.75?.75:1;
 if(mode!==undefined||S.ttsEngine==='system')return systemSpeak(text,rate,mode===undefined?S.voicePrefs.mode:mode);
 if(uxAudioPending()){if(pickVoice()){uxAudioTicket=null;return systemSpeak(text,rate)}return false;}
 let path=doraPath(text);
 if(!path){doraLast={text,rate};if(pickVoice()){let ok=systemSpeak(text,rate);if(ok)return true}doraNotice(tr('Запись Dora пока не готова, а системный голос pt-BR недоступен. Можно выбрать письменное задание.','Gravação Dora ainda indisponível e sem voz pt-BR. Use a alternativa escrita.'),true);return false}
 doraLast={text,rate};try{let player=new Audio('./'+path);doraPlayer=player;player.preload='auto';player.playbackRate=rate;player.preservesPitch=true;player.webkitPreservesPitch=true;
 let fail=()=>{if(doraPlayer!==player)return;cancelDora();if(pickVoice()&&systemSpeak(text,rate))return;doraNotice(tr('Не удалось открыть аудиофайл. В профиле можно выбрать системный голос.','Não foi possível abrir o áudio. Escolha a voz do dispositivo no perfil.'))};
 player.onerror=fail;player.onended=()=>{if(doraPlayer===player){doraPlayer=null;player.onended=null;player.onerror=null;player.removeAttribute('src');player.load();doraNotice('')}};let p=player.play();if(p&&p.catch)p.catch(fail);return true
 }catch(e){if(pickVoice()&&systemSpeak(text,rate))return true;doraNotice(tr('Воспроизведение MP3 недоступно.','Reprodução MP3 indisponível.'),true);return false}}
function setTTSEngine(v){if(!['dora','system'].includes(v))return;stopSpeech();S.ttsEngine=v;save();refreshVoicePanel()}
function doraSettings(){let n=typeof DORA_AUDIO==='object'?Object.keys(DORA_AUDIO).length:null,words=baseVocabulary(),covered=n===null?null:words.filter(e=>doraPath(e.pt)).length;return '<h2>🇧🇷 Dora · Kokoro (MP3)</h2><p>'+tr('Готовые аудиофайлы вместо загрузки нейросети на телефон.','Áudios prontos, sem carregar o modelo no celular.')+'</p><p><b>'+tr('Доступно записей','Gravações disponíveis')+': '+(n===null?'…':n)+'</b></p><p><b>'+tr('Озвучка словаря Dora','Áudio Dora do vocabulário')+': </b>'+(covered===null?'…':covered+' / '+words.length)+'</p><p class="muted">'+(n===null?tr(uxAudioError?'Каталог не загружен. Нажми на аудио, чтобы повторить.':'Загружается каталог аудио.','Catálogo de áudio '+(uxAudioError?'indisponível; toque para tentar novamente.':'carregando.')):n?tr('Если для фразы ещё нет записи, используется системный голос pt-BR.','Se não houver gravação, usa-se a voz pt-BR do dispositivo.'):tr('Аудиофайлы ещё не сгенерированы. Пока доступна системная озвучка, если устройство предоставляет голос pt-BR.','Áudios ainda não gerados. Por enquanto, use a voz pt-BR do dispositivo.'))+'</p><label>'+tr('Движок озвучивания','Motor de voz')+'<select onchange="setTTSEngine(this.value)"><option value="dora" '+(S.ttsEngine==='dora'?'selected':'')+'>Dora MP3 + sistema</option><option value="system" '+(S.ttsEngine==='system'?'selected':'')+'>'+tr('Системный голос','Voz do dispositivo')+'</option></select></label><div class="audio-group"><button onclick="speak(voiceSample,1)">▶ '+tr('Прослушать','Ouvir')+' 1×</button><button class="secondary" onclick="speak(voiceSample,.75)">🐢 0,75×</button><button class="secondary" onclick="stopSpeech()">'+tr('Стоп','Parar')+'</button></div><p class="muted"><a href="https://huggingface.co/hexgrad/Kokoro-82M" target="_blank" rel="noopener noreferrer">Kokoro · Apache 2.0</a></p>'}

function voiceOptions(slot,vs){let id=S.voicePrefs[slot];return '<option value="">'+tr('Не выбран — местный голос по умолчанию','Não selecionada — voz local padrão')+'</option>'+(id&&!vs.some(v=>voiceKey(v)===id)?'<option value="'+esc(id)+'" selected disabled>'+tr('Ранее выбранный голос недоступен','Voz anterior indisponível')+'</option>':'')+vs.map(v=>'<option value="'+esc(voiceKey(v))+'" '+(id===voiceKey(v)?'selected':'')+'>'+esc(v.name+' · '+(v.localService?tr('на устройстве','local'):tr('онлайн (браузер)','online (navegador)')) )+'</option>').join('')}

function voicePanelHTML(){return doraSettings()+'<details><summary>'+tr('Настройки запасного системного голоса','Configurações da voz do dispositivo')+'</summary>'+systemVoicePanelHTML()+'</details>'}
function refreshVoicePanel(){let e=$('#voice-panel');if(e&&page==='profile')e.innerHTML=voicePanelHTML()}
function initVoiceEvents(){let engine=voiceEngine();if(engine&&typeof engine.addEventListener==='function')engine.addEventListener('voiceschanged',refreshVoicePanel);brazilVoices()}
function draftKey(){return review?'review':String(active)}
function validDraft(d){return !!d&&Array.isArray(d.queue)&&d.queue.length>0&&Number.isInteger(d.pos)&&d.pos>=0&&d.pos<d.queue.length&&d.queue.every(q=>q&&typeof q.answer==='string'&&typeof q.prompt==='string')&&Number.isInteger(d.score)&&d.score>=0&&d.score<=d.pos+(d.locked?1:0)}
function persist(){if(!queue.length||pos>=queue.length)return;const k=draftKey();S.drafts[k]={queue,pos,score,locked,feedback,draftText,picked,skipped};S.resume=k;save()}
function resumeLesson(k){const d=S.drafts[k];if(!validDraft(d)){delete S.drafts[k];save();go('map');return}review=k==='review';if(!review)active=Number(k);({queue,pos,score,locked,feedback,draftText,picked,skipped}=d);picked=Array.isArray(picked)?picked:[];draftText=typeof draftText==='string'?draftText:'';skipped=Number(skipped)||0;persist();go('quiz')}
function resumeCard(){const k=S.resume,d=S.drafts[k];if(!validDraft(d))return '';const name=k==='review'?tr('Повторение ошибок','Revisão de erros'):L[Number(k)]?.[2];if(!name)return '';return '<article class="resume-card"><span class="tag">'+tr('Сохранено автоматически','Salvo automaticamente')+'</span><h2>'+esc(name)+'</h2><p>'+tr('Задание','Exercício')+' '+(d.pos+1)+' / '+d.queue.length+'</p><button onclick="resumeLesson('+esc(JSON.stringify(k))+')">'+tr('Продолжить урок','Continuar lição')+'</button></article>'}
function pause(){persist();go('home')}
function inputDraft(v){draftText=v;persist()}
function pickTile(i){const q=queue[pos];if(locked||!q.bank||picked.includes(i)||!Number.isInteger(i)||i<0||i>=q.bank.length)return;picked.push(i);persist();render()}
function unpickTile(i){if(locked)return;picked.splice(i,1);persist();render()}
function resetTiles(){if(locked)return;picked=[];persist();render()}
function tileText(){return picked.map(i=>queue[pos].bank[i]).join(' ')}

function quizHTML(){const q=queue[pos];if(!q)return '';const src=!review&&L[active]?gameSource('c:'+active):null,tap=gameTapLookup(src,q);const dis=locked?' disabled':'';let body='';if(q.bank){body='<p class="muted">'+tr('Нажимай слова в нужном порядке. Нажми выбранное слово, чтобы убрать его.','Toque nas palavras na ordem correta. Toque numa palavra escolhida para removê-la.')+'</p><div class="built" aria-label="'+tr('Твой ответ','Sua resposta')+'">'+(picked.length?picked.map((n,i)=>'<button class="tile" onclick="unpickTile('+i+')"'+dis+'>'+esc(q.bank[n])+'</button>').join(''):'<span class="muted">'+tr('Здесь появится предложение','A frase aparecerá aqui')+'</span>')+'</div><div class="word-bank">'+q.bank.map((w,i)=>'<button class="tile" onclick="pickTile('+i+')"'+(locked||picked.includes(i)?' disabled':'')+'>'+esc(w)+'</button>').join('')+'</div><button class="secondary" onclick="resetTiles()"'+dis+'>'+tr('Очистить','Limpar')+'</button> <button onclick="check(tileText())"'+(locked||picked.length!==q.bank.length?' disabled':'')+'>'+tr('Проверить','Verificar')+'</button>'}else if(q.opts){body=q.opts.map((o,i)=>'<button class="option" onclick="check(queue[pos].opts['+i+'])"'+dis+'>'+esc(o)+'</button>').join('')}else{body='<input id="answer" autocomplete="off" aria-label="'+tr('Ответ','Resposta')+'" placeholder="'+tr('Ответ','Resposta')+'" value="'+esc(draftText)+'" oninput="inputDraft(this.value)" onkeydown="if(event.key===\'Enter\')check(this.value)"'+dis+'><button onclick="check($(\'#answer\').value)"'+dis+'>'+tr('Проверить','Verificar')+'</button>'}
return '<div class="quiz-head"><b>'+tr('Задание','Exercício')+' '+(pos+1)+'/'+queue.length+'</b><button class="secondary" onclick="pause()">⏸ '+tr('Пауза','Pausar')+'</button></div><progress max="'+queue.length+'" value="'+(pos+(locked?1:0))+'"></progress><article><span class="tag">'+esc(q.type)+'</span><h2>'+gameTapText(q.prompt,tap)+'</h2>'+(!q.listen&&!/[а-яё]/i.test(q.prompt||'')?gameTapInstruction():'')+(q.context?'<p>'+esc(q.context)+'</p>':'')+(q.listen?audio(q.listen)+'<div><button class="secondary" onclick="writtenAlternative()"'+dis+'>'+tr('Без звука — письменное задание','Sem áudio — exercício escrito')+'</button></div><p id="audio-status" class="muted" role="status"></p>':'')+body+gameTapPanelHTML()+gameHelpHTML(src,q)+(!locked&&q.target==='pt'&&!q.opts&&!q.bank?micPanel('quiz'):'')+'<div id="feedback" aria-live="polite">'+feedbackHTML()+'</div></article>'}

 if(builtInVocabulary)return builtInVocabulary;

  let theme=l[4]==='Brasil'?'cotidiano':/reunião|igreja|pastor|obreir|serviço|equipe|pregação|evangeliza|acolh|mídia|volunt|oração/i.test(l[2])?'igreja':'bíblico';

   if(!e.example){let token=vocabularyTokens(pt);let found=token&&sentences.find(v=>v.t.includes(' '+token+' '));if(found){e.example=found.x[0];e.translation=found.x[1]}}
  }
 }
 for(const e of map.values()){e.category=e.themes.includes('cotidiano')?'cotidiano':e.themes.includes('igreja')?'igreja':'bíblico';delete e.themes}
 for(const [pt,ru,detail,example,translation] of IURD){let id=wordId(pt),e=map.get(id)||{id,pt,levels:[]};Object.assign(e,{ru,detail,example,translation,category:CHURCH_WORDS.has(id.slice(2))?'igreja':'bíblico'});map.set(id,e)}
