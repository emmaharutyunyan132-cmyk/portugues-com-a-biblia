["A1","Cafarnaum","O pastor e a igreja","Пастор и церковь","bíblico","O pastor, a pastora; ouvir sem preposição.","Ouvir alguém — слушать кого-либо без предлога; orientar alguém — наставлять.",[["pastorear","пасти"],["orientar","наставлять"],["explicar","объяснять"],["membro","член общины"]],[["O pastor explica a mensagem.","Пастор объясняет послание."],["Nós ouvimos o pastor.","Мы слушаем пастора."],["Ela orienta os jovens.","Она наставляет молодёжь."]]],

["A1","Belém","O nascimento de Jesus","Рождение Иисуса","bíblico","Nascer: nasceu (passado); viver: vive.","Nasceu — родился, vive — живёт. Это разные времена.",[["nascimento","рождение"],["nascer","рождаться"],["menino","мальчик"],["anjo","ангел"]],[["Jesus nasceu em Belém.","Иисус родился в Вифлееме."],["O menino está com a mãe.","Мальчик находится с матерью."],["Os anjos anunciam boas notícias.","Ангелы возвещают хорошие вести."]]],

["A2","Jerusalém","O Salmo e a confiança","Псалом и доверие","bíblico","Ter medo de; confiar em; depender de.","Предлоги: ter medo de — бояться; confiar em — доверять; depender de — зависеть от.",[["refúgio","убежище"],["confiança","доверие"],["temor","страх"],["depender","зависеть"]],[["Eu confio em Deus nos momentos difíceis.","Я доверяю Богу в трудные моменты."],["Não dependo da opinião dos outros.","Я не завишу от мнения других."],["Buscamos refúgio em Deus.","Мы ищем убежища в Боге."]],{"example":1,"answer":"da"}],
["A2","Cafarnaum","A tempestade","Буря","bíblico","Imperfeito para cenário; perfeito para evento concluído.","Imperfeito описывает фон, perfeito — завершённое событие.",[["tempestade","буря"],["barco","лодка"],["vento","ветер"],["acalmar","успокаивать"]],[["O vento soprava muito forte.","Ветер дул очень сильно."],["Os discípulos estavam no barco.","Ученики находились в лодке."],["A tempestade passou.","Буря прошла."]],{"example":0,"answer":"soprava"}],
["A2","Jericó","Reservar um quarto","Забронировать номер","Brasil","Gostaria de + infinitivo para pedidos corteses.","Gostaria de — вежливая просьба: я хотела бы.",[["reserva","бронирование"],["quarto","номер"],["diária","оплата за сутки"],["disponível","доступный"]],[["Gostaria de reservar um quarto.","Я хотела бы забронировать номер."],["O quarto está disponível?","Номер свободен?"],["Quanto custa a diária?","Сколько стоит проживание за сутки?"]],{"example":0,"answer":"Gostaria de"}],
["A2","Betânia","O encontro com Marta","Встреча с Марфой","bíblico","Enquanto + imperfeito para ações simultâneas no passado.","Enquanto — пока, в то время как; может соединять одновременные действия.",[["atender","обслуживать"],["preparar","готовить"],["preocupação","беспокойство"],["escutar","слушать"]],[["Enquanto Marta preparava a comida, Maria escutava Jesus.","Пока Марфа готовила еду, Мария слушала Иисуса."],["Ela estava preocupada com o trabalho.","Она беспокоилась о работе."],["Jesus falou com Marta.","Иисус поговорил с Марфой."]],{"example":0,"answer":"Enquanto"}],

["A2","Nazaré","Planos para amanhã","Планы на завтра","Brasil","Pretender + infinitivo e ir + infinitivo.","Pretendo — намереваюсь; vou + инфинитив — планирую действие.",[["planejar","планировать"],["pretender","намереваться"],["combinar","договариваться"],["agenda","ежедневник"]],[["Pretendo estudar mais amanhã.","Я намереваюсь завтра больше учиться."],["Nós vamos combinar um horário.","Мы договоримся о времени."],["Ela anotou o compromisso na agenda.","Она записала встречу в ежедневник."]],{"example":0,"answer":"Pretendo"}],
["A2","Jerusalém","Oração e respostas","Молитва и ответы","bíblico","Pronomes de objeto: me, te, nos; no Brasil, a próclise é comum.","Me — меня/мне, te — тебя/тебе, nos — нас/нам; в Бразилии часто перед глаголом.",[["resposta","ответ"],["responder","отвечать"],["escuta","слушание"],["atender","откликаться"]],[["Deus me ajuda.","Бог мне помогает."],["Ela nos ouviu com atenção.","Она внимательно нас выслушала."],["Eu te agradeço pela ajuda.","Я благодарю тебя за помощь."]],{"example":1,"answer":"nos"}],
["A2","Betânia","O trabalho em equipe","Командная работа","bíblico","Recíprocos: uns aos outros; um ao outro.","Uns aos outros — друг другу, друг друга (во множественном числе).",[["equipe","команда"],["responsabilidade","ответственность"],["cooperar","сотрудничать"],["tarefa","задание"]],[["Nós ajudamos uns aos outros.","Мы помогаем друг другу."],["Cada pessoa tem uma responsabilidade.","У каждого человека есть обязанность."],["A equipe cooperou durante a atividade.","Команда сотрудничала во время мероприятия."]],{"example":0,"answer":"uns aos outros"}],
["A2","Cafarnaum","O paralítico","Рассказ о парализованном человеке","bíblico","Pretérito perfeito irregular: trouxe, pôde, fez.","Trazer → trouxe, poder → pôde, fazer → fez в завершённом прошлом.",[["telhado","крыша"],["multidão","толпа"],["carregar","нести"],["cura","исцеление"]],[["Os amigos trouxeram o homem até Jesus.","Друзья принесли мужчину к Иисусу."],["Eles fizeram um esforço para ajudá-lo.","Они приложили усилие, чтобы помочь ему."],["Ele pôde voltar para casa.","Он смог вернуться домой."]],{"example":0,"answer":"trouxeram"}],
["A2","Jerusalém","A linguagem das Escrituras","Язык Писания","bíblico","Conosco é comum na fala; convosco é literário. Vos pode aparecer com vós.","Conosco — с нами, convosco — с вами (книжное); обычно com vocês.",[["conosco","с нами"],["convosco","с вами (книжное)"],["vos","вас или вам (при vós)"],["escritura","писание"]],[["Ele está conosco.","Он с нами."],["Quero conversar com vocês.","Я хочу поговорить с вами."],["A paz esteja convosco.","Да будет мир с вами."]],{"example":1,"answer":"com vocês"}],
["B1","Jerusalém","Mudança interior","Внутреннее изменение","bíblico","Para que + subjuntivo expressa finalidade.","Para que — чтобы; если меняется субъект, используем subjuntivo.",[["transformação","преобразование"],["renovar","обновлять"],["caráter","характер"],["finalidade","цель"]],[["Nós estudamos para que possamos compreender melhor.","Мы учимся, чтобы лучше понимать."],["Ela explicou tudo para que eu entendesse.","Она всё объяснила, чтобы я поняла."],["É necessário que cada pessoa reflita.","Необходимо, чтобы каждый человек размышлял."]],{"example":0,"answer":"possamos"},["Объясни цель учебного занятия, используя para que.","Explique o objetivo de uma atividade de estudo usando para que.","A professora preparou exemplos para que os alunos compreendam a regra. Vamos trabalhar em grupos para que todos possam praticar. No final, cada grupo explicará suas conclusões."]],
["B1","Galileia","A linguagem da oração","Язык молитвы","bíblico","Imperativo: ajuda (tu), ajude (você); em orações, ajuda-me ou me ajuda conforme o registro.","Ajuda — форма для tu, ajude — для você; ajuda-me более книжное, me ajuda — распространённое разговорное обращение.",[["suplicar","умолять"],["misericórdia","милосердие"],["abençoar","благословлять"],["guiar","направлять"]],[["Senhor, guia os meus passos.","Господи, направляй мои шаги."],["Ajude-nos a compreender a mensagem.","Помогите нам понять послание."],["Peço que Deus abençoe a minha família.","Я прошу, чтобы Бог благословил мою семью."]],{"example":0,"answer":"guia"},["Составь короткую вымышленную молитву с просьбой о мудрости.","Escreva uma oração fictícia breve pedindo sabedoria.","Senhor, peço que me dês sabedoria para tomar decisões. Guia meus passos e ajuda-me a ouvir com atenção. Que eu trate as outras pessoas com respeito."]],
["B1","Jericó","Resolver um mal-entendido","Решить недоразумение","Brasil","Se + imperfeito do subjuntivo; condicional: se soubesse, explicaria.","Гипотеза: se soubesse — если бы знала, explicaria — объяснила бы.",[["mal-entendido","недоразумение"],["esclarecer","прояснять"],["equívoco","ошибка"],["respeito","уважение"]],[["Se eu soubesse disso, explicaria melhor.","Если бы я знала об этом, я бы объяснила лучше."],["Gostaria que você esclarecesse a situação.","Я хотела бы, чтобы ты прояснила ситуацию."],["Podemos conversar com respeito.","Мы можем поговорить уважительно."]],{"example":0,"answer":"soubesse"},["Предложи уважительное решение вымышленного недоразумения.","Proponha uma solução respeitosa para um mal-entendido fictício.","Se eu estivesse no lugar das personagens, procuraria entender o que aconteceu. Gostaria que cada pessoa explicasse seu ponto de vista. Depois, tentaria encontrar uma solução em conjunto."]],
["B2","Jerusalém","Traduzir contrastes","Перевод противопоставлений","bíblico","Apesar de + infinitivo; embora + subjuntivo; no entanto + indicativo.","Apesar de — несмотря на; embora — хотя с subjuntivo; no entanto — однако.",[["contraste","противопоставление"],["obstáculo","препятствие"],["concessão","уступка"],["determinação","решимость"]],[["Embora enfrentemos obstáculos, podemos manter a esperança.","Хотя мы сталкиваемся с препятствиями, мы можем сохранять надежду."],["Apesar de estar cansada, ela continuou.","Несмотря на усталость, она продолжила."],["A tarefa era difícil; no entanto, conseguimos terminá-la.","Задание было трудным, однако нам удалось его закончить."]],{"example":0,"answer":"enfrentemos"},["Переформулируй одну уступительную мысль с embora, apesar de и no entanto.","Reformule uma ideia concessiva usando embora, apesar de e no entanto.","Embora o texto seja complexo, podemos compreendê-lo. Apesar da complexidade do texto, podemos compreendê-lo. O texto é complexo; no entanto, podemos compreendê-lo."]],
["B2","Betânia","A mensagem e o público","Послание и аудитория","bíblico","Orações relativas: o que, aquilo que, cujo/cuja (registro formal).","Cujo/cuja выражает принадлежность и согласуется со следующим существительным, без артикля.",[["público","аудитория"],["clareza","ясность"],["adequar","адаптировать"],["ambiguidade","двусмысленность"]],[["O texto cujo sentido discutimos é complexo.","Текст, смысл которого мы обсуждаем, сложен."],["O intérprete precisa compreender aquilo que ouve.","Переводчику нужно понимать то, что он слышит."],["É preciso evitar ambiguidades desnecessárias.","Нужно избегать ненужной двусмысленности."]],{"example":0,"answer":"cujo"},["Напиши о двух текстах с cujo и cuja, соблюдая согласование.","Escreva sobre dois textos usando cujo e cuja com a concordância adequada.","O primeiro texto, cujo tema é a cooperação, apresenta exemplos cotidianos. O segundo, cuja estrutura é mais formal, desenvolve uma argumentação. Ambos podem ser adaptados ao público sem alterar seu sentido."]],
["B2","Jerusalém","Narrar e interpretar","Повествование и толкование","bíblico","Mais-que-perfeito composto: tinha + particípio; anterioridade em relação ao passado.","Tinha + причастие обозначает действие, совершившееся раньше другого прошлого действия.",[["anterioridade","предшествование"],["relato","повествование"],["ocorrência","событие"],["sequência","последовательность"]],[["Quando a reunião começou, ela já tinha chegado.","Когда собрание началось, она уже пришла."],["O narrador explicou o que tinha acontecido.","Рассказчик объяснил, что произошло ранее."],["A sequência dos acontecimentos esclarece o relato.","Последовательность событий проясняет повествование."]],{"example":0,"answer":"tinha chegado"},["Составь рассказ о трёх событиях, обозначив действие, предшествовавшее другому прошлому действию.","Narre três acontecimentos e indique a anterioridade de uma ação em relação a outra.","Quando a reunião começou, a equipe já tinha preparado os materiais. Os participantes chegaram e receberam as orientações. Depois, o responsável explicou como havia organizado as tarefas."]],
["A1","Jerusalém","João 1 — A Palavra","Иоанна 1 — Слово","bíblico","O verbo era é o imperfeito de ser; no presente, é. Em João 1:1–5, o texto usa a imagem da luz. Exemplos didáticos, não citações.","Era — форма прошедшего времени ser, в настоящем é. Иоанна 1:1–5: образ света. Ниже авторские учебные примеры, не цитаты.",[["princípio","начало"],["Verbo","Слово (богословский термин)"],["trevas","тьма"],["existir","существовать"]],[["O capítulo fala sobre a luz.","Глава говорит о свете."],["A luz é uma imagem importante.","Свет — важный образ."],["Nós lemos o primeiro capítulo.","Мы читаем первую главу."]]],
["A1","Betânia","João 1 — João Batista","Иоанна 1 — Иоанн Креститель","bíblico","Quem pergunta sobre uma pessoa; quem é? João 1:19–34: João Batista dá testemunho sobre Jesus.","Quem — кто; Quem é? — Кто это? Иоанна 1:19–34: Иоанн Креститель свидетельствует об Иисусе.",[["batista","креститель"],["testemunhar","свидетельствовать"],["enviar","посылать"],["cordeiro","агнец"]],[["Quem é João Batista?","Кто такой Иоанн Креститель?"],["João fala sobre Jesus.","Иоанн говорит об Иисусе."],["Ele dá testemunho.","Он свидетельствует."]]],
["A1","Galileia","João 2 — Em Caná","Иоанна 2 — В Кане","bíblico","Na festa = em + a; dentro de indica interior. João 2:1–11: Jesus está em uma festa de casamento. Vocabulário descritivo, não uma citação.","Na festa — на празднике; dentro de — внутри. Иоанна 2:1–11: Иисус присутствует на свадьбе.",[["casamento","свадьба"],["convidado","гость"],["jarra","кувшин"],["recipiente","сосуд"]],[["Jesus está na festa.","Иисус находится на празднике."],["Maria fala com Jesus.","Мария разговаривает с Иисусом."],["Há água nos recipientes.","В сосудах есть вода."]]],
["A1","Jerusalém","João 3 — Nicodemos","Иоанна 3 — Никодим","bíblico","Perguntas com como e por que. João 3:1–21: Jesus conversa com Nicodemos sobre nascer de novo.","Como — как, por que — почему (в вопросе). Иоанна 3:1–21: беседа Иисуса с Никодимом о рождении свыше.",[["novo","новый"],["nascer de novo","родиться свыше"],["explicação","объяснение"],["perguntar","спрашивать"]],[["Nicodemos faz uma pergunta.","Никодим задаёт вопрос."],["Jesus fala sobre uma nova vida.","Иисус говорит о новой жизни."],["Como posso entender isso?","Как я могу это понять?"]]],
["A1","Samaria","João 4 — A mulher samaritana","Иоанна 4 — Самарянка","bíblico","Dar algo a alguém: eu dou, você dá, nós damos. João 4:1–26 usa a água como imagem espiritual.","Dar — давать: eu dou, você dá, nós damos. В Иоанна 4:1–26 вода также имеет духовный смысл.",[["poço","колодец"],["samaritana","самарянка"],["dar","давать"],["beber","пить"]],[["A mulher está perto do poço.","Женщина находится рядом с колодцем."],["Jesus conversa com a mulher.","Иисус беседует с женщиной."],["Eu dou água à visitante.","Я даю воду посетительнице."]]],
["A1","Galileia","João 6 — Os pães","Иоанна 6 — Хлебы","bíblico","Plural: pão → pães; peixe → peixes. João 6:1–15: Jesus alimenta uma multidão.","Множественное число: pão → pães, peixe → peixes. Иоанна 6:1–15: Иисус накормил множество людей.",[["peixe","рыба"],["cesto","корзина"],["alimentar","кормить"],["multiplicar","умножать"]],[["O menino tem cinco pães.","У мальчика пять хлебов."],["As pessoas recebem alimento.","Люди получают пищу."],["Os discípulos recolhem os pedaços.","Ученики собирают куски."]]],

["A2","Nazaré","No balcão da biblioteca","У стойки библиотеки","Brasil","Poderia + infinitivo; devolver até; renovar por + prazo.","Poderia + infinitivo; devolver até; renovar por + срок.",[["empréstimo","выдача на время"],["renovação","продление"],["cadastro","регистрация"],["prazo","срок"]],[["Poderia renovar o empréstimo?","Можно продлить срок выдачи книги?"],["Preciso devolver o livro até amanhã.","Мне нужно вернуть книгу к завтрашнему дню."],["O prazo de devolução termina na sexta-feira.","Срок возврата истекает в пятницу."]],{"example":0,"answer":"Poderia"}],
["A2","Jerusalém","O testemunho em sequência","Последовательное свидетельство","bíblico","No começo, depois, finalmente; perfeito e imperfeito na narrativa.","No começo, depois, finalmente; perfeito и imperfeito в рассказе.",[["sequência","последовательность"],["experiência","опыт"],["etapa","этап"],["progresso","прогресс"]],[["No começo, eu tinha dificuldade com o idioma.","Вначале у меня были трудности с языком."],["Depois, comecei a praticar todos os dias.","Затем я начала заниматься каждый день."],["Finalmente, consegui entender uma mensagem simples.","Наконец мне удалось понять простое послание."]],{"example":0,"answer":"tinha"}],

["B1","Jerusalém","Acolher quem chega","Встречать новых людей","bíblico","É essencial que + presente do subjuntivo; com o mesmo sujeito, use infinitivo.","É essencial que требует subjuntivo; при одном субъекте возможен инфинитив.",[["recepção","приём"],["visitante","посетитель"],["gentileza","любезность"],["orientação","указание, помощь"],["encaminhar","направлять"]],[["É essencial que a recepção trate cada visitante com gentileza.","Важно, чтобы встречающие относились к каждому посетителю с любезностью."],["Podemos oferecer orientação a quem chega pela primeira vez.","Мы можем помочь сориентироваться тем, кто пришёл впервые."],["Se alguém precisar de ajuda, vamos encaminhá-lo à pessoa responsável.","Если кому-то понадобится помощь, мы направим его к ответственному человеку."]],{"example":0,"answer":"trate"},["Опиши, как команда должна встретить посетителя.","Descreva como uma equipe deve receber um visitante.","É essencial que a equipe receba cada visitante com respeito. Primeiro, alguém pode explicar onde ficam os lugares de reunião. Se a pessoa tiver uma dúvida, podemos encaminhá-la ao responsável."]],
["B1","Betânia","Preparar uma reunião","Подготовить собрание","bíblico","Antes que + subjuntivo; antes de + infinitivo quando o sujeito é o mesmo.","Antes que + subjuntivo; antes de + инфинитив при одном субъекте.",[["preparativo","подготовка"],["organização","организация"],["verificar","проверять"],["equipamento","оборудование"],["antecedência","заблаговременность"]],[["Verifique o equipamento antes que a reunião comece.","Проверь оборудование, прежде чем начнётся собрание."],["A organização dos preparativos exige antecedência.","Организация подготовки требует заблаговременного планирования."],["Antes de sair, confirme se tudo está pronto.","Перед уходом убедись, что всё готово."]],{"example":0,"answer":"comece"},["Объясни три действия по подготовке к собранию.","Explique três preparativos para uma reunião.","Antes que a reunião comece, precisamos organizar as cadeiras. Convém verificar o equipamento de som com antecedência. Por fim, a equipe deve confirmar se os materiais estão prontos."]],
["B1","Galileia","Distribuir tarefas","Распределять обязанности","bíblico","É preciso que + subjuntivo; cada um exige verbo no singular.","É preciso que + subjuntivo; cada um требует единственного числа.",[["responsabilidade","ответственность"],["atribuição","обязанность"],["distribuir","распределять"],["colaboração","сотрудничество"],["disponibilidade","наличие свободного времени"]],[["É preciso que cada um assuma uma responsabilidade.","Нужно, чтобы каждый взял на себя ответственность."],["Vamos distribuir as atribuições conforme a disponibilidade de cada pessoa.","Распределим обязанности с учётом свободного времени каждого."],["A colaboração torna o trabalho mais organizado.","Сотрудничество делает работу более организованной."]],{"example":0,"answer":"assuma"},["Предложи распределение задач для вымышленной команды.","Proponha uma divisão de tarefas para uma equipe fictícia.","É preciso que cada participante escolha uma tarefa que possa cumprir. Ana ficará responsável pelos materiais, enquanto Rui verificará o som. Outra pessoa poderá acolher os visitantes."]],
["B1","Nazaré","Pedir esclarecimentos","Просить разъяснения","bíblico","Gostaria de saber se + indicativo; gostaria que + imperfeito do subjuntivo.","Gostaria de saber se + indicativo для вежливого вопроса; gostaria que + imperfeito do subjuntivo для пожелания.",[["esclarecimento","разъяснение"],["orientar","давать указания"],["procedimento","порядок действий"],["dúvida","сомнение, вопрос"],["detalhar","подробно объяснять"]],[["Gostaria que o responsável detalhasse o procedimento.","Я хотела бы, чтобы ответственный подробно объяснил порядок действий."],["Tenho uma dúvida e gostaria de saber se posso ajudar.","У меня есть вопрос, и я хотела бы узнать, могу ли помочь."],["Agradeço o esclarecimento e a orientação.","Благодарю за разъяснение и указания."]],{"example":0,"answer":"detalhasse"},["Напиши вежливую просьбу о разъяснении.","Escreva um pedido educado de esclarecimento.","Boa tarde! Gostaria de saber se posso ajudar na preparação da atividade. Seria possível explicar quais são as tarefas disponíveis? Agradeço desde já pela orientação."]],
["B1","Jerusalém","Escutar com atenção","Слушать внимательно","bíblico","Enquanto + indicativo descreve ações simultâneas habituais ou passadas.","Enquanto + indicativo описывает одновременные привычные или прошлые действия.",[["escuta","слушание"],["atento","внимательный"],["interromper","перебивать"],["compreensão","понимание"],["consideração","уважение, внимание"]],[["Enquanto a pessoa falava, eu permanecia atento.","Пока человек говорил, я внимательно слушал."],["Evitei interromper para demonstrar consideração.","Я старался не перебивать, чтобы проявить уважение."],["A escuta cuidadosa favorece a compreensão.","Внимательное слушание способствует пониманию."]],{"example":0,"answer":"falava"},["Опиши разговор, в котором кто-то внимательно слушал.","Descreva uma conversa em que alguém escutou com atenção.","Enquanto Ana falava, Paulo escutava com atenção. Ele esperou que ela terminasse antes de fazer uma pergunta. Assim, os dois conseguiram compreender melhor a situação."]],
["B1","Betânia","Convidar sem pressionar","Приглашать без давления","bíblico","Caso + subjuntivo; fique à vontade para + infinitivo.","Caso + subjuntivo выражает условие; fique à vontade para — не стесняйся.",[["convite","приглашение"],["aceitar","принимать"],["recusar","отказываться"],["escolha","выбор"],["cordialidade","сердечность"]],[["Caso você queira participar, será bem-vindo.","Если захочешь участвовать, будем рады тебе."],["Fique à vontade para aceitar ou recusar o convite.","Можешь свободно принять приглашение или отказаться."],["Respeitamos sua escolha e agradecemos a cordialidade.","Мы уважаем твой выбор и благодарим за сердечность."]],{"example":0,"answer":"queira"},["Составь уважительное приглашение на вымышленное мероприятие.","Faça um convite respeitoso para uma atividade fictícia.","Estamos preparando uma atividade de leitura no sábado. Caso você queira participar, será muito bem-vindo. Fique à vontade para recusar se preferir outro compromisso."]],
["B1","Galileia","Explicar um aviso","Объяснять объявление","bíblico","Discurso indireto no passado: disse que + imperfeito; disse que faria para futuro no passado.","Косвенная речь после disse: imperfeito для одновременности, faria для будущего в прошлом.",[["comunicado","сообщение"],["adiamento","перенос"],["informar","сообщать"],["confirmar","подтверждать"],["alteração","изменение"]],[["O responsável informou que a reunião começaria mais tarde.","Ответственный сообщил, что собрание начнётся позже."],["O comunicado explicava o motivo do adiamento.","В сообщении объяснялась причина переноса."],["Precisamos confirmar a alteração antes de divulgá-la.","Нужно подтвердить изменение, прежде чем его распространять."]],{"example":0,"answer":"começaria"},["Перескажи вымышленное объявление об изменении времени.","Relate um aviso fictício sobre mudança de horário.","O responsável informou que a reunião começaria uma hora mais tarde. Ele explicou que a sala ainda estava sendo preparada. A equipe ficou de confirmar o novo horário."]],
["B1","Nazaré","Trabalhar em conjunto","Работать сообща","bíblico","Quanto mais + oração, mais + oração; comparar processos sem duplicar o sujeito.","Quanto mais… mais… — чем больше, тем больше; сравнение процессов.",[["cooperação","сотрудничество"],["entrosamento","слаженность"],["iniciativa","инициатива"],["objetivo comum","общая цель"],["contribuição","вклад"]],[["Quanto mais cooperamos, mais fácil fica alcançar o objetivo comum.","Чем больше мы сотрудничаем, тем легче достичь общей цели."],["Cada contribuição melhora o entrosamento da equipe.","Каждый вклад улучшает слаженность команды."],["Uma iniciativa simples pode beneficiar todos.","Простая инициатива может принести пользу всем."]],{"example":0,"answer":"cooperamos"},["Объясни, как сотрудничество улучшает совместную деятельность.","Explique como a cooperação melhora uma atividade coletiva.","Quanto mais a equipe compartilha informações, mais fácil é organizar as tarefas. Cada pessoa pode contribuir com uma habilidade diferente. Dessa forma, o grupo alcança o objetivo comum."]],
["B1","Jerusalém","Lidar com imprevistos","Справляться с неожиданностями","bíblico","Mesmo que + subjuntivo indica concessão; ainda assim introduz consequência contrastante.","Mesmo que + subjuntivo означает даже если; ainda assim — всё же.",[["imprevisto","непредвиденная ситуация"],["alternativa","альтернатива"],["adaptar","приспосабливать"],["prioridade","приоритет"],["tranquilidade","спокойствие"]],[["Mesmo que surja um imprevisto, podemos adaptar o plano.","Даже если возникнет непредвиденная ситуация, мы можем изменить план."],["Vamos escolher uma alternativa conforme a prioridade.","Выберем альтернативу с учётом приоритета."],["Agir com tranquilidade ajuda a resolver dificuldades.","Спокойные действия помогают решать трудности."]],{"example":0,"answer":"surja"},["Расскажи, как команда справилась бы с простой неожиданностью.","Conte como uma equipe lidaria com um imprevisto simples.","Mesmo que o projetor não funcione, podemos usar materiais impressos. A equipe pode reorganizar a atividade com tranquilidade. O importante é manter a comunicação clara."]],
["B1","Betânia","Dar retorno à equipe","Давать обратную связь","bíblico","O que + oração funciona como substantivo; convém + infinitivo dá conselho impessoal.","O que + предложение означает «то, что»; convém + инфинитив — безличный совет.",[["retorno","обратная связь"],["aprimorar","совершенствовать"],["observação","замечание"],["resultado","результат"],["proposta","предложение"]],[["Convém registrar o que funcionou bem.","Стоит записать то, что получилось хорошо."],["Uma observação respeitosa pode aprimorar o resultado.","Уважительное замечание может улучшить результат."],["Apresente uma proposta concreta, sem criticar a pessoa.","Предложи конкретное решение, не критикуя человека."]],{"example":0,"answer":"Convém"},["Напиши конструктивную обратную связь о вымышленном мероприятии.","Escreva um retorno construtivo sobre uma atividade imaginária.","A atividade foi bem organizada e os participantes receberam as informações necessárias. Contudo, seria útil preparar os materiais com mais antecedência. Sugiro que a equipe revise a lista de tarefas."]],
["B1","Galileia","Traduzir uma mensagem","Переводить послание","bíblico","Ao + infinitivo indica quando; em vez de + infinitivo apresenta substituição.","Ao + инфинитив означает «при/когда»; em vez de + инфинитив — вместо.",[["fidelidade","точность, верность"],["contexto","контекст"],["sentido","смысл"],["equivalente","эквивалент"],["omitir","опускать"]],[["Ao traduzir uma mensagem, considere o contexto.","Переводя послание, учитывай контекст."],["Procure um equivalente que preserve o sentido.","Ищи эквивалент, сохраняющий смысл."],["Em vez de omitir uma ideia, peça esclarecimento.","Вместо того чтобы опустить мысль, попроси разъяснение."]],{"example":0,"answer":"Ao traduzir"},["Объясни два правила точного перевода.","Explique duas regras para uma tradução fiel.","Ao traduzir, é importante preservar a ideia central da mensagem. Se uma expressão tiver vários sentidos, devemos considerar o contexto. Em vez de inventar uma explicação, podemos pedir esclarecimento."]],
["B1","Nazaré","Preparar a interpretação","Подготовиться к устному переводу","bíblico","Se + futuro do subjuntivo expressa condição futura: se houver, se vier, se fizer.","Se + futuro do subjuntivo выражает будущее условие: houver, vier, fizer.",[["intérprete","устный переводчик"],["trecho","отрывок"],["antecipar","предвидеть"],["terminologia","терминология"],["anotação","заметка"]],[["Se houver termos desconhecidos, faça uma anotação.","Если будут незнакомые термины, сделай заметку."],["O intérprete pode antecipar parte da terminologia.","Переводчик может заранее подготовить часть терминологии."],["Leia o trecho antes de começar a interpretação.","Прочитай отрывок перед началом устного перевода."]],{"example":0,"answer":"houver"},["Опиши подготовку к переводу короткого послания.","Descreva sua preparação para interpretar uma mensagem curta.","Antes da interpretação, leio o tema da mensagem e preparo uma lista de palavras. Se houver termos desconhecidos, procuro seus equivalentes. Depois, pratico a tradução de alguns trechos curtos."]],
["B1","Jerusalém","Pedir uma pausa","Попросить паузу","bíblico","Poderia + infinitivo torna um pedido mais cortês; para + infinitivo indica finalidade.","Poderia + инфинитив смягчает просьбу; para + инфинитив выражает цель.",[["pausa","пауза"],["ritmo","темп"],["repetição","повторение"],["segmento","фрагмент"],["acompanhar","успевать следить"]],[["Poderia repetir o último segmento, por favor?","Не могли бы вы повторить последний фрагмент?"],["Uma breve pausa ajuda a acompanhar o ritmo da fala.","Короткая пауза помогает следить за темпом речи."],["Peço a repetição para transmitir a mensagem com precisão.","Я прошу повторить, чтобы точно передать послание."]],{"example":0,"answer":"Poderia repetir"},["Составь вежливые просьбы для ситуации устного перевода.","Formule pedidos educados para uma situação de interpretação.","Poderia falar um pouco mais devagar, por favor? Gostaria de confirmar o sentido da última frase. Se for possível, peço uma breve pausa para concluir a tradução."]],
["B1","Betânia","Resumir sem distorcer","Кратко пересказывать без искажений","bíblico","Apesar de + substantivo/infinitivo; embora + subjuntivo.","Apesar de + существительное/инфинитив; embora + subjuntivo выражает уступку.",[["resumo","краткий пересказ"],["essência","суть"],["distorção","искажение"],["selecionar","отбирать"],["relevante","существенный"]],[["Embora o texto seja longo, devemos preservar sua essência.","Хотя текст длинный, нужно сохранить его суть."],["Selecione as ideias relevantes para o resumo.","Отбери существенные мысли для пересказа."],["Apesar da dificuldade, evite qualquer distorção do sentido.","Несмотря на сложность, избегай любого искажения смысла."]],{"example":0,"answer":"seja"},["Кратко перескажи вымышленное послание о сотрудничестве: каждый вносит вклад, важно уважение и распределение задач.","Resuma a mensagem fictícia: cada pessoa contribui, o respeito importa e as tarefas precisam ser distribuídas.","A mensagem destaca que cada pessoa pode contribuir para o trabalho coletivo. A cooperação exige comunicação e respeito. Por isso, é importante distribuir as tarefas de forma organizada."]],
["B1","Galileia","Falar diante de um grupo","Говорить перед группой","bíblico","É provável que + subjuntivo; provavelmente + indicativo.","É provável que + subjuntivo; provavelmente + indicativo выражают вероятность.",[["exposição","изложение"],["clareza","ясность"],["introdução","вступление"],["conclusão","заключение"],["nervosismo","волнение"]],[["É provável que alguém sinta nervosismo antes da exposição.","Вероятно, кто-то почувствует волнение перед выступлением."],["Uma introdução breve ajuda a transmitir a ideia com clareza.","Краткое вступление помогает ясно передать мысль."],["Prepare também uma conclusão simples.","Подготовь также простое заключение."]],{"example":0,"answer":"sinta"},["Подготовь вступление и заключение выступления о доброжелательности.","Prepare uma introdução e conclusão de uma fala sobre gentileza.","Hoje gostaria de falar sobre a gentileza em nossas relações. Um pequeno gesto de atenção pode melhorar uma conversa. Para concluir, proponho que pratiquemos o respeito nas situações do dia a dia."]],
["B1","Nazaré","Registrar uma atividade","Освещать мероприятие","bíblico","Voz passiva com ser + particípio; concordância com o sujeito.","Пассив с ser + причастие, согласованное с подлежащим.",[["registro","запись, отчёт"],["autorização","разрешение"],["imagem","изображение"],["divulgação","публикация"],["preservar","сохранять"]],[["As imagens foram divulgadas somente com autorização.","Изображения были опубликованы только с разрешения."],["O registro da atividade foi preparado pela equipe.","Отчёт о мероприятии был подготовлен командой."],["Precisamos preservar a privacidade das pessoas.","Нам нужно уважать конфиденциальность людей."]],{"example":0,"answer":"foram divulgadas"},["Опиши уважительный порядок фото- или видеосъёмки мероприятия.","Descreva um procedimento respeitoso para registrar uma atividade.","Antes de registrar a atividade, devemos pedir autorização às pessoas envolvidas. As imagens precisam ser selecionadas com cuidado. Somente o conteúdo autorizado deve ser divulgado."]],
["B1","Jerusalém","Organizar uma legenda","Составлять подпись к публикации","bíblico","O pronome relativo que retoma um antecedente; evite informações pessoais desnecessárias.","Относительное que относится к предыдущему слову; избегай ненужных личных данных.",[["legenda","подпись"],["publicação","публикация"],["revisão","проверка"],["coerência","связность"],["aprovação","одобрение"]],[["A legenda que escrevemos apresenta o tema da atividade.","Подпись, которую мы написали, представляет тему мероприятия."],["A publicação passa por revisão antes da aprovação.","Публикация проходит проверку до одобрения."],["Verifique a coerência entre o texto e a imagem.","Проверь соответствие текста изображению."]],{"example":0,"answer":"que"},["Напиши короткую вымышленную подпись о благотворительном мероприятии.","Escreva uma legenda fictícia e breve sobre uma atividade solidária.","Hoje realizamos uma atividade solidária voltada à cooperação. Agradecemos a todos que contribuíram voluntariamente. Cada gesto de gentileza fez diferença na organização do encontro."]],
["B1","Betânia","Participar de um projeto","Участвовать в проекте","bíblico","Desde que + subjuntivo pode indicar condição; desde que + indicativo pode indicar início no tempo.","Desde que + subjuntivo — при условии; с indicativo — с тех пор как.",[["projeto social","социальный проект"],["participação","участие"],["planejamento","планирование"],["beneficiário","получатель помощи"],["disponível","доступный"]],[["Podemos participar desde que haja uma equipe disponível.","Мы можем участвовать при условии, что есть свободная команда."],["O planejamento considera as necessidades dos beneficiários.","Планирование учитывает потребности получателей помощи."],["A participação é voluntária.","Участие добровольное."]],{"example":0,"answer":"haja"},["Опиши условия участия в вымышленном проекте.","Descreva as condições para participar de um projeto fictício.","Podemos participar do projeto desde que haja tempo e disponibilidade. A equipe precisa conhecer as tarefas e os objetivos da atividade. A participação deve ser voluntária e respeitar os limites de cada pessoa."]],
["B1","Galileia","Ajudar com respeito","Помогать с уважением","bíblico","Não só... mas também... coordena elementos paralelos.","Não só… mas também… соединяет однородные части: не только… но и…",[["solidariedade","солидарность"],["dignidade","достоинство"],["necessidade","потребность"],["apoio","поддержка"],["oferecer","предлагать"]],[["A solidariedade exige não só boa vontade, mas também respeito à dignidade.","Солидарность требует не только доброй воли, но и уважения к достоинству."],["Podemos oferecer apoio conforme a necessidade da pessoa.","Мы можем предложить поддержку с учётом потребностей человека."],["É importante perguntar antes de ajudar.","Важно спросить, прежде чем помогать."]],{"example":0,"answer":"mas também"},["Объясни, как предложить помощь, не навязывая решения.","Explique como oferecer ajuda sem impor uma decisão.","Primeiro, devemos perguntar se a pessoa deseja receber ajuda. Caso aceite, podemos conversar sobre suas necessidades. Respeitar sua escolha é tão importante quanto oferecer apoio."]],
["B1","Nazaré","Resolver uma divergência","Разрешать разногласие","bíblico","Por mais que + subjuntivo indica concessão; procurar + infinitivo indica tentativa.","Por mais que + subjuntivo — как бы ни; procurar + инфинитив — стараться.",[["divergência","разногласие"],["acordo","согласие"],["ponto de vista","точка зрения"],["negociar","договариваться"],["convivência","совместное общение"]],[["Por mais que discordemos, podemos dialogar com respeito.","Как бы мы ни расходились во мнениях, мы можем разговаривать уважительно."],["Procure compreender o ponto de vista da outra pessoa.","Постарайся понять точку зрения другого человека."],["Um acordo pode melhorar a convivência da equipe.","Согласие может улучшить отношения в команде."]],{"example":0,"answer":"discordemos"},["Опиши уважительное решение вымышленного разногласия.","Descreva uma solução respeitosa para uma divergência fictícia.","Embora duas pessoas discordem sobre o planejamento, podem discutir suas razões com calma. Cada uma deve ter oportunidade de falar. Depois, o grupo pode buscar uma solução que seja aceitável para todos."]],
["B1","Galileia","Narrar os acontecimentos","Рассказывать о событиях","bíblico","Pretérito perfeito para fatos concluídos; imperfeito para o cenário.","Perfeito — завершённые события; imperfeito — фон повествования.",[["acontecimento","событие"],["cenário","обстановка"],["trajetória","путь"],["prosseguir","продолжать путь"],["relatar","рассказывать"]],[["Enquanto os discípulos conversavam, Jesus chegou.","Пока ученики разговаривали, Иисус пришёл."],["O relato apresenta o cenário antes do acontecimento.","Повествование описывает обстановку перед событием."],["Depois, o grupo prosseguiu sua trajetória.","Затем группа продолжила свой путь."]],{"example":0,"answer":"conversavam"},["Перескажи библейскую сцену, используя два прошедших времени.","Narre uma cena bíblica usando os dois passados.","Os discípulos estavam reunidos quando Jesus apareceu, conforme o relato de João 20. Eles receberam sua presença com alegria. A narrativa passa do medo inicial ao encontro com Jesus."]],
["B1","Jerusalém","A sequência dos fatos","Последовательность событий","bíblico","Já tinha + particípio indica fato anterior a outro fato passado.","Já tinha + причастие — событие, произошедшее раньше другого прошедшего события.",[["sequência","последовательность"],["anteriormente","ранее"],["posteriormente","впоследствии"],["partida","отправление"],["chegada","прибытие"]],[["Quando o grupo chegou, o mensageiro já tinha partido.","Когда группа прибыла, посланник уже ушёл."],["Anteriormente, ele havia recebido uma notícia.","Ранее он получил известие."],["Posteriormente, os viajantes retomaram a viagem.","Позже путешественники продолжили путь."]],{"example":0,"answer":"tinha partido"},["Расположи три вымышленных события в хронологическом порядке.","Organize três acontecimentos de uma narrativa fictícia em ordem temporal.","O mensageiro tinha preparado uma carta antes de sair. Enquanto caminhava, encontrou um viajante. Depois de conversar com ele, entregou a carta no destino."]],
["B1","Betânia","Compreender uma parábola","Понимать притчу","bíblico","Como se + imperfeito do subjuntivo introduz comparação hipotética.","Como se + imperfeito do subjuntivo — как будто.",[["parábola","притча"],["comparação","сравнение"],["semente","семя"],["solo","почва"],["frutificar","приносить плод"]],[["A parábola descreve a vida como se fosse um campo.","Притча описывает жизнь, словно она была полем."],["A semente precisa de um solo adequado para frutificar.","Семени нужна подходящая почва, чтобы принести плод."],["A comparação ajuda a compreender uma ideia abstrata.","Сравнение помогает понять абстрактную мысль."]],{"example":0,"answer":"fosse"},["Объясни образ семени и роста своими словами.","Explique uma imagem de semente e crescimento com suas palavras.","A semente representa algo que pode crescer com o tempo. Assim como uma planta precisa de condições adequadas, o aprendizado exige atenção e prática. A imagem ajuda a compreender a importância do desenvolvimento."]],
["B1","Nazaré","O sentido de uma metáfora","Смысл метафоры","bíblico","Pode significar + substantivo; não significa necessariamente que + indicativo/subjuntivo conforme o sentido.","Pode significar — может означать; не всякая метафора понимается буквально.",[["metáfora","метафора"],["literal","буквальный"],["figurativo","переносный"],["símbolo","символ"],["interpretar","толковать"]],[["A palavra luz pode significar orientação em sentido figurativo.","Слово «свет» может означать руководство в переносном смысле."],["Uma metáfora não deve ser interpretada apenas no sentido literal.","Метафору не следует толковать только буквально."],["O contexto ajuda a compreender o símbolo.","Контекст помогает понять символ."]],{"example":0,"answer":"pode significar"},["Выбери библейскую метафору и объясни её возможный смысл.","Escolha uma metáfora bíblica e explique sua possível interpretação.","Na Bíblia, a luz pode representar orientação e verdade. Essa imagem não precisa ser entendida apenas como iluminação física. O contexto de cada passagem ajuda a reconhecer seu sentido figurativo."]],
["B1","Samaria","A ideia principal","Главная мысль","bíblico","Trata-se de + substantivo; o texto aborda + objeto direto.","Trata-se de — речь идёт о; abordar употребляется без предлога перед дополнением.",[["tema central","основная тема"],["abordagem","подход"],["enfatizar","подчёркивать"],["mensagem central","главное послание"],["identificar","выявлять"]],[["Trata-se de uma reflexão sobre a esperança.","Речь идёт о размышлении о надежде."],["O texto enfatiza a importância da perseverança.","Текст подчёркивает важность стойкости."],["Podemos identificar a mensagem central pelos detalhes recorrentes.","Можно выявить главную мысль по повторяющимся деталям."]],{"example":0,"answer":"Trata-se de"},["Объясни главную мысль прочитанного отрывка.","Explique a ideia principal de uma passagem que você leu.","No início de João, a imagem da luz ocupa um lugar importante. O relato também apresenta o testemunho de João Batista. Uma das ideias centrais é a apresentação de Jesus ao leitor."]],
["B1","Galileia","Comparar dois relatos","Сравнивать два повествования","bíblico","Ao contrário de; tanto... quanto... para semelhanças.","Ao contrário de — в отличие от; tanto… quanto… — как… так и…",[["semelhança","сходство"],["diferença","различие"],["perspectiva","точка зрения"],["ênfase","акцент"],["contraste","контраст"]],[["Ao contrário do primeiro relato, o segundo enfatiza a reação das pessoas.","В отличие от первого рассказа, второй подчёркивает реакцию людей."],["Tanto um texto quanto o outro apresentam uma perspectiva própria.","И один, и другой текст представляют собственную перспективу."],["Identificar semelhanças e diferenças exige atenção.","Выявление сходств и различий требует внимания."]],{"example":0,"answer":"Ao contrário do"},["Сравни два известных рассказа, не выдумывая деталей.","Compare dois relatos conhecidos sem inventar detalhes.","João 3 apresenta um diálogo com Nicodemos, enquanto João 4 narra o encontro com a mulher samaritana. Nos dois relatos, Jesus conversa com pessoas que procuram compreender uma questão. Cada passagem desenvolve seu tema em um contexto diferente."]],
["B1","Jerusalém","Uma promessa e a espera","Обещание и ожидание","bíblico","Até que + subjuntivo quando o término ainda não aconteceu.","Até que + subjuntivo, если ожидаемое завершение ещё не наступило.",[["promessa","обещание"],["expectativa","ожидание"],["paciência","терпение"],["aguardar","ожидать"],["cumprimento","исполнение"]],[["Vamos aguardar até que a situação se esclareça.","Будем ждать, пока ситуация не прояснится."],["A paciência é importante durante a espera.","Терпение важно во время ожидания."],["O cumprimento de uma promessa pode renovar a esperança.","Исполнение обещания может обновить надежду."]],{"example":0,"answer":"se esclareça"},["Напиши о различии между ожиданием и отказом от цели.","Escreva sobre a diferença entre esperar e desistir.","Esperar não significa abandonar uma responsabilidade. Podemos ter paciência enquanto buscamos maneiras de agir. Desistir, por outro lado, significa deixar de perseguir determinado objetivo."]],
["B1","Betânia","A confiança em meio à incerteza","Доверие в неопределённости","bíblico","Ainda que + subjuntivo apresenta concessão.","Ainda que + subjuntivo — даже если, хотя.",[["incerteza","неопределённость"],["segurança","уверенность"],["convicção","убеждённость"],["hesitar","колебаться"],["entregar","вверять"]],[["Ainda que haja incerteza, podemos confiar em Deus.","Даже если есть неопределённость, мы можем доверять Богу."],["A convicção não elimina todas as perguntas.","Убеждённость не устраняет все вопросы."],["Quem hesita também pode buscar orientação.","Тот, кто колеблется, тоже может искать руководство."]],{"example":0,"answer":"haja"},["Объясни, как можно справляться с неопределённостью с верой и благоразумием.","Explique como alguém pode lidar com a incerteza com fé e prudência.","Ainda que uma pessoa esteja insegura, ela pode orar e refletir. Também é prudente procurar informações e conversar com pessoas de confiança. A fé pode acompanhar decisões responsáveis."]],
["B1","Nazaré","O valor da sabedoria","Ценность мудрости","bíblico","Quem + verbo pode formar oração relativa sem antecedente expresso.","Quem + глагол может означать «тот, кто».",[["sabedoria","мудрость"],["discernimento","рассудительность"],["prudência","благоразумие"],["ponderar","взвешивать"],["insensato","неразумный"]],[["Quem procura sabedoria aprende a ponderar suas escolhas.","Тот, кто ищет мудрости, учится взвешивать свои решения."],["O discernimento ajuda a reconhecer uma atitude insensata.","Рассудительность помогает распознать неразумный поступок."],["A prudência inclui ouvir conselhos e avaliar consequências.","Благоразумие включает умение слушать советы и оценивать последствия."]],{"example":0,"answer":"Quem procura"},["Представь три признака мудрости в повседневной жизни.","Apresente três características da sabedoria na vida cotidiana.","Quem age com sabedoria procura ouvir antes de responder. Também considera as consequências de suas escolhas. Além disso, reconhece quando precisa de orientação."]],
["B1","Samaria","A justiça e a misericórdia","Справедливость и милосердие","bíblico","Embora + subjuntivo; no entanto liga duas afirmações contrastantes.","Embora + subjuntivo — хотя; no entanto — однако.",[["justiça","справедливость"],["compaixão","сострадание"],["equidade","беспристрастность"],["julgar","судить"],["restaurar","восстанавливать"]],[["Embora a justiça seja necessária, a compaixão também importa.","Хотя справедливость необходима, сострадание тоже важно."],["Julgar sem conhecer o contexto pode ser injusto.","Судить, не зная контекста, может быть несправедливо."],["A misericórdia pode ajudar a restaurar relações.","Милосердие может помочь восстановить отношения."]],{"example":0,"answer":"seja"},["Объясни, как справедливость и милосердие могут сосуществовать.","Explique como justiça e misericórdia podem coexistir.","A justiça procura reconhecer responsabilidades e evitar injustiças. A misericórdia considera a situação e a dignidade das pessoas. Embora sejam conceitos diferentes, ambos podem orientar uma decisão cuidadosa."]],
["B1","Galileia","Reconhecer uma falha","Признавать ошибку","bíblico","Ter + particípio pode expressar ação repetida até o presente; admitir que + indicativo.","Ter + причастие может выражать повторяющееся действие до настоящего; admitir que + indicativo.",[["falha","ошибка, недостаток"],["reconhecimento","признание"],["corrigir","исправлять"],["admitir","признавать"],["reparação","исправление вреда"]],[["Tenho procurado corrigir minhas falhas.","Я в последнее время стараюсь исправлять свои ошибки."],["Admito que nem sempre agi com prudência.","Признаю, что не всегда поступал благоразумно."],["O reconhecimento de um erro pode iniciar a reparação.","Признание ошибки может стать началом исправления вреда."]],{"example":0,"answer":"Tenho procurado"},["Опиши без личных подробностей, как можно признать и исправить ошибку.","Descreva, sem detalhes pessoais, como alguém pode reconhecer e corrigir um erro.","Uma pessoa pode perceber que forneceu uma informação incorreta. O primeiro passo é reconhecer o erro e esclarecer o que aconteceu. Depois, deve procurar reparar as consequências possíveis."]],
["B1","Jerusalém","Perdoar e estabelecer limites","Прощать и устанавливать границы","bíblico","Mesmo quando + indicativo para situação real; mesmo que + subjuntivo para hipótese.","Mesmo quando + indicativo — реальная ситуация; mesmo que + subjuntivo — гипотеза.",[["reconciliação","примирение"],["limite","граница"],["mágoa","обида"],["restabelecer","восстанавливать"],["seguro","безопасный"]],[["Mesmo quando perdoamos, podemos estabelecer limites seguros.","Даже когда мы прощаем, мы можем устанавливать безопасные границы."],["A reconciliação exige respeito de ambas as partes.","Примирение требует уважения с обеих сторон."],["Restabelecer a confiança pode levar tempo.","Восстановление доверия может занять время."]],{"example":0,"answer":"perdoamos"},["Объясни, почему прощение и границы могут быть совместимы.","Explique por que perdão e limites podem ser compatíveis.","Perdoar alguém não significa aceitar qualquer comportamento. Podemos estabelecer limites para proteger nossa segurança e tranquilidade. A confiança pode ser reconstruída apenas quando existe respeito."]],
["B1","Betânia","A gratidão","Благодарность","bíblico","Não deixar de + infinitivo significa continuar ou não esquecer de fazer algo.","Não deixar de + инфинитив — не переставать или не забывать делать.",[["gratidão","благодарность"],["reconhecer","признавать"],["valorizar","ценить"],["benefício","польза"],["generosidade","щедрость"]],[["Não devemos deixar de reconhecer a generosidade dos outros.","Мы не должны забывать признавать щедрость других."],["A gratidão nos ajuda a valorizar pequenos gestos.","Благодарность помогает ценить небольшие поступки."],["Reconhecer um benefício não exige ignorar as dificuldades.","Признание пользы не требует игнорировать трудности."]],{"example":0,"answer":"deixar de"},["Напиши короткое размышление о благодарности.","Escreva uma reflexão breve sobre gratidão.","A gratidão nos ajuda a perceber gestos de cuidado que às vezes passam despercebidos. Podemos agradecer a quem nos oferece apoio. Também podemos demonstrar gratidão por meio de atitudes concretas."]],
["B1","Nazaré","O chamado e a responsabilidade","Призвание и ответственность","bíblico","Caber a alguém + infinitivo expressa responsabilidade; cabe a nós.","Caber a alguém + инфинитив — быть обязанностью кого-либо; cabe a nós — нам надлежит.",[["chamado","призвание"],["vocação","призвание, склонность"],["compromisso","обязательство"],["dedicação","преданность"],["cumprir","выполнять"]],[["Cabe a nós cumprir os compromissos que assumimos.","Нам надлежит выполнять взятые обязательства."],["A dedicação pode fazer parte de uma vocação.","Преданность может быть частью призвания."],["Um chamado não elimina a necessidade de aprender.","Призвание не устраняет необходимости учиться."]],{"example":0,"answer":"Cabe a nós"},["Опиши, что значит ответственно брать на себя обязательство.","Descreva o que significa assumir um compromisso com responsabilidade.","Assumir um compromisso significa compreender as responsabilidades envolvidas. É importante avaliar se temos condições de cumprir o que prometemos. Quando não for possível, devemos comunicar a situação com honestidade."]],
["B1","Samaria","A liberdade de escolher","Свобода выбора","bíblico","Ter o direito de + infinitivo; independentemente de + substantivo.","Ter o direito de — иметь право; independentemente de — независимо от.",[["livre-arbítrio","свобода воли"],["consciência","совесть, сознание"],["autonomia","самостоятельность"],["consequência","последствие"],["decidir","решать"]],[["Cada pessoa tem o direito de decidir com autonomia.","Каждый человек имеет право принимать решения самостоятельно."],["O livre-arbítrio está relacionado à responsabilidade pelas escolhas.","Свобода воли связана с ответственностью за выбор."],["Devemos respeitar a consciência alheia, independentemente das diferenças.","Следует уважать совесть других независимо от различий."]],{"example":0,"answer":"tem o direito de"},["Напиши о свободе и ответственности при принятии решений.","Escreva sobre liberdade e responsabilidade na tomada de decisões.","Ter liberdade de escolha implica considerar diferentes possibilidades. Cada pessoa precisa avaliar as consequências de suas decisões. Respeitar a liberdade alheia também faz parte da responsabilidade."]],
["B1","Galileia","Ler o contexto histórico","Читать исторический контекст","bíblico","Em que e no qual retomam lugar, época ou situação.","Em que и no qual относятся к месту, эпохе или ситуации.",[["época","эпоха"],["costume","обычай"],["território","территория"],["contextualizar","помещать в контекст"],["circunstância","обстоятельство"]],[["A época em que o relato se passa influencia sua compreensão.","Эпоха, в которую происходит рассказ, влияет на его понимание."],["Os costumes podem variar de um território para outro.","Обычаи могут различаться от одной территории к другой."],["Contextualizar uma narrativa ajuda a entender suas circunstâncias.","Исторический контекст помогает понять обстоятельства повествования."]],{"example":0,"answer":"em que"},["Объясни, почему исторический контекст важен при чтении.","Explique por que o contexto histórico importa na leitura.","Conhecer o contexto histórico ajuda a entender os costumes de uma época. Uma imagem pode ter um significado diferente daquele que imaginamos hoje. Por isso, devemos observar as circunstâncias do relato antes de interpretá-lo."]],
["B1","Jerusalém","Citar e parafrasear","Цитировать и перефразировать","bíblico","Segundo + fonte atribui uma ideia; com minhas palavras marca paráfrase.","Segundo + источник — согласно; com minhas palavras — своими словами.",[["citação","цитата"],["paráfrase","перефразирование"],["fonte","источник"],["atribuir","приписывать"],["referência","ссылка"]],[["Segundo o autor do comentário, a imagem tem sentido figurativo.","Согласно автору комментария, образ имеет переносный смысл."],["Uma paráfrase explica a ideia com outras palavras.","Перефразирование объясняет мысль другими словами."],["A referência permite localizar a fonte original.","Ссылка позволяет найти первоначальный источник."]],{"example":0,"answer":"Segundo"},["Объясни различие между цитатой и пересказом своими словами.","Explique a diferença entre uma citação e uma paráfrase.","Uma citação reproduz as palavras de uma fonte e precisa ser identificada corretamente. Uma paráfrase apresenta a mesma ideia com outras palavras. Em ambos os casos, devemos indicar de onde veio a informação."]],
["B1","Betânia","João e o testemunho","Иоанн и свидетельство","bíblico","O verbo testemunhar pode vir com sobre; afirmar que + indicativo.","Testemunhar sobre — свидетельствовать о; afirmar que + indicativo.",[["testemunhar","свидетельствовать"],["evidência","свидетельство, доказательство"],["declaração","заявление"],["anunciar","возвещать"],["afirmar","утверждать"]],[["João Batista testemunha sobre Jesus no início do Evangelho.","Иоанн Креститель свидетельствует об Иисусе в начале Евангелия."],["O narrador apresenta suas declarações em determinado contexto.","Повествователь приводит его высказывания в определённом контексте."],["Um resumo deve distinguir o relato de nossa interpretação.","Пересказ должен отличать повествование от нашего толкования."]],{"example":0,"answer":"testemunha sobre"},["Перескажи роль Иоанна Крестителя в начале Евангелия от Иоанна.","Resuma o papel de João Batista no início de João.","No início do Evangelho de João, João Batista aparece como testemunha de Jesus. O relato apresenta sua missão de preparar e anunciar. Sua função no texto não é ocupar o lugar daquele sobre quem testemunha."]],
["B1","Nazaré","Nicodemos e as perguntas","Никодим и вопросы","bíblico","Pergunta indireta: não entendeu como + indicativo; perguntou se + indicativo.","Косвенный вопрос: não entendeu como, perguntou se + indicativo.",[["indagação","вопрос, исследование"],["diálogo","диалог"],["compreender","понимать"],["questionar","задавать вопросы"],["nascimento","рождение"]],[["Nicodemos perguntou como alguém poderia nascer de novo.","Никодим спросил, как человек мог бы родиться заново."],["O diálogo de João 3 apresenta uma questão espiritual.","Диалог в 3-й главе Иоанна затрагивает духовный вопрос."],["Para compreender a passagem, é útil observar as perguntas.","Чтобы понять отрывок, полезно обратить внимание на вопросы."]],{"example":0,"answer":"como alguém poderia"},["Кратко изложи тему разговора Иисуса с Никодимом.","Resuma o tema da conversa de Jesus com Nicodemos.","Em João 3, Nicodemos conversa com Jesus sobre o nascimento espiritual. Ele faz perguntas para compreender uma ideia que inicialmente lhe parece difícil. O diálogo desenvolve o tema da transformação espiritual."]],
["B1","Samaria","A mulher samaritana","Самарянка","bíblico","O pronome relativo com quem retoma pessoa; conversar com alguém.","Относительное com quem относится к человеку; conversar com — разговаривать с.",[["poço","колодец"],["sede","жажда"],["encontro","встреча"],["fronteira","граница"],["interlocutor","собеседник"]],[["A mulher com quem Jesus conversou era samaritana.","Женщина, с которой разговаривал Иисус, была самарянкой."],["O encontro aconteceu junto a um poço.","Встреча произошла у колодца."],["A conversa ultrapassa barreiras sociais presentes no relato.","Разговор преодолевает социальные барьеры, присутствующие в повествовании."]],{"example":0,"answer":"com quem"},["Перескажи обстоятельства встречи в 4-й главе Иоанна без дословных цитат.","Resuma a situação do encontro em João 4 sem citar literalmente.","Em João 4, Jesus encontra uma mulher samaritana junto a um poço. A conversa começa com a questão da água e passa a temas espirituais. O relato apresenta também a reação da mulher ao encontro."]],
["B1","Galileia","O pão e o alimento","Хлеб и пища","bíblico","Além de + infinitivo acrescenta uma ideia; referir-se a exige a.","Além de + инфинитив — помимо; referir-se a — относиться к чему-либо.",[["alimento","пища"],["multiplicação","умножение"],["sustento","пропитание"],["partilha","разделение с другими"],["referir-se","относиться"]],[["Além de narrar a multiplicação dos pães, João 6 apresenta um ensinamento.","Помимо рассказа об умножении хлебов, 6-я глава Иоанна содержит наставление."],["O alimento aparece tanto no plano concreto quanto no figurativo.","Пища появляется и в буквальном, и в переносном плане."],["O leitor deve observar a que a imagem se refere.","Читателю следует обратить внимание на то, к чему относится образ."]],{"example":0,"answer":"Além de"},["Объясни различие между буквальной и переносной пищей в 6-й главе Иоанна.","Explique a diferença entre alimento literal e figurativo em João 6.","Em João 6, a multiplicação dos pães envolve alimento concreto. Mais adiante, o pão aparece como imagem em um ensinamento espiritual. É necessário distinguir o acontecimento narrado da metáfora desenvolvida no discurso."]],
["B1","Jerusalém","O bom pastor","Добрый пастырь","bíblico","Cuidar de e proteger alguém: regências diferentes.","Cuidar de — заботиться о; proteger — защищать кого-либо без предлога.",[["rebanho","стадо"],["proteção","защита"],["cuidado","забота"],["reconhecível","узнаваемый"],["conduzir","вести"]],[["A imagem do pastor que cuida do rebanho aparece em João 10.","Образ пастыря, заботящегося о стаде, появляется в 10-й главе Иоанна."],["O pastor protege as ovelhas e as conduz.","Пастырь защищает овец и ведёт их."],["A imagem permite refletir sobre cuidado e confiança.","Образ позволяет размышлять о заботе и доверии."]],{"example":0,"answer":"cuida do"},["Объясни метафору пастыря в коротком размышлении.","Explique a metáfora do pastor em uma breve reflexão.","Em João 10, a imagem do pastor ajuda a refletir sobre cuidado e proteção. O rebanho reconhece aquele que o conduz. A metáfora expressa uma relação de confiança."]],
["B1","Betânia","A videira e os ramos","Виноградная лоза и ветви","bíblico","Permanecer + adjetivo ou em + substantivo; a fim de + infinitivo.","Permanecer — оставаться; a fim de + инфинитив — с целью.",[["videira","виноградная лоза"],["ramo","ветвь"],["ligação","связь"],["dependência","зависимость"],["permanecer","оставаться"]],[["O ramo precisa permanecer ligado à videira.","Ветвь должна оставаться соединённой с лозой."],["João 15 apresenta essa imagem para falar de uma ligação espiritual.","15-я глава Иоанна представляет этот образ для объяснения духовной связи."],["A fim de compreender a metáfora, observe a função de cada elemento.","Чтобы понять метафору, обрати внимание на роль каждого элемента."]],{"example":0,"answer":"permanecer ligado"},["Объясни связь между лозой и ветвями в тексте.","Explique a relação entre a videira e os ramos no texto.","Em João 15, os ramos dependem da videira para produzir fruto. A imagem representa uma ligação que sustenta o crescimento. Podemos compreender melhor a metáfora observando a relação entre seus elementos."]],
["B1","Jerusalém","O sentido de uma decisão","Смысл решения","bíblico","Ter de + infinitivo indica necessidade; ter a intenção de indica propósito.","Ter de + инфинитив — необходимость; ter a intenção de — намерение.",[["intenção","намерение"],["deliberação","обдумывание решения"],["coerente","последовательный"],["critério","критерий"],["ponderação","взвешивание"]],[["Temos de avaliar os critérios antes de decidir.","Нам нужно оценить критерии, прежде чем принять решение."],["Uma decisão coerente leva em conta as circunstâncias.","Последовательное решение учитывает обстоятельства."],["A ponderação pode evitar escolhas precipitadas.","Взвешивание помогает избежать поспешных решений."]],{"example":0,"answer":"Temos de"},["Объясни, как благоразумно оценивать решение.","Explique como avaliar uma decisão com prudência.","Antes de decidir, temos de conhecer as opções disponíveis. Depois, devemos ponderar os benefícios e as possíveis consequências. Uma escolha prudente considera também as necessidades das outras pessoas."]],
["B1","Betânia","A oração de agradecimento","Благодарственная молитва","bíblico","Agradecer a alguém por algo; por + infinitivo composto indica ação anterior.","Agradecer a alguém por algo — благодарить кого-то за что-то; por ter + причастие — за совершённое ранее действие.",[["agradecimento","благодарность"],["bondade","доброта"],["amparo","поддержка"],["reconhecido","благодарный"],["cuidado divino","Божья забота"]],[["Agradeço a Deus por ter recebido apoio em momentos difíceis.","Я благодарю Бога за то, что получила поддержку в трудные моменты."],["Reconheço os gestos de bondade das pessoas.","Я признаю добрые поступки людей."],["A gratidão também pode se expressar em ações concretas.","Благодарность может выражаться и в конкретных поступках."]],{"example":0,"answer":"por ter recebido"},["Напиши короткую вымышленную благодарственную молитву без личных сведений.","Escreva uma breve oração fictícia de agradecimento, sem dados pessoais.","Senhor, agradeço pela bondade que encontro nos pequenos gestos. Obrigado pelas oportunidades de aprender e pela ajuda recebida. Que eu saiba demonstrar gratidão em minhas atitudes."]],
["B1","Galileia","Expressar um pedido","Выражать просьбу","bíblico","Peço que + presente do subjuntivo; pedir a alguém que faça algo.","Peço que + presente do subjuntivo; pedir a alguém que — просить кого-то сделать что-то.",[["petição","прошение"],["orientação espiritual","духовное руководство"],["serenidade","спокойствие"],["auxílio","помощь"],["pedir licença","просить разрешения"]],[["Peço que Deus nos dê serenidade e sabedoria.","Я прошу, чтобы Бог дал нам спокойствие и мудрость."],["Podemos pedir auxílio quando precisamos de orientação.","Мы можем попросить помощи, когда нуждаемся в руководстве."],["Uma petição não precisa conter palavras difíceis.","Прошение не обязательно должно содержать сложные слова."]],{"example":0,"answer":"dê"},["Сформулируй три просьбы на португальском с peço que.","Formule três pedidos em português usando peço que.","Peço que Deus nos dê sabedoria. Peço que tenhamos paciência para enfrentar as dificuldades. Peço também que saibamos tratar as pessoas com gentileza."]],
["B1","Nazaré","O consolo","Утешение","bíblico","Estar disposto a + infinitivo; não precisar de + substantivo.","Estar disposto a — быть готовым; precisar de + существительное — нуждаться в.",[["consolo","утешение"],["consolar","утешать"],["sofrimento","страдание"],["presença","присутствие"],["amparar","поддерживать"]],[["Estou disposto a escutar sem fazer julgamentos.","Я готов выслушать без осуждения."],["Às vezes, a presença de alguém oferece consolo.","Иногда присутствие другого человека приносит утешение."],["Podemos amparar quem sofre, respeitando suas necessidades.","Мы можем поддерживать страдающего человека, уважая его потребности."]],{"example":0,"answer":"disposto a"},["Напиши уважительные слова утешения вымышленному персонажу.","Escreva uma mensagem respeitosa de consolo para uma personagem fictícia.","Lamento que você esteja passando por um momento difícil. Se desejar conversar, estou disposto a escutar com atenção. Espero que encontre o apoio de pessoas em quem confia."]],
["B1","Cafarnaum","A esperança no futuro","Надежда на будущее","bíblico","Esperar que + subjuntivo; ter esperança de + infinitivo.","Esperar que + subjuntivo; ter esperança de + инфинитив — надеяться.",[["expectativa positiva","положительное ожидание"],["renovação","обновление"],["ânimo","бодрость духа"],["encorajar","ободрять"],["possibilidade","возможность"]],[["Espero que as coisas melhorem com o tempo.","Надеюсь, что со временем всё улучшится."],["Uma palavra de encorajamento pode renovar o ânimo.","Слово ободрения может обновить бодрость духа."],["Ter esperança não impede que procuremos ajuda prática.","Надежда не мешает нам искать практическую помощь."]],{"example":0,"answer":"melhorem"},["Напиши ободряющее послание, признающее реальные трудности.","Escreva uma mensagem de esperança que também reconheça dificuldades reais.","Sei que a situação não é simples, mas ainda existem possibilidades. Espero que você encontre apoio e consiga avançar aos poucos. Podemos procurar soluções práticas sem deixar de ter esperança."]],
["B1","Jerusalém","A importância da honestidade","Важность честности","bíblico","Se + presente do indicativo para condição geral; sempre que para repetição.","Se + presente do indicativo — общее условие; sempre que — всякий раз когда.",[["honestidade","честность"],["sinceridade","искренность"],["integridade","порядочность"],["enganar","обманывать"],["transparência","открытость"]],[["Se agimos com honestidade, favorecemos a confiança.","Если мы поступаем честно, мы способствуем доверию."],["A integridade inclui reconhecer uma informação incorreta.","Порядочность включает признание неверной информации."],["A sinceridade deve vir acompanhada de respeito.","Искренность должна сопровождаться уважением."]],{"example":0,"answer":"agimos"},["Приведи примеры честности в вымышленной ситуации.","Dê exemplos de honestidade numa situação imaginária.","Imagine que uma estudante encontre um erro em seu trabalho. Ela pode reconhecer a informação incorreta em vez de escondê-la. Depois, corrige o texto e explica o que mudou."]],
["B1","Betânia","Evitar conclusões precipitadas","Не делать поспешных выводов","bíblico","É possível que + subjuntivo; talvez + subjuntivo para hipótese.","É possível que и talvez + subjuntivo выражают предположение.",[["suposição","предположение"],["precipitado","поспешный"],["indício","признак"],["averiguar","выяснять"],["conclusão precipitada","поспешный вывод"]],[["É possível que tenhamos interpretado mal a situação.","Возможно, мы неверно поняли ситуацию."],["Convém averiguar os fatos antes de concluir algo.","Стоит выяснить факты, прежде чем делать вывод."],["Um indício não basta para confirmar uma suposição.","Одного признака недостаточно, чтобы подтвердить предположение."]],{"example":0,"answer":"tenhamos interpretado"},["Объясни, как избежать поспешного вывода о другом человеке.","Explique como evitar uma conclusão precipitada sobre outra pessoa.","É possível que uma informação tenha sido interpretada de maneira errada. Antes de tirar uma conclusão, devemos perguntar o que aconteceu. Também convém verificar se temos fatos suficientes."]],
["B1","Galileia","Discernir o essencial","Различать главное","bíblico","Não se trata de... e sim de... corrige uma interpretação.","Não se trata de… e sim de… — речь не о…, а о…",[["essencial","существенный"],["secundário","второстепенный"],["discernir","различать"],["distinguir","отличать"],["propósito central","главная цель"]],[["Não se trata de decorar palavras, e sim de compreender o sentido.","Речь не о заучивании слов, а о понимании смысла."],["É útil distinguir o essencial do secundário.","Полезно отличать главное от второстепенного."],["O propósito central orienta a interpretação do texto.","Главная цель направляет толкование текста."]],{"example":0,"answer":"e sim de"},["Различи две цели чтения Библии.","Diferencie dois objetivos de uma leitura bíblica.","Um objetivo da leitura bíblica pode ser compreender o vocabulário e a gramática. Outro é refletir sobre a mensagem apresentada. Não se trata de confundir os dois objetivos, e sim de reconhecer como se complementam."]],
["B1","Nazaré","A unidade na diversidade","Единство в разнообразии","bíblico","Apesar de + nome; nem todos + verbo plural expressa generalização parcial.","Apesar de + существительное; nem todos — не все.",[["unidade","единство"],["diversidade","разнообразие"],["diferença cultural","культурное различие"],["pertencimento","принадлежность"],["conviver","жить рядом, общаться"]],[["Apesar das diferenças culturais, podemos conviver com respeito.","Несмотря на культурные различия, мы можем уважительно общаться."],["Nem todos têm a mesma experiência ou opinião.","Не у всех одинаковый опыт или мнение."],["A unidade não exige que todas as pessoas sejam iguais.","Единство не требует, чтобы все люди были одинаковыми."]],{"example":0,"answer":"Apesar das"},["Объясни, как община может уважать различия.","Explique como uma comunidade pode respeitar diferenças.","Apesar das diferenças culturais, uma comunidade pode organizar atividades acessíveis a todos. É importante ouvir as necessidades de cada grupo. A unidade não depende de opiniões idênticas."]],
["B1","Cafarnaum","Aprender com um conselho","Учиться на совете","bíblico","Levar em conta + objeto; vale a pena + infinitivo.","Levar em conta — учитывать; vale a pena — стоит.",[["aprendizado","обучение, усвоение"],["experiência","опыт"],["sugestão","предложение"],["avaliar","оценивать"],["aplicável","применимый"]],[["Vale a pena avaliar se um conselho é aplicável à situação.","Стоит оценить, применим ли совет к ситуации."],["Leve em conta a experiência de quem oferece a sugestão.","Учитывай опыт человека, который даёт совет."],["O aprendizado inclui pensar antes de agir.","Обучение включает размышление перед действием."]],{"example":0,"answer":"Vale a pena"},["Объясни, как оценить совет, прежде чем ему следовать.","Explique como avaliar um conselho antes de segui-lo.","Vale a pena ouvir um conselho com atenção. Depois, devemos avaliar se ele se aplica à nossa situação. Podemos buscar outras informações antes de tomar uma decisão."]],
["B1","Jerusalém","Uma conversa de apoio","Разговор для поддержки","bíblico","Importar-se com + nome; colocar-se no lugar de alguém.","Importar-se com — заботиться о; colocar-se no lugar de — поставить себя на место.",[["empatia","эмпатия"],["acolher sentimentos","принимать чувства"],["escuta ativa","активное слушание"],["compreensivo","понимающий"],["disponibilizar","предоставлять"]],[["Importar-se com alguém inclui escutar com empatia.","Заботиться о ком-то — значит в том числе слушать с эмпатией."],["Podemos colocar-nos no lugar da outra pessoa sem presumir o que sente.","Мы можем поставить себя на место другого, не предполагая за него его чувства."],["Uma atitude compreensiva facilita a conversa.","Понимающее отношение облегчает разговор."]],{"example":0,"answer":"Importar-se com"},["Напиши короткий разговор поддержки двух персонажей.","Escreva um diálogo breve de apoio entre duas personagens.","Ana: Hoje estou preocupada com a apresentação. Rui: Quer conversar sobre o que aconteceu? Ana: Sim, gostaria de organizar minhas ideias. Rui: Podemos conversar e pensar em uma forma de praticar."]],
["B1","Betânia","Organizar um estudo bíblico","Организовать изучение Библии","bíblico","A menos que + subjuntivo expressa exceção.","A menos que + subjuntivo — если только не.",[["roteiro","план, сценарий"],["passagem","отрывок"],["leitura compartilhada","совместное чтение"],["discussão","обсуждение"],["tópico","пункт темы"]],[["Vamos seguir o roteiro, a menos que surja uma dúvida importante.","Будем следовать плану, если только не возникнет важный вопрос."],["A leitura compartilhada precede a discussão da passagem.","Совместное чтение предшествует обсуждению отрывка."],["Cada tópico pode ser explicado com exemplos simples.","Каждый пункт можно объяснить простыми примерами."]],{"example":0,"answer":"surja"},["Подготовь план вымышленного занятия по Библии.","Prepare um roteiro para um estudo bíblico fictício.","Primeiramente, vamos ler uma passagem e identificar o tema principal. Em seguida, cada participante poderá fazer uma pergunta. Por fim, o grupo poderá resumir o que compreendeu e registrar novas palavras."]],
["B1","Galileia","Explicar um termo antigo","Объяснять старинный термин","bíblico","Costumava + infinitivo indica hábito passado; hoje em dia contrasta uso atual.","Costumava + инфинитив — привычка в прошлом; hoje em dia — в настоящее время.",[["arcaísmo","архаизм"],["registro formal","официальный регистр"],["uso corrente","современное употребление"],["equivalência","соответствие"],["atualizar","осовременивать"]],[["O pronome vós costumava aparecer em mais contextos na história da língua.","Местоимение vós раньше встречалось в большем числе контекстов в истории языка."],["Hoje em dia, seu uso é sobretudo literário ou religioso no Brasil.","Сегодня в Бразилии оно употребляется преимущественно в литературном или религиозном стиле."],["Uma equivalência moderna ajuda a compreender o texto.","Современный эквивалент помогает понять текст."]],{"example":0,"answer":"costumava aparecer"},["Объясни различие между vós и vocês в современном бразильском португальском.","Explique a diferença entre vós e vocês no português brasileiro atual.","Vós aparece em textos antigos, literários e religiosos. Vocês é muito comum no português brasileiro atual. Para reconhecer a diferença, podemos comparar vós sois com vocês são."]],
["B1","Nazaré","Os pronomes na oração","Местоимения в молитве","bíblico","Tu és / tu tens no padrão; você é / você tem. Tu também tem uso regional.","Нормативно tu és / tu tens; você é / você tem. Tu также употребляется в регионах.",[["tratamento","форма обращения"],["variação regional","региональная вариативность"],["concordância","согласование"],["pronome","местоимение"],["linguagem religiosa","религиозная речь"]],[["Tu és e você é são formas de concordância diferentes.","Tu és и você é — разные формы согласования."],["O pronome tu também aparece na fala de regiões brasileiras.","Местоимение tu встречается и в речи некоторых регионов Бразилии."],["Na oração, o tratamento depende do registro adotado.","В молитве форма обращения зависит от выбранного стиля."]],{"example":0,"answer":"Tu és e você é"},["Сравни две формы обращения, не называя любое употребление tu устаревшим.","Compare duas formas de tratamento sem classificar todo uso de tu como antigo.","No padrão, tu exige formas como és e tens, enquanto você usa é e tem. O pronome tu também é empregado em várias regiões do Brasil. Na oração, a escolha depende da tradição e do registro."]],
["B1","Cafarnaum","O vocabulário de uma pregação","Лексика проповеди","bíblico","Ser capaz de + infinitivo; permitir que + subjuntivo.","Ser capaz de — быть способным; permitir que + subjuntivo — позволять, чтобы.",[["orador","оратор"],["ênfase verbal","словесное ударение"],["articulação","артикуляция"],["argumentação","аргументация"],["clarear","прояснять"]],[["Uma estrutura clara permite que o ouvinte acompanhe a argumentação.","Ясная структура позволяет слушателю следить за аргументацией."],["O orador pode usar pausas e exemplos para clarear a ideia.","Оратор может использовать паузы и примеры, чтобы прояснить мысль."],["É útil ser capaz de reconhecer a ênfase verbal.","Полезно уметь распознавать смысловое ударение."]],{"example":0,"answer":"acompanhe"},["Опиши ясную структуру небольшой учебной проповеди.","Descreva uma estrutura clara para uma pequena pregação didática.","Uma pequena mensagem pode começar com uma pergunta que apresente o tema. Depois, o orador desenvolve a ideia por meio de exemplos claros. A conclusão deve retomar o ponto principal sem acrescentar um assunto novo."]],
["B1","Jerusalém","Traduzir expressões idiomáticas","Переводить устойчивые выражения","bíblico","Nem sempre + verbo; em lugar de + infinitivo.","Nem sempre — не всегда; em lugar de — вместо.",[["expressão idiomática","устойчивое выражение"],["tradução literal","буквальный перевод"],["naturalidade","естественность"],["equivalente idiomático","идиоматический эквивалент"],["adequação","уместность"]],[["Uma tradução literal nem sempre conserva o sentido da expressão.","Буквальный перевод не всегда сохраняет смысл выражения."],["Em lugar de traduzir palavra por palavra, procure um equivalente idiomático.","Вместо пословного перевода ищи устойчивый эквивалент."],["A naturalidade depende da adequação ao contexto.","Естественность зависит от уместности в контексте."]],{"example":0,"answer":"nem sempre"},["Объясни, как перевести dar uma mão без буквального перевода.","Explique como traduzir dar uma mão sem usar uma tradução literal.","A expressão dar uma mão costuma significar oferecer ajuda. Uma tradução literal poderia não transmitir essa intenção. Por isso, em russo, podemos usar um equivalente com o sentido de ajudar."]],
["B1","Betânia","Ligar as ideias","Связывать мысли","bíblico","Por isso indica consequência; portanto introduz conclusão; contudo indica contraste.","Por isso — поэтому; portanto — следовательно; contudo — однако.",[["conector","связующее слово"],["raciocínio","ход мысли"],["encadeamento","связь мыслей"],["contradição","противоречие"],["desfecho","итог"]],[["A mensagem apresenta uma dificuldade; portanto, precisamos considerar uma solução.","Послание представляет трудность; следовательно, нужно рассмотреть решение."],["Os conectores ajudam a organizar o raciocínio.","Связующие слова помогают организовать ход мысли."],["Contudo, uma conclusão não deve contradizer os fatos apresentados.","Однако заключение не должно противоречить приведённым фактам."]],{"example":0,"answer":"portanto"},["Напиши абзац с portanto и contudo о важности слушания.","Escreva um parágrafo com portanto e contudo sobre a importância de ouvir.","Ouvir com atenção permite compreender o ponto de vista da outra pessoa. Portanto, é importante evitar interrupções desnecessárias. Contudo, podemos fazer perguntas respeitosas quando algo não estiver claro."]],
