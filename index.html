["B1","Galileia","Interpretar um diálogo","Переводить диалог","bíblico","Disse que / perguntou se; pronomes e referências temporais mudam conforme o contexto.","Disse que / perguntou se; местоимения и указатели времени меняются по контексту.",[["intervenção","реплика"],["turno de fala","очередь речи"],["reformular","переформулировать"],["interlocução","общение собеседников"],["referente","референт"]],[["A visitante perguntou se a reunião começaria em breve.","Посетительница спросила, скоро ли начнётся собрание."],["O responsável disse que faltavam alguns minutos.","Ответственный сказал, что оставалось несколько минут."],["O intérprete precisa respeitar cada turno de fala.","Устному переводчику нужно учитывать очередность реплик."]],{"example":0,"answer":"começaria"},["Преобразуй в косвенную речь: Ana: «O encontro começa às seis?» Rui: «O horário mudou.» Ana: «Vou confirmar a informação.»","Passe para o discurso indireto: Ana: «O encontro começa às seis?» Rui: «O horário mudou.» Ana: «Vou confirmar a informação.»","Ana perguntou se o encontro começaria às seis. Rui respondeu que o horário havia mudado. Ela disse que confirmaria a nova informação com a equipe."]],
["B1","Nazaré","Preparar perguntas de compreensão","Готовить вопросы на понимание","bíblico","Por que em pergunta; porque em resposta; o porquê como substantivo.","Por que — почему в вопросе; porque — потому что; o porquê — причина.",[["justificativa","обоснование"],["motivação","мотивация"],["causa","причина"],["pergunta aberta","открытый вопрос"],["resposta fundamentada","обоснованный ответ"]],[["Por que a personagem mudou de atitude?","Почему персонаж изменил поведение?"],["Talvez tenha mudado porque recebeu uma orientação.","Возможно, он изменился, потому что получил совет."],["Uma resposta fundamentada explica o porquê da mudança.","Обоснованный ответ объясняет причину изменения."]],{"example":0,"answer":"Por que"},["Придумай короткую ситуацию, составь три открытых вопроса к ней и ответь на один.","Imagine uma situação curta, crie três perguntas abertas e responda a uma.","Uma personagem mudou o plano depois de receber uma nova informação. Por que ela mudou de plano? Como as outras pessoas reagiram? Quais foram as consequências? Ela mudou o plano porque recebeu uma informação nova."]],
["B1","Cafarnaum","O fruto das atitudes","Плоды поступков","bíblico","Acabar por + infinitivo pode indicar resultado; contribuir para + infinitivo.","Acabar por + инфинитив — в итоге сделать; contribuir para — способствовать.",[["atitude","поступок, отношение"],["conduta","поведение"],["hábito","привычка"],["efeito","эффект"],["cultivar","развивать"]],[["Pequenas atitudes contribuem para cultivar bons hábitos.","Небольшие поступки помогают развивать хорошие привычки."],["Uma conduta respeitosa pode melhorar a convivência.","Уважительное поведение может улучшить общение."],["Com o tempo, a prática acaba por produzir efeitos perceptíveis.","Со временем практика в итоге даёт заметные результаты."]],{"example":0,"answer":"contribuem para"},["Объясни, как небольшие привычки влияют на отношения.","Explique como pequenos hábitos influenciam a convivência.","Pequenos hábitos, como cumprimentar e ouvir, favorecem a convivência. Quando praticamos essas atitudes regularmente, a comunicação pode melhorar. Ao longo do tempo, isso contribui para relações mais respeitosas."]],
["B1","Jerusalém","A mensagem e o destinatário","Послание и адресат","bíblico","Destinar-se a + pessoa/grupo; adaptar algo a + contexto.","Destinar-se a — предназначаться для; adaptar algo a — адаптировать к.",[["destinatário","адресат"],["público","аудитория"],["adequado","подходящий"],["formalidade","формальность"],["acessível","понятный, доступный"]],[["A mensagem destina-se a um público com experiências diferentes.","Послание предназначено для аудитории с разным опытом."],["A formalidade da fala pode ser adaptada ao contexto.","Степень формальности речи можно адаптировать к контексту."],["É importante usar um vocabulário acessível sem perder a precisão.","Важно использовать понятную лексику, не теряя точности."]],{"example":0,"answer":"destina-se a"},["Адаптируй одну мысль для двух вымышленных аудиторий.","Adapte a mesma ideia para dois públicos fictícios.","Para crianças, eu diria: compartilhem os materiais e escutem os colegas. Para adultos, explicaria que a cooperação exige divisão de tarefas e respeito às responsabilidades. A ideia central é a mesma, mas a linguagem muda."]],
["B1","Betânia","Revisar uma mensagem","Редактировать послание","bíblico","Ao invés de para oposição; em vez de para substituição geral. Revisar antes de publicar.","Ao invés de — при противопоставлении; em vez de — вместо в общем смысле. Проверка перед публикацией.",[["rascunho","черновик"],["reformulação","переформулировка"],["precisão","точность"],["ambiguidade","двусмысленность"],["versão final","окончательная версия"]],[["Em vez de repetir uma ideia, podemos reformulá-la com precisão.","Вместо повторения мысли мы можем точно её переформулировать."],["Revise o rascunho para eliminar ambiguidades.","Проверь черновик, чтобы устранить двусмысленности."],["Leia a versão final em voz alta antes de compartilhá-la.","Прочитай окончательный вариант вслух перед тем, как поделиться им."]],{"example":0,"answer":"Em vez de"},["Опиши, как отредактировать учебное послание перед публикацией.","Descreva como revisar uma mensagem didática antes de compartilhá-la.","Primeiro, reviso o rascunho para verificar a clareza da ideia principal. Depois, procuro eliminar repetições e ambiguidades. Antes de compartilhar, leio a versão final e confiro os fatos."]],
["B1","Jericó","Planejar os estudos","Планировать учёбу","Brasil","Pretender + infinitivo; assim que + futuro do subjuntivo.","Pretender + инфинитив — намереваться; assim que + futuro do subjuntivo для будущего.",[["cronograma","график"],["prazo","срок"],["meta","цель"],["rendimento","успеваемость"],["reorganizar","реорганизовывать"]],[["Assim que terminar a tarefa, vou reorganizar meu cronograma.","Как только закончу задание, перестрою свой график."],["Pretendo estabelecer metas realistas para cada semana.","Я намерена поставить реалистичные цели на каждую неделю."],["O rendimento depende também de pausas e descanso.","Успеваемость зависит также от перерывов и отдыха."]],{"example":0,"answer":"terminar"},["Напиши реалистичный учебный план на вымышленную неделю.","Escreva um plano de estudo realista para uma semana fictícia.","Nesta semana fictícia, vou estudar português em quatro tardes. Reservarei um tempo curto para revisar palavras e escrever frases. Assim que terminar as tarefas, farei uma pausa e reorganizarei o plano se necessário."]],
["B1","Galileia","Aprender com os erros","Учиться на ошибках","Brasil","Voltar a + infinitivo indica repetição; em vez de + infinitivo.","Voltar a + инфинитив — снова сделать; em vez de — вместо.",[["correção","исправление"],["tentativa","попытка"],["equívoco gramatical","грамматическая ошибка"],["progresso","прогресс"],["estratégia","стратегия"]],[["Depois da correção, voltei a resolver o exercício.","После исправления я снова решила упражнение."],["Em vez de decorar a resposta, procurei entender a regra.","Вместо заучивания ответа я старалась понять правило."],["Mudar a estratégia pode favorecer o progresso.","Изменение стратегии может помочь прогрессу."]],{"example":0,"answer":"voltei a resolver"},["Опиши, как вымышленная ученица исправляет ошибку в португальском.","Descreva como uma estudante fictícia corrige um erro de português.","Uma estudante escreveu uma frase com a forma verbal errada. Depois de ler a explicação, voltou a escrever a frase. Em vez de memorizar apenas a correção, ela criou outro exemplo com a mesma regra."]],
["B1","Nazaré","Apresentar um trabalho","Представлять учебный проект","Brasil","Primeiramente, em seguida, por fim organizam uma exposição.","Primeiramente — прежде всего; em seguida — затем; por fim — наконец.",[["apresentação","презентация"],["pesquisa","исследование"],["dado","данные, факт"],["exemplificar","иллюстрировать примером"],["sintetizar","обобщать"]],[["Primeiramente, vou apresentar o objetivo da pesquisa.","Прежде всего я представлю цель исследования."],["Em seguida, vou exemplificar os resultados com alguns dados.","Затем я проиллюстрирую результаты несколькими фактами."],["Por fim, pretendo sintetizar as principais conclusões.","Наконец, я намерена обобщить основные выводы."]],{"example":0,"answer":"Primeiramente"},["Подготовь краткую презентацию вымышленного школьного проекта.","Prepare uma apresentação breve de um projeto escolar imaginário.","Primeiramente, apresentaremos um projeto sobre reciclagem na escola. Em seguida, mostraremos como organizar os materiais coletados. Por fim, explicaremos os resultados que esperamos alcançar."]],
["B1","Betânia","Pedir ajuda na escola","Просить помощи в школе","Brasil","Não consegui + infinitivo; seria possível + infinitivo em pedidos.","Não consegui — не удалось; seria possível — можно ли, вежливая просьба.",[["matéria","учебный предмет"],["enunciado","условие задания"],["explicação","объяснение"],["raciocínio lógico","логическое рассуждение"],["esclarecer uma dúvida","разъяснить вопрос"]],[["Seria possível explicar o enunciado de outra maneira?","Можно ли объяснить условие по-другому?"],["Não consegui acompanhar o raciocínio da última explicação.","Мне не удалось проследить ход последнего объяснения."],["Quero esclarecer uma dúvida antes de continuar.","Я хочу прояснить вопрос, прежде чем продолжать."]],{"example":0,"answer":"Seria possível"},["Напиши просьбу о помощи учителю по вымышленной учебной теме.","Escreva um pedido de ajuda a um professor sobre uma matéria fictícia.","Professor, não consegui compreender o enunciado da atividade de geometria. Seria possível explicar o primeiro passo com outro exemplo? Gostaria de esclarecer essa dúvida antes de continuar."]],
["B1","Jericó","Escolher uma profissão","Выбирать профессию","Brasil","Se eu pudesse + condicional; levar em consideração.","Se eu pudesse… escolheria — если бы могла… выбрала бы; levar em consideração — учитывать.",[["carreira","карьера"],["habilidade","навык"],["formação","образование, подготовка"],["aptidão","способность"],["mercado de trabalho","рынок труда"]],[["Se eu pudesse escolher agora, pesquisaria diferentes carreiras.","Если бы я могла выбрать сейчас, я бы изучила разные профессии."],["A formação deve desenvolver habilidades úteis.","Образование должно развивать полезные навыки."],["É importante levar em consideração os próprios interesses.","Важно учитывать собственные интересы."]],{"example":0,"answer":"pesquisaria"},["Сравни две профессии и объясни свои предпочтения.","Compare duas profissões imaginárias e explique suas preferências.","Uma carreira em tradução exige habilidades linguísticas e atenção ao contexto. Já a direção de cinema envolve criatividade e organização de equipes. Se pudesse escolher agora, pesquisaria as duas formações antes de decidir."]],
["B1","Galileia","Conhecer uma cidade","Знакомиться с городом","Brasil","Onde retoma lugar; aonde indica destino com verbos que exigem a.","Onde — где; aonde — куда с глаголом, требующим a.",[["bairro","район"],["trajeto","маршрут"],["ponto turístico","достопримечательность"],["deslocamento","передвижение"],["localização","расположение"]],[["Este é o bairro onde fica o museu.","Это район, где находится музей."],["Aonde você pretende ir depois da visita?","Куда ты намереваешься отправиться после посещения?"],["Planeje o trajeto antes do deslocamento.","Спланируй маршрут перед поездкой."]],{"example":0,"answer":"onde"},["Опиши вымышленную прогулку по городу.","Descreva um passeio fictício por uma cidade.","Começaremos o passeio em um bairro onde há um museu. Depois, vamos conhecer uma praça e caminhar por uma rua histórica. Antes de voltar, escolheremos um lugar tranquilo para descansar."]],
["B1","Nazaré","Reservar uma hospedagem","Бронировать жильё","Brasil","Gostaria de confirmar se + indicativo; estar incluído em.","Gostaria de confirmar se — хотела бы уточнить, включено ли; estar incluído em — быть включённым в.",[["hospedagem","проживание"],["reserva","бронирование"],["diária","суточная стоимость"],["cancelamento","отмена"],["comodidade","удобство"]],[["Gostaria de confirmar se o café da manhã está incluído na diária.","Я хотела бы уточнить, включён ли завтрак в суточную стоимость."],["Verifique as condições de cancelamento da reserva.","Проверь условия отмены бронирования."],["Compare as comodidades oferecidas pela hospedagem.","Сравни удобства, предлагаемые жильём."]],{"example":0,"answer":"está incluído"},["Напиши вымышленное сообщение с вопросами о проживании.","Escreva uma mensagem fictícia perguntando sobre uma hospedagem.","Boa tarde! Gostaria de saber se o café da manhã está incluído na diária. Poderiam informar também quais são as condições de cancelamento? Agradeço pelas informações sobre a reserva."]],
["B1","Betânia","Resolver um atraso","Решать проблему задержки","Brasil","Devido a + nome; por causa de + nome; avisar que + indicativo.","Devido a и por causa de — из-за; avisar que — сообщать, что.",[["atraso","опоздание, задержка"],["congestionamento","пробка"],["previsão","прогноз"],["itinerário","маршрут"],["reagendar","переносить запись"]],[["Devido ao congestionamento, o ônibus está atrasado.","Из-за пробки автобус задерживается."],["A previsão de chegada mudou e precisamos reagendar a visita.","Ожидаемое время прибытия изменилось, и нужно перенести визит."],["Vou avisar que chegarei mais tarde.","Сообщу, что прибуду позже."]],{"example":0,"answer":"Devido ao"},["Напиши вежливое сообщение о вымышленной задержке.","Escreva um aviso educado sobre um atraso fictício.","Boa tarde! Devido a um atraso no transporte, chegarei depois do horário combinado. Gostaria de saber se podemos reagendar a visita. Peço desculpas pelo transtorno."]],
["B1","Jericó","Comparar produtos","Сравнивать товары","Brasil","Mais... do que / menos... do que; tão... quanto.","Mais… do que — более… чем; menos… do que — менее… чем; tão… quanto — такой же… как.",[["durabilidade","долговечность"],["custo-benefício","соотношение цены и качества"],["garantia","гарантия"],["característica","характеристика"],["desempenho","производительность"]],[["Este produto tem melhor custo-benefício do que o outro.","У этого товара лучшее соотношение цены и качества, чем у другого."],["A garantia é tão importante quanto a durabilidade.","Гарантия так же важна, как долговечность."],["Compare as características e o desempenho antes de escolher.","Сравни характеристики и производительность перед выбором."]],{"example":0,"answer":"do que"},["Сравни два вымышленных товара без реальных брендов и цен.","Compare dois produtos fictícios sem citar marcas ou preços reais.","O produto A parece ter melhor durabilidade do que o produto B. Por outro lado, o produto B oferece uma garantia mais longa. Eu compararia as duas características antes de decidir."]],
["B1","Galileia","Trocar um produto","Обменивать товар","Brasil","Precisaria de + nome; gostaria que + imperfeito do subjuntivo.","Precisaria de — понадобилось бы; gostaria que + imperfeito do subjuntivo — вежливое пожелание.",[["defeito","дефект"],["comprovante","подтверждающий документ"],["troca","обмен"],["reembolso","возврат денег"],["atendimento","обслуживание"]],[["Gostaria que vocês verificassem o defeito do produto.","Я хотела бы, чтобы вы проверили дефект товара."],["Tenho o comprovante da compra e gostaria de solicitar uma troca.","У меня есть подтверждение покупки, и я хотела бы попросить обмен."],["Poderiam explicar as condições de reembolso?","Не могли бы вы объяснить условия возврата денег?"]],{"example":0,"answer":"verificassem"},["Напиши вымышленную просьбу об обмене товара.","Escreva uma solicitação fictícia de troca de um produto.","Olá! Comprei um produto que apresentou um defeito. Tenho o comprovante da compra e gostaria que vocês verificassem o problema. Poderiam informar como solicitar a troca?"]],
["B1","Nazaré","Administrar despesas","Управлять расходами","Brasil","Em vez de + infinitivo; reservar algo para + finalidade.","Em vez de — вместо; reservar algo para — откладывать что-либо на цель.",[["orçamento","бюджет"],["despesa","расход"],["economia","экономия"],["priorizar","ставить в приоритет"],["imprevistos financeiros","непредвиденные расходы"]],[["Em vez de comprar tudo de uma vez, posso priorizar o necessário.","Вместо покупки всего сразу я могу выделить самое необходимое."],["O orçamento deve considerar possíveis imprevistos financeiros.","Бюджет должен учитывать возможные непредвиденные расходы."],["Uma pequena economia pode ajudar a realizar uma meta.","Небольшая экономия может помочь осуществить цель."]],{"example":0,"answer":"Em vez de"},["Составь вымышленный бюджет на школьные принадлежности.","Organize um orçamento fictício para material escolar.","Em um orçamento fictício de cem unidades, reservaria sessenta para material necessário. Usaria vinte para itens complementares e guardaria vinte para imprevistos. Em vez de comprar tudo de uma vez, compararia as opções."]],
["B1","Betânia","Consertar um aparelho","Чинить устройство","Brasil","Deixar de + infinitivo indica interrupção; mandar + infinitivo pode indicar serviço solicitado.","Deixar de — перестать; mandar + инфинитив может обозначать заказ услуги.",[["aparelho","устройство"],["funcionamento","работа устройства"],["manutenção","обслуживание"],["assistência técnica","сервисный центр"],["diagnóstico técnico","техническая диагностика"]],[["O aparelho deixou de funcionar depois da atualização.","Устройство перестало работать после обновления."],["Vou procurar uma assistência técnica para obter um diagnóstico.","Я обращусь в сервисный центр за диагностикой."],["Antes de mandar consertar, quero conhecer as condições do serviço.","Прежде чем отдать в ремонт, я хочу узнать условия обслуживания."]],{"example":0,"answer":"deixou de funcionar"},["Опиши вымышленную проблему с устройством и попроси техническую консультацию.","Descreva um problema fictício com um aparelho e peça orientação técnica.","Meu aparelho deixou de funcionar depois de uma atualização. Gostaria de saber se a assistência técnica pode realizar um diagnóstico. Antes do conserto, poderiam informar as condições do serviço?"]],
["B1","Jericó","Organizar arquivos digitais","Организовывать цифровые файлы","Brasil","Para evitar que + subjuntivo; fazer uma cópia de.","Para evitar que + subjuntivo — чтобы избежать; fazer uma cópia de — создать копию.",[["arquivo","файл"],["pasta","папка"],["cópia de segurança","резервная копия"],["armazenamento","хранение"],["recuperar","восстанавливать"]],[["Faça uma cópia de segurança para evitar que os arquivos se percam.","Создай резервную копию, чтобы файлы не потерялись."],["Organize as pastas de acordo com o assunto.","Организуй папки по теме."],["Verifique se é possível recuperar o conteúdo armazenado.","Проверь, можно ли восстановить сохранённое содержимое."]],{"example":0,"answer":"se percam"},["Объясни, как организовать и защитить файлы вымышленного проекта.","Explique como organizar e proteger arquivos de um projeto fictício.","Primeiro, vou criar pastas para cada etapa do projeto. Em seguida, farei uma cópia de segurança dos arquivos importantes. Assim, poderei recuperar o conteúdo se ocorrer algum problema."]],
["B1","Galileia","Conversar por mensagem","Общаться в переписке","Brasil","Assim que puder + futuro do subjuntivo; dar retorno.","Assim que puder — как только смогу; dar retorno — ответить, дать обратную связь.",[["mensagem de texto","текстовое сообщение"],["disponível","свободный, доступный"],["notificação","уведомление"],["responder","отвечать"],["combinar","договариваться"]],[["Assim que puder, vou responder à sua mensagem.","Как только смогу, отвечу на твоё сообщение."],["Ainda não estou disponível para conversar.","Я пока не могу поговорить."],["Podemos combinar outro horário com tranquilidade.","Можем спокойно договориться о другом времени."]],{"example":0,"answer":"puder"},["Напиши вежливый ответ на вымышленное сообщение.","Escreva uma resposta educada a uma mensagem fictícia.","Obrigada pela mensagem! Neste momento, não estou disponível para conversar. Assim que puder, responderei com mais calma. Podemos combinar outro horário."]],
["B1","Nazaré","Marcar um compromisso","Назначать встречу","Brasil","Ficar de + infinitivo indica acordo; combinar de + infinitivo é corrente no Brasil.","Ficar de + инфинитив — договориться сделать; combinar de — распространённая форма договорённости.",[["compromisso marcado","назначенная встреча"],["agenda","расписание"],["encaixe","свободное окно"],["confirmado","подтверждённый"],["remarcar","переназначать"]],[["Ficamos de confirmar o compromisso amanhã.","Мы договорились подтвердить встречу завтра."],["Preciso verificar se há um horário disponível na agenda.","Мне нужно проверить, есть ли свободное время в расписании."],["Se houver necessidade, podemos remarcar a conversa.","При необходимости можем перенести разговор."]],{"example":0,"answer":"Ficamos de"},["Договорись письменно о вымышленной встрече школьной группы.","Combine por escrito uma reunião fictícia de um grupo escolar.","Olá, pessoal! Podemos marcar a reunião do grupo para amanhã à tarde? Ficamos de confirmar se todos terão disponibilidade. Se houver algum conflito de horário, podemos remarcar."]],
["B1","Betânia","Dar uma opinião sobre um filme","Высказывать мнение о фильме","Brasil","Considerar + objeto + adjetivo; na minha opinião.","Considerar + дополнение + прилагательное — считать что-либо каким-либо; na minha opinião — по моему мнению.",[["enredo","сюжет"],["personagem","персонаж"],["atuação","актёрская игра"],["desenvolvimento","развитие"],["convincente","убедительный"]],[["Considero o desenvolvimento da personagem bastante convincente.","Я считаю развитие персонажа довольно убедительным."],["Na minha opinião, o enredo tem um ritmo equilibrado.","По моему мнению, сюжет развивается в сбалансированном темпе."],["A atuação ajuda a transmitir os conflitos da história.","Актёрская игра помогает передать конфликты истории."]],{"example":0,"answer":"Considero"},["Напиши короткую рецензию на вымышленный фильм.","Escreva uma crítica breve de um filme imaginário.","O filme imaginário apresenta uma personagem que precisa resolver um problema em sua comunidade. Considero o desenvolvimento da história convincente, embora algumas cenas sejam lentas. A atuação torna a conclusão emocionante."]],
["B1","Jericó","Contar uma história","Рассказывать историю","Brasil","De repente introduz mudança; mal + perfeito indica sequência imediata.","De repente — внезапно; mal + perfeito — едва успело произойти.",[["suspense","напряжённое ожидание"],["reviravolta","поворот сюжета"],["narrador","рассказчик"],["inesperado","неожиданный"],["desenvolver","развивать"]],[["Mal a personagem chegou, aconteceu algo inesperado.","Едва персонаж прибыл, произошло нечто неожиданное."],["O narrador cria suspense antes da reviravolta.","Рассказчик создаёт напряжение перед поворотом сюжета."],["A história se desenvolve a partir dessa mudança.","История развивается после этого изменения."]],{"example":0,"answer":"Mal"},["Придумай короткую историю с неожиданным ненасильственным поворотом.","Crie uma história curta com uma reviravolta não violenta.","Uma estudante encontrou um envelope sem nome na biblioteca. Mal abriu o envelope, descobriu que continha um mapa de uma exposição escolar. No final, percebeu que fazia parte de uma atividade surpresa de sua turma."]],
["B1","Galileia","Visitar uma exposição","Посещать выставку","Brasil","O qual / a qual concorda com o antecedente; por meio de indica meio.","O qual / a qual согласуется с предыдущим существительным; por meio de — посредством.",[["exposição artística","художественная выставка"],["obra de arte","произведение искусства"],["acervo","коллекция"],["expressividade","выразительность"],["curadoria","кураторская работа"]],[["A exposição, na qual vimos várias obras, foi interessante.","Выставка, на которой мы увидели несколько произведений, была интересной."],["O acervo apresenta diferentes formas de expressividade.","Коллекция представляет различные формы выразительности."],["A curadoria organiza as obras por meio de temas.","Кураторская работа организует произведения по темам."]],{"example":0,"answer":"na qual"},["Опиши вымышленную выставку и то, что привлекло внимание.","Descreva uma exposição imaginária e o que chamou sua atenção.","Visitei uma exposição imaginária sobre paisagens urbanas. A obra que mais chamou minha atenção combinava fotografias e desenhos. A curadoria organizava as imagens de modo que pudéssemos comparar diferentes pontos de vista."]],
["B1","Nazaré","Falar de cultura","Говорить о культуре","Brasil","Não necessariamente indica restrição; em geral evita generalização absoluta.","Não necessariamente — не обязательно; em geral — в целом, избегает абсолютного обобщения.",[["tradição","традиция"],["patrimônio","наследие"],["manifestação cultural","культурное явление"],["variedade","разнообразие"],["identidade cultural","культурная идентичность"]],[["Uma tradição não representa necessariamente todos os membros de uma cultura.","Традиция не обязательно представляет всех членов культуры."],["O patrimônio inclui manifestações culturais variadas.","Наследие включает разнообразные культурные явления."],["Em geral, a identidade cultural se desenvolve ao longo do tempo.","В целом культурная идентичность развивается со временем."]],{"example":0,"answer":"necessariamente"},["Сравни две традиции, не обобщая обо всех людях.","Compare duas tradições sem generalizar sobre todas as pessoas.","Uma tradição pode envolver músicas em uma festa familiar, enquanto outra valoriza histórias contadas em grupo. Ambas podem transmitir memórias culturais. No entanto, nem todas as pessoas de uma comunidade praticam as mesmas tradições."]],
["B1","Betânia","Expressar preferências","Выражать предпочтения","Brasil","Preferir X a Y na norma-padrão; optar por + nome.","Нормативно preferir X a Y — предпочитать X чему-то Y; optar por — выбирать.",[["preferência","предпочтение"],["opção","вариант"],["lazer","досуг"],["alternativa cultural","культурная альтернатива"],["interesse","интерес"]],[["Prefiro atividades tranquilas a programas muito barulhentos.","Я предпочитаю спокойные занятия слишком шумным программам."],["Podemos optar por uma alternativa cultural neste fim de semana.","Можем выбрать культурное мероприятие на этих выходных."],["Cada pessoa tem interesses e preferências diferentes.","У каждого свои интересы и предпочтения."]],{"example":0,"answer":"Prefiro"},["Сравни два занятия для досуга и обоснуй выбор.","Compare duas atividades de lazer e justifique sua escolha.","Prefiro visitar uma exposição a passar a tarde em um lugar muito barulhento. Uma exposição permite observar as obras com calma. Entretanto, atividades ao ar livre também podem ser interessantes quando queremos conversar com amigos."]],
["B1","Jericó","Discutir uma notícia","Обсуждать новость","Brasil","De acordo com + fonte; teria + particípio pode indicar informação não confirmada.","De acordo com — согласно источнику; teria + причастие может выражать неподтверждённую информацию.",[["manchete","заголовок"],["reportagem","репортаж"],["verificação","проверка"],["fato","факт"],["informação confiável","достоверная информация"]],[["De acordo com a reportagem, o evento teria sido adiado.","Согласно репортажу, мероприятие, предположительно, было перенесено."],["A manchete não substitui a verificação dos fatos.","Заголовок не заменяет проверку фактов."],["Procure uma fonte de informação confiável antes de compartilhar.","Найди достоверный источник информации перед тем, как делиться."]],{"example":0,"answer":"teria sido adiado"},["Напиши вымышленную новость, отличая факты от предположений.","Escreva uma notícia fictícia distinguindo fatos de hipóteses.","A escola fictícia confirmou que sua feira será realizada na próxima semana. Segundo uma reportagem imaginária, a programação teria sido ampliada, mas essa informação ainda não foi confirmada. É necessário consultar o comunicado oficial antes de divulgar os detalhes."]],
["B1","Galileia","Explicar uma regra","Объяснять правило","Brasil","É permitido / é proibido + infinitivo; desde que + subjuntivo.","É permitido — разрешается; é proibido — запрещается; desde que — при условии.",[["regulamento","правила, положение"],["permissão","разрешение"],["restrição","ограничение"],["exceção","исключение"],["cumprimento de regras","соблюдение правил"]],[["É permitido usar a sala desde que todos respeitem o regulamento.","Пользоваться залом разрешено при условии, что все соблюдают правила."],["O responsável pode explicar as restrições e exceções.","Ответственный может объяснить ограничения и исключения."],["O cumprimento das regras facilita a organização.","Соблюдение правил облегчает организацию."]],{"example":0,"answer":"respeitem"},["Напиши три ясных правила для вымышленной библиотеки.","Escreva três regras claras para uma biblioteca fictícia.","É permitido consultar os livros desde que sejam devolvidos ao lugar indicado. Não é permitido falar alto na sala de leitura. Quem precisar de ajuda poderá procurar o responsável pela biblioteca."]],
["B1","Nazaré","Cuidar do bem-estar","Заботиться о самочувствии","Brasil","Convém + infinitivo; é importante que + subjuntivo.","Convém — стоит; é importante que + subjuntivo.",[["bem-estar","благополучие, самочувствие"],["descanso","отдых"],["rotina equilibrada","сбалансированный распорядок"],["sobrecarga","перегрузка"],["pausa regular","регулярный перерыв"]],[["É importante que a rotina inclua momentos de descanso.","Важно, чтобы распорядок включал время для отдыха."],["Convém fazer pausas regulares durante os estudos.","Стоит делать регулярные перерывы во время учёбы."],["Uma rotina equilibrada ajuda a evitar sobrecarga.","Сбалансированный распорядок помогает избегать перегрузки."]],{"example":0,"answer":"inclua"},["Опиши вымышленный распорядок с отдыхом и учёбой.","Descreva uma rotina fictícia que inclua descanso e estudo.","Uma estudante fictícia dedica parte da tarde às tarefas escolares. É importante que ela inclua pausas e momentos de lazer. Ao terminar, organiza os materiais do dia seguinte e reserva tempo para descansar."]],
["B1","Betânia","Descrever o ambiente","Описывать окружающую среду","Brasil","Há + singular impessoal; existem + plural.","Há — безличная форма в единственном числе; existem — множественное число.",[["meio ambiente","окружающая среда"],["resíduo","отход"],["reciclagem","переработка"],["conservação","сохранение"],["consumo responsável","ответственное потребление"]],[["Há várias maneiras de reduzir a quantidade de resíduos.","Есть разные способы сократить количество отходов."],["Existem projetos de reciclagem e conservação ambiental.","Существуют проекты переработки и сохранения окружающей среды."],["O consumo responsável começa com escolhas cotidianas.","Ответственное потребление начинается с повседневного выбора."]],{"example":0,"answer":"Há"},["Предложи три простых экологических действия для вымышленной школы.","Proponha três ações ambientais simples para uma escola fictícia.","A escola pode colocar recipientes separados para papel e outros materiais recicláveis. Também pode reduzir o desperdício de folhas e organizar atividades de conscientização. Essas ações favorecem o consumo responsável."]],
["B1","Jericó","Explicar um processo","Объяснять процесс","Brasil","Primeiro, depois, finalmente; voz passiva para etapas do processo.","Primeiro, depois, finalmente — сначала, затем, наконец; пассив для описания этапов.",[["etapa","этап"],["material","материал"],["montagem","сборка"],["verificação final","окончательная проверка"],["proceder","приступать"]],[["Primeiro, os materiais são separados por tipo.","Сначала материалы сортируются по типу."],["Depois, procede-se à montagem do modelo.","Затем приступают к сборке модели."],["Finalmente, fazemos uma verificação antes da apresentação.","Наконец проводим проверку перед презентацией."]],{"example":0,"answer":"são separados"},["Объясни процесс сборки бумажного макета.","Explique o processo de montar uma maquete de papel.","Primeiro, os materiais de papel são separados e as peças são desenhadas. Depois, recortamos e dobramos as formas para montar o modelo. Finalmente, verificamos se as partes estão firmes e organizadas."]],
["B1","Galileia","Chegar a um acordo","Достигать соглашения","Brasil","Que tal + infinitivo?; desde que + subjuntivo para condições.","Que tal + инфинитив — как насчёт; desde que + subjuntivo — при условии.",[["consenso","консенсус"],["contraproposta","встречное предложение"],["flexibilidade","гибкость"],["negociação","переговоры"],["solução conjunta","совместное решение"]],[["Que tal buscar uma solução conjunta para o problema?","Как насчёт поиска совместного решения проблемы?"],["Aceito a contraproposta, desde que todos concordem.","Принимаю встречное предложение при условии, что все согласны."],["A flexibilidade facilita a negociação e o consenso.","Гибкость облегчает переговоры и достижение согласия."]],{"example":0,"answer":"Que tal"},["Создай вымышленный диалог, где два человека приходят к согласию.","Crie um diálogo fictício em que duas pessoas chegam a um acordo.","Ana: Que tal apresentar o projeto na sexta-feira? Rui: Prefiro quinta, porque terei outro compromisso na sexta. Ana: Aceito quinta, desde que todos possam participar. Rui: Então vamos confirmar com o grupo."]],
["B1","Nazaré","Planejar um projeto futuro","Планировать будущий проект","Brasil","Quando + futuro do subjuntivo; teremos de + infinitivo.","Quando + futuro do subjuntivo; teremos de — нам придётся.",[["recurso","ресурс"],["viabilidade","осуществимость"],["estimativa","оценка"],["execução","реализация"],["ajuste","корректировка"]],[["Quando tivermos os recursos necessários, iniciaremos a execução.","Когда у нас будут необходимые ресурсы, начнём реализацию."],["A estimativa inicial pode precisar de ajustes.","Первоначальная оценка может потребовать корректировок."],["Teremos de avaliar a viabilidade de cada etapa.","Нам предстоит оценить осуществимость каждого этапа."]],{"example":0,"answer":"tivermos"},["Спланируй вымышленный творческий проект в три этапа.","Planeje um projeto criativo fictício em três etapas.","Quando tivermos os materiais, começaremos a planejar uma pequena exposição. Na segunda etapa, cada grupo produzirá uma obra. Por fim, avaliaremos o espaço e faremos os ajustes necessários."]],
["B1","Betânia","Revisão integrada de B1","Итоговая практика B1","Brasil","Conectores de causa, condição e concessão; escolha do modo conforme a relação.","Связки причины, условия и уступки; выбор наклонения зависит от смысловой связи.",[["síntese","обобщение"],["argumento principal","главный аргумент"],["condição","условие"],["concessão","уступка"],["autoavaliação","самооценка"]],[["Embora ainda haja dificuldades, consigo explicar minhas ideias com mais clareza.","Хотя ещё есть трудности, я могу яснее объяснять свои мысли."],["Se eu tiver dúvidas, procurarei exemplos e explicações.","Если у меня возникнут вопросы, я буду искать примеры и объяснения."],["Uma autoavaliação ajuda a identificar o que preciso praticar.","Самооценка помогает выявить, что мне нужно тренировать."]],{"example":0,"answer":"haja"},["Напиши итоговое размышление об учёбе с embora, se и porque.","Escreva uma síntese de aprendizagem usando embora, se e porque.","Embora ainda haja dificuldades, consigo organizar melhor minhas ideias. Se eu tiver dúvidas, vou reler as explicações e criar novos exemplos. Quero continuar praticando porque a regularidade favorece meu aprendizado."]],
["B2","Jerusalém","Hipóteses sobre o passado","Гипотезы о прошлом","bíblico","Se + mais-que-perfeito do subjuntivo; teria + particípio.","Se tivesse + причастие — нереальное прошлое; teria + причастие — возможный результат.",[["contrafactual","противоречащий фактам"],["desdobramento","развитие событий"],["hipótese","гипотеза"],["decorrência","следствие"],["reconsiderar","пересматривать"]],[["Se tivéssemos confirmado o horário, teríamos evitado o equívoco.","Если бы мы уточнили время, мы избежали бы недоразумения."],["A hipótese não altera o que realmente aconteceu.","Гипотеза не меняет того, что произошло на самом деле."],["Podemos reconsiderar o procedimento para futuras reuniões.","Мы можем пересмотреть порядок действий для будущих собраний."]],{"example":0,"answer":"tivéssemos confirmado"},["Проанализируй вымышленную ошибку организации и альтернативу.","Analise uma falha fictícia de organização e uma alternativa.","Se a equipe tivesse consultado o aviso, teria percebido a alteração. Como isso não aconteceu, houve confusão. Para evitar novos equívocos, proponho confirmar os horários por escrito."]],
["B2","Betânia","Condições e consequências","Условия и последствия","bíblico","Contanto que + subjuntivo; caso contrário introduz a consequência.","Contanto que + subjuntivo — при условии; caso contrário — иначе.",[["condicionante","обусловливающий фактор"],["ressalva","оговорка"],["pressuposto","предпосылка"],["viável","осуществимый"],["alternativamente","в качестве альтернативы"]],[["O projeto será viável, contanto que disponhamos dos recursos necessários.","Проект будет осуществим при условии, что у нас будут необходимые ресурсы."],["Caso contrário, teremos de reconsiderar o planejamento.","Иначе нам придётся пересмотреть план."],["A participação voluntária é um pressuposto da proposta.","Добровольное участие — предпосылка предложения."]],{"example":0,"answer":"disponhamos"},["Определи условия и альтернативу для общественного мероприятия.","Defina condições e uma alternativa para uma atividade comunitária.","A atividade pode ocorrer ao ar livre, contanto que haja um local adequado. Se as condições mudarem, usaremos uma sala disponível. Em ambos os casos, a participação será voluntária."]],
["B2","Galileia","Concessão e evidência","Уступка и доказательства","bíblico","Por mais que + subjuntivo; nem por isso marca contraste.","Por mais que + subjuntivo — как бы ни; nem por isso — но это не означает.",[["plausível","правдоподобный"],["fundamentação","обоснование"],["insuficiente","недостаточный"],["contestação","возражение"],["verossimilhança","правдоподобие"]],[["Por mais que uma explicação pareça plausível, precisamos examinar sua fundamentação.","Как бы правдоподобным ни казалось объяснение, нужно изучить его обоснование."],["Um argumento pode ser convincente e, nem por isso, estar correto.","Довод может быть убедительным, но это не значит, что он верен."],["A contestação deve apontar evidências, não atacar a pessoa.","Возражение должно указывать на доказательства, а не нападать на человека."]],{"example":0,"answer":"pareça"},["Объясни, как оценивать толкование, не смешивая правдоподобие с истиной.","Explique como avaliar uma interpretação sem confundir plausibilidade e verdade.","Uma interpretação pode parecer coerente à primeira vista. Entretanto, é necessário examinar o contexto e as evidências. Por mais convincente que seja a apresentação, ela não substitui a fundamentação."]],
["B2","Nazaré","A oração relativa formal","Формальные относительные предложения","bíblico","Cujo concorda com o nome seguinte; não se usa artigo depois dele.","Cujo согласуется со следующим существительным; артикль после него не ставится.",[["autoria","авторство"],["procedência","происхождение"],["vínculo","связь"],["acervo documental","архивная коллекция"],["atribuição de autoria","установление авторства"]],[["Consultamos um documento cuja autoria ainda é discutida.","Мы изучили документ, авторство которого всё ещё обсуждается."],["A procedência do documento deve ser indicada.","Происхождение документа следует указать."],["O acervo contém textos cujas origens são conhecidas.","Архив содержит тексты, происхождение которых известно."]],{"example":0,"answer":"cuja"},["Напиши абзац о двух источниках с cujo и cuja.","Escreva um parágrafo sobre duas fontes usando cujo e cuja.","A primeira fonte é um livro cujo autor apresenta suas referências. A segunda é uma coletânea cuja organização facilita a consulta. Convém distinguir as informações de cada fonte."]],
["B2","Jerusalém","Retomar ideias com precisão","Точное отсылание к мыслям","bíblico","O que retoma uma oração inteira; aquele que retoma uma pessoa ou elemento.","O que может отсылать ко всему предложению; aquele que — к лицу или элементу.",[["antecedente","предшествующее слово"],["retomada","отсылка"],["referencial","отсылочный"],["coesão textual","текстовая связность"],["inequívoco","однозначный"]],[["A equipe esclareceu a dúvida, o que facilitou a interpretação.","Команда прояснила вопрос, что облегчило перевод."],["A retomada deve ter um referente inequívoco.","Отсылка должна иметь однозначный референт."],["Aquele que traduz precisa identificar a quem cada pronome se refere.","Тот, кто переводит, должен определять, к кому относится каждое местоимение."]],{"example":0,"answer":"o que"},["Перепиши две мысли, связав их через o que.","Reescreva duas ideias ligando-as com o que.","O orador explicou o significado da metáfora, o que facilitou a compreensão do público. A equipe registrou a explicação, o que permitiu consultar a informação posteriormente."]],
["B2","Betânia","Infinitivo pessoal","Личный инфинитив","bíblico","Para + infinitivo pessoal explicita sujeito plural: para entendermos, para entenderem.","Para + личный инфинитив уточняет субъект: para entendermos, para entenderem.",[["explicitação","уточнение"],["interdependência","взаимозависимость"],["corresponsabilidade","совместная ответственность"],["enunciador","говорящий"],["autônomo","самостоятельный"]],[["Para compreendermos o relato, precisamos observar suas circunstâncias.","Чтобы нам понять повествование, нужно учитывать обстоятельства."],["A professora preparou exemplos para os alunos praticarem de forma autônoma.","Преподаватель подготовила примеры, чтобы ученики практиковались самостоятельно."],["A explicitação do sujeito evita ambiguidades.","Уточнение субъекта предотвращает двусмысленность."]],{"example":0,"answer":"compreendermos"},["Сформулируй три цели с личным инфинитивом.","Formule três finalidades com infinitivo pessoal.","Para aprendermos com autonomia, precisamos de bons exemplos. O material foi organizado para os participantes consultarem as palavras. Reservamos um momento para todos discutirem as dúvidas."]],
["B2","Galileia","A finalidade em diferentes registros","Цель в разных регистрах","bíblico","A fim de que + subjuntivo; a fim de + infinitivo.","A fim de que + subjuntivo; a fim de + инфинитив — с целью.",[["finalístico","целевой"],["intencionalidade","намеренность"],["viabilizar","делать возможным"],["planejamento didático","учебное планирование"],["acessibilidade","доступность"]],[["Organizamos o glossário a fim de que os alunos encontrem os termos com facilidade.","Мы организовали словарь, чтобы ученики легко находили термины."],["A acessibilidade deve orientar o planejamento didático.","Доступность должна направлять учебное планирование."],["A fim de viabilizar o estudo, preparamos exemplos claros.","Чтобы сделать обучение возможным, подготовили ясные примеры."]],{"example":0,"answer":"encontrem"},["Обоснуй два учебных решения с a fim de que.","Justifique duas escolhas didáticas usando a fim de que.","Dividimos o texto em partes a fim de que os leitores acompanhem o raciocínio. Incluímos traduções a fim de que possam comparar os sentidos. A organização favorece a autonomia."]],
["B2","Nazaré","Nominalização e clareza","Номинализация и ясность","bíblico","Transformar verbos em nomes muda o foco: esclarecer → esclarecimento.","Преобразование глагола в существительное меняет фокус: esclarecer → esclarecimento.",[["nominalização","номинализация"],["encaminhamento","направление"],["delimitação","ограничение"],["reavaliação","переоценка"],["operacionalização","практическая реализация"]],[["A reavaliação do plano ocorreu depois da reunião.","Переоценка плана произошла после собрания."],["A equipe reavaliou o plano depois da reunião.","Команда пересмотрела план после собрания."],["A segunda formulação identifica quem realizou a ação.","Вторая формулировка указывает, кто выполнил действие."]],{"example":0,"answer":"reavaliação"},["Перепиши номинализованную информацию с глаголом и явным субъектом.","Reescreva uma informação nominalizada com verbo e sujeito explícito.","A elaboração do resumo foi concluída pela equipe. Em linguagem mais direta, a equipe concluiu o resumo. A segunda versão destaca o responsável pela ação."]],
["B2","Jerusalém","Passiva e responsabilidade","Пассив и ответственность","bíblico","Ser + particípio focaliza a ação; por indica agente da passiva.","Ser + причастие выделяет действие; por указывает исполнителя.",[["agente","исполнитель действия"],["deliberado","преднамеренный"],["omissão","упущение"],["responsabilização","установление ответственности"],["transparente","прозрачный"]],[["O relatório foi revisado por dois participantes.","Отчёт был проверен двумя участниками."],["A identificação do agente torna o procedimento mais transparente.","Указание исполнителя делает процедуру прозрачнее."],["Nem toda omissão do agente é deliberada.","Не всякое опущение исполнителя преднамеренно."]],{"example":0,"answer":"foi revisado"},["Сравни активную и пассивную фразы в вымышленном отчёте.","Compare uma frase ativa e uma passiva num relatório fictício.","A equipe confirmou as informações ontem. Na passiva, as informações foram confirmadas pela equipe ontem. As duas versões preservam o fato, mas destacam elementos diferentes."]],
["B2","Betânia","O se em construções formais","Se в формальных конструкциях","bíblico","Vendem-se livros: passiva com concordância; precisa-se de livros: sujeito indeterminado.","Vendem-se livros — пассив с согласованием; precisa-se de livros — неопределённый субъект.",[["indeterminação","неопределённость"],["concordância verbal","согласование глагола"],["transitividade","переходность"],["impessoalidade","безличность"],["redação formal","официальное изложение"]],[["Distribuem-se materiais no início da atividade.","Материалы раздают в начале мероприятия."],["Precisa-se de voluntários para organizar a sala.","Нужны добровольцы для организации зала."],["A concordância depende da estrutura sintática.","Согласование зависит от синтаксической структуры."]],{"example":0,"answer":"Distribuem-se"},["Создай два объявления с пассивным и неопределённым se.","Crie dois avisos usando se passivo e se indeterminador.","Entregam-se os materiais após a inscrição. Precisa-se de pessoas disponíveis para orientar os visitantes. Na primeira frase, materiais determina o plural; na segunda, o verbo fica no singular."]],
["B2","Galileia","Gerúndio e relação temporal","Герундий и временная связь","bíblico","Gerúndio pode indicar simultaneidade, meio ou circunstância; evite referente ambíguo.","Герундий обозначает одновременность, способ или обстоятельство; избегай двусмысленного субъекта.",[["simultaneidade","одновременность"],["circunstancial","обстоятельственный"],["ambíguo","двусмысленный"],["progressão","развитие"],["articular","связывать"]],[["Observando o contexto, o intérprete identificou o sentido da expressão.","Изучая контекст, переводчик определил смысл выражения."],["A relação entre as ações deve ficar clara.","Связь между действиями должна быть ясной."],["A progressão do discurso pode ser articulada com conectores.","Развитие речи можно связать с помощью союзов."]],{"example":0,"answer":"Observando"},["Переформулируй предложение с герундием, уточнив субъект.","Reformule uma frase com gerúndio para deixar o sujeito claro.","Lendo o texto, a intérprete encontrou uma referência desconhecida. Para evitar ambiguidade, posso dizer que, enquanto lia o texto, ela encontrou a referência. O sentido permanece o mesmo."]],
["B2","Nazaré","A colocação pronominal","Положение местоимений","bíblico","No Brasil, próclise é comum; não e que atraem o pronome na norma-padrão.","В Бразилии проклиза распространена; não и que требуют местоимение перед глаголом по норме.",[["próclise","проклиза"],["ênclise","энклиза"],["pronome átono","безударное местоимение"],["naturalidade oral","естественность устной речи"],["norma-padrão","литературная норма"]],[["O responsável não se esqueceu do compromisso.","Ответственный не забыл об обязательстве."],["Peço que me enviem a informação correta.","Прошу прислать мне верную информацию."],["Na fala brasileira, me avise é uma formulação muito comum.","В бразильской речи me avise — очень распространённая формулировка."]],{"example":0,"answer":"se esqueceu"},["Сравни формальную и распространённую разговорную формулировку.","Compare uma formulação formal e outra corrente na fala brasileira.","Envie-me a informação quando puder é uma formulação formal. Na conversa, me envie a informação quando puder é frequente no Brasil. O contexto orienta a escolha."]],
["B2","Jerusalém","Pronomes de objeto","Объектные местоимения","bíblico","Lhe costuma marcar objeto indireto; o/a, objeto direto na norma.","Lhe обычно косвенное дополнение; o/a — прямое по норме.",[["objeto indireto","косвенное дополнение"],["objeto direto","прямое дополнение"],["destinação","адресация"],["regência verbal","управление глагола"],["substituição pronominal","замена местоимением"]],[["Entreguei-lhe o material solicitado.","Я передала ему запрошенный материал."],["Encontrei a visitante e a encaminhei à recepção.","Я встретила посетительницу и направила её к стойке приёма."],["Na fala cotidiana, muitas pessoas usam para ele ou para ela.","В повседневной речи часто употребляют para ele или para ela."]],{"example":0,"answer":"Entreguei-lhe"},["Перепиши две фразы с подходящими объектными местоимениями.","Reescreva duas frases usando um pronome de objeto adequado.","Entreguei o aviso à coordenadora: entreguei-lhe o aviso. Encontrei o coordenador e o cumprimentei. Na fala cotidiana, também posso dizer que entreguei o aviso para ela."]],
["B2","Betânia","Crase em textos formais","Crase в формальных текстах","bíblico","À resulta de a + a; antes de verbo não há artigo feminino.","À образуется из a + a; перед глаголом женского артикля нет.",[["fusão","слияние"],["locução","устойчивое сочетание"],["regência nominal","именное управление"],["referência feminina","отсылка к женскому роду"],["adequação normativa","соответствие норме"]],[["O comunicado faz referência à reunião de amanhã.","В сообщении говорится о завтрашнем собрании."],["A equipe começou a preparar os materiais.","Команда начала готовить материалы."],["À medida que revisamos o texto, percebemos novos detalhes.","По мере редактирования текста замечаем новые детали."]],{"example":0,"answer":"à reunião"},["Объясни разницу между à reunião и a preparar.","Explique a diferença entre à reunião e a preparar.","Em referência à reunião, a preposição a encontra o artigo a. Em começou a preparar, o segundo elemento é um verbo e não recebe artigo. Por isso, não há crase nesse caso."]],
["B2","Galileia","Regência e mudança de sentido","Управление и изменение смысла","bíblico","Assistir a significa presenciar; assistir alguém pode significar prestar assistência.","Assistir a — присутствовать, смотреть; assistir alguém — оказывать помощь.",[["assistência","помощь"],["presenciar","присутствовать"],["ambivalência","двойственность"],["complemento","дополнение"],["acepção","значение слова"]],[["Assistimos à apresentação do grupo.","Мы присутствовали на выступлении группы."],["A equipe assistiu os visitantes que solicitaram ajuda.","Команда помогла посетителям, попросившим помощи."],["O contexto permite distinguir as acepções do verbo.","Контекст позволяет различить значения глагола."]],{"example":0,"answer":"à apresentação"},["Сравни значения assistir в двух ситуациях.","Compare os sentidos de assistir em duas situações.","Assistir à palestra significa acompanhar a apresentação. Assistir uma pessoa, em registro formal, pode significar prestar-lhe auxílio. Na fala brasileira, assistir o vídeo também é frequente."]],
["B2","Nazaré","Concordância em expressões coletivas","Согласование с коллективными выражениями","bíblico","A maioria dos participantes chegou/chegaram: singular ou plural conforme o foco.","A maioria dos… допускает единственное или множественное число по смысловому акценту.",[["coletividade","совокупность"],["parcela","часть"],["predominância","преобладание"],["quantificador","квантификатор"],["consistência","последовательность"]],[["A maioria dos participantes chegou antes do início.","Большинство участников пришло до начала."],["Parte dos materiais foi distribuída na entrada.","Часть материалов раздали на входе."],["Em um relatório, convém manter a consistência da concordância.","В отчёте стоит сохранять последовательность согласования."]],{"example":0,"answer":"chegou"},["Напиши вымышленный отчёт с выражениями количества.","Escreva um relatório fictício com expressões de quantidade.","A maioria dos participantes compareceu ao encontro. Uma parte dos materiais foi reservada para a próxima atividade. Vários voluntários ajudaram na organização."]],
["B2","Jerusalém","Modalizar uma afirmação","Смягчать категоричность утверждения","bíblico","Parece que + indicativo; é possível que + subjuntivo.","Parece que + indicativo; é possível que + subjuntivo — разные способы выражения вероятности.",[["modalização","модальность"],["assertividade","уверенность высказывания"],["incerto","неопределённый"],["cautela","осторожность"],["inferência","вывод"]],[["É possível que a interpretação dependa de um detalhe do contexto.","Возможно, толкование зависит от детали контекста."],["Parece que o autor apresenta uma comparação.","Похоже, автор приводит сравнение."],["Uma inferência deve ser distinguida de uma afirmação explícita.","Вывод следует отличать от прямого утверждения."]],{"example":0,"answer":"dependa"},["Предложи осторожное толкование символического образа.","Apresente uma interpretação cautelosa de uma imagem simbólica.","A imagem da estrada parece sugerir uma trajetória de vida. É possível que também represente escolhas. Sem considerar o contexto completo, não seria prudente afirmar uma única interpretação."]],
["B2","Betânia","O futuro do subjuntivo irregular","Неправильный будущий subjuntivo","bíblico","Quando houver, se trouxer, quando vier: formas irregulares do futuro do subjuntivo.","Quando houver, se trouxer, quando vier — неправильные формы будущего subjuntivo.",[["eventualidade","возможное событие"],["previsibilidade","предсказуемость"],["providência","мера"],["contingência","непредвиденное обстоятельство"],["antecipação","предвидение"]],[["Quando houver uma alteração, informe os participantes.","Когда произойдёт изменение, сообщи участникам."],["Se alguém trouxer uma dúvida, vamos registrá-la.","Если кто-то задаст вопрос, запишем его."],["Quando o responsável vier, poderemos confirmar a informação.","Когда придёт ответственный, сможем подтвердить информацию."]],{"example":0,"answer":"houver"},["Запланируй три действия, зависящие от будущих событий.","Planeje três ações condicionadas a acontecimentos futuros.","Se houver mudança de local, avisarei a equipe. Quando o responsável vier, confirmarei os detalhes. Se alguém trouxer uma proposta, vamos avaliá-la."]],
["B2","Galileia","O subjuntivo composto","Составной subjuntivo","bíblico","Espero que tenha + particípio expressa anterioridade em relação ao presente.","Espero que tenha + причастие выражает предшествующее действие.",[["conclusão de tarefa","завершение задачи"],["confirmação","подтверждение"],["expectativa retrospectiva","ожидание относительно прошлого"],["verificação de informação","проверка сведений"],["eventual","возможный"]],[["Espero que a equipe tenha confirmado o aviso.","Надеюсь, команда подтвердила объявление."],["É possível que alguém tenha recebido uma versão anterior.","Возможно, кто-то получил прежнюю версию."],["Vamos verificar a informação antes de divulgá-la.","Проверим информацию, прежде чем её распространять."]],{"example":0,"answer":"tenha confirmado"},["Напиши три предположения о недавних событиях вымышленного собрания.","Escreva três hipóteses sobre acontecimentos recentes de uma reunião fictícia.","Talvez a equipe tenha recebido o aviso pela manhã. Espero que todos tenham entendido a mudança. É possível que uma pessoa ainda não tenha consultado a mensagem."]],
["B2","Nazaré","Mais-que-perfeito simples e composto","Простое и составное предпрошедшее","bíblico","Chegara é literário; tinha chegado é corrente na fala brasileira.","Chegara — книжное; tinha chegado — обычная форма в бразильской речи.",[["mais-que-perfeito","предпрошедшее время"],["anterioridade temporal","временное предшествование"],["registro literário","литературный регистр"],["equivalência temporal","временное соответствие"],["pretérito","прошедшее время"]],[["O mensageiro tinha chegado antes de o grupo sair.","Посланник прибыл до того, как группа ушла."],["Em um texto literário, chegara pode expressar a mesma anterioridade.","В литературном тексте chegara может обозначать то же предшествование."],["Na conversa, a forma composta é mais habitual.","В разговоре составная форма привычнее."]],{"example":0,"answer":"tinha chegado"},["Преобразуй chegara и recebera в современные формы и употреби в рассказе.","Transforme chegara e recebera em formas atuais e use-as numa narrativa.","O mensageiro tinha chegado cedo. Ele tinha recebido uma carta antes de sair. As formas chegara e recebera seriam possíveis em um registro literário."]],
["B2","Jerusalém","Futuro composto e suposição","Составное будущее и предположение","bíblico","Terá + particípio pode indicar conclusão futura ou hipótese sobre o passado.","Terá + причастие — завершение к будущему моменту или предположение о прошлом.",[["conclusão prevista","ожидаемое завершение"],["conjectura","догадка"],["estimativa temporal","временная оценка"],["marco temporal","временной рубеж"],["verificável","проверяемый"]],[["Até o início da atividade, a equipe terá concluído os preparativos.","К началу мероприятия команда завершит подготовку."],["Será que alguém terá recebido o aviso antigo?","Неужели кто-то получил старое объявление?"],["Uma conjectura precisa ser verificada antes de virar informação.","Догадку нужно проверить, прежде чем представлять как информацию."]],{"example":0,"answer":"terá concluído"},["Сравни будущее предсказание и предположение о прошлом.","Compare uma previsão futura e uma hipótese sobre o passado.","Até amanhã, teremos revisado o relatório. Será que alguém já terá enviado a versão anterior? A primeira frase estabelece um prazo futuro; a segunda apresenta uma dúvida sobre o passado."]],
["B2","Betânia","Aspecto e continuidade","Аспект и продолжительность","bíblico","Vir + gerúndio sugere processo gradual; continuar + gerúndio indica continuidade.","Vir + герундий — постепенный процесс; continuar + герундий — продолжение.",[["gradual","постепенный"],["continuidade","продолжительность"],["aperfeiçoamento","совершенствование"],["persistência","настойчивость"],["consolidação","закрепление"]],[["A equipe vem aprimorando a organização das atividades.","Команда постепенно совершенствует организацию мероприятий."],["Continuamos revisando os materiais conforme surgem dúvidas.","Мы продолжаем проверять материалы по мере возникновения вопросов."],["A consolidação da aprendizagem exige prática regular.","Закрепление знаний требует регулярной практики."]],{"example":0,"answer":"vem aprimorando"},["Опиши постепенное улучшение работы вымышленной группы.","Descreva um processo de melhoria gradual de um grupo fictício.","O grupo vem desenvolvendo novas formas de organizar os materiais. Continua revisando as informações a cada encontro. Com o tempo, espera consolidar os procedimentos que funcionam bem."]],
["B2","Galileia","Discurso indireto complexo","Сложная косвенная речь","bíblico","Pediu que + imperfeito do subjuntivo; afirmou que tinha + particípio.","Pediu que + imperfeito do subjuntivo; afirmou que tinha + причастие.",[["reprodução do discurso","воспроизведение речи"],["enunciado original","исходное высказывание"],["adequação temporal","временное соответствие"],["relator","докладчик"],["atribuir uma fala","приписывать высказывание"]],[["O coordenador pediu que verificássemos o material antes da reunião.","Координатор попросил нас проверить материал перед собранием."],["Ele afirmou que já tinha recebido o comunicado.","Он утверждал, что уже получил сообщение."],["O relator deve preservar a autoria de cada afirmação.","Докладчик должен сохранять авторство каждого утверждения."]],{"example":0,"answer":"verificássemos"},["Преобразуй в косвенную речь: «Já recebi o aviso. Confiram os materiais.»","Transforme: «Já recebi o aviso. Confiram os materiais.»","O coordenador afirmou que já tinha recebido o aviso. Em seguida, pediu que os participantes conferissem os materiais. As duas informações foram atribuídas à mesma pessoa."]],
["B2","Nazaré","O discurso citado e a distância","Цитируемая речь и дистанцирование","bíblico","Segundo e de acordo com atribuem; alegar não confirma a veracidade.","Segundo и de acordo com указывают источник; alegar не подтверждает истинность.",[["alegação","утверждение"],["atribuição","атрибуция"],["distanciamento","дистанцирование"],["corroboração","подтверждение"],["testemunhal","свидетельский"]],[["Segundo o relato, o grupo chegou antes do horário previsto.","Согласно рассказу, группа прибыла раньше намеченного времени."],["Uma pessoa alegou que o aviso tinha sido alterado.","Один человек заявил, что объявление изменили."],["A alegação ainda precisa de corroboração.","Утверждение ещё нуждается в подтверждении."]],{"example":0,"answer":"Segundo"},["Передай вымышленное сообщение, не выдавая его за подтверждённый факт.","Relate uma informação fictícia sem tratá-la como fato confirmado.","Segundo um participante, o encontro teria mudado de horário. A informação ainda não foi confirmada pelo responsável. Portanto, não devemos divulgá-la como definitiva."]],
["B2","Jerusalém","A progressão argumentativa","Развитие аргументации","bíblico","Não obstante pode introduzir contraste; por conseguinte introduz conclusão.","Não obstante — несмотря на это; por conseguinte — следовательно.",[["premissa","посылка"],["tese","тезис"],["argumentação lógica","логическая аргументация"],["objeção","возражение"],["encadeamento lógico","логическая последовательность"]],[["O projeto exige recursos; não obstante, pode ser viável.","Проект требует ресурсов; тем не менее он может быть осуществим."],["A equipe dispõe dos materiais; por conseguinte, pode iniciar a preparação.","У команды есть материалы; следовательно, она может начать подготовку."],["Uma objeção fundamentada deve ser considerada.","Обоснованное возражение следует учитывать."]],{"example":0,"answer":"não obstante"},["Обоснуй учебное предложение и ответь на возражение.","Defenda uma proposta de estudo e responda a uma objeção.","Proponho organizar um grupo de leitura porque a discussão pode ampliar a compreensão. Uma objeção é a falta de tempo. Não obstante, encontros curtos podem ser viáveis, desde que a participação seja voluntária."]],
["B2","Betânia","A reformulação explicativa","Поясняющее переформулирование","bíblico","Ou seja e isto é introduzem explicação; em outras palavras reformula.","Ou seja и isto é — то есть; em outras palavras — другими словами.",[["elucidar","разъяснять"],["especificação","уточнение"],["reformulação explicativa","поясняющее переформулирование"],["elipse","эллипсис"],["redundância","избыточность"]],[["O texto apresenta uma metáfora, ou seja, uma imagem de sentido figurado.","Текст содержит метафору, то есть образ с переносным смыслом."],["Em outras palavras, o contexto orienta a leitura.","Другими словами, контекст направляет чтение."],["A reformulação pode elucidar uma ideia sem acrescentar fatos.","Переформулирование может пояснить мысль, не добавляя фактов."]],{"example":0,"answer":"ou seja"},["Объясни языковой термин с ou seja и em outras palavras.","Explique um termo de linguagem usando ou seja e em outras palavras.","Uma elipse é a omissão de um elemento recuperável pelo contexto, ou seja, nem todas as palavras precisam aparecer. Em outras palavras, o leitor pode reconstruir o sentido sem que a expressão esteja completa."]],
["B2","Galileia","Distinguir relato e interpretação","Различать рассказ и толкование","bíblico","O texto afirma que; pode-se inferir que distingue informação e interpretação.","O texto afirma que — текст утверждает; pode-se inferir que — можно сделать вывод.",[["exegese","толкование текста"],["inferir","делать вывод"],["explícito","явный"],["implícito","подразумеваемый"],["leitura contextual","контекстное чтение"]],[["Pode-se inferir que o narrador dá destaque à reação das personagens.","Можно сделать вывод, что рассказчик выделяет реакцию персонажей."],["Uma interpretação não equivale necessariamente a uma afirmação explícita.","Толкование не обязательно равнозначно прямому утверждению."],["A leitura contextual ajuda a delimitar o sentido da passagem.","Контекстное чтение помогает определить смысл отрывка."]],{"example":0,"answer":"Pode-se inferir"},["Объясни, как различать прямое сообщение и вывод.","Explique como distinguir informação explícita e inferência.","Se o relato informa que uma personagem partiu, temos uma ação explícita. A razão de sua partida pode não estar indicada. Nesse caso, qualquer explicação deve ser apresentada como hipótese."]],
["B2","Jerusalém","Gêneros literários na Bíblia","Литературные жанры Библии","bíblico","Enquanto pode contrastar; ao passo que estabelece contraste paralelo.","Enquanto и ao passo que могут выражать сопоставление.",[["gênero literário","литературный жанр"],["poesia","поэзия"],["narrativa histórica","историческое повествование"],["epístola","послание"],["prosa","проза"]],[["A poesia explora imagens, ao passo que uma narrativa organiza acontecimentos.","Поэзия использует образы, тогда как повествование организует события."],["Uma epístola possui destinatários e circunstâncias próprios.","Послание имеет своих адресатов и обстоятельства."],["O gênero literário orienta as expectativas do leitor.","Литературный жанр формирует ожидания читателя."]],{"example":0,"answer":"ao passo que"},["Сравни язык двух библейских жанров.","Compare dois gêneros bíblicos quanto à linguagem.","Uma narrativa costuma acompanhar a sequência dos acontecimentos, enquanto um poema pode organizar ideias por imagens e paralelismos. Ambos comunicam sentidos, mas exigem estratégias de leitura diferentes. A interpretação precisa considerar o gênero."]],
["B2","Betânia","Paralelismo poético","Поэтический параллелизм","bíblico","Tanto... quanto... e estruturas paralelas mantêm equilíbrio sintático.","Tanto… quanto… и параллельные конструкции поддерживают синтаксический баланс.",[["paralelismo","параллелизм"],["verso","стихотворная строка"],["ritmo poético","поэтический ритм"],["correspondência","соответствие"],["simetria","симметрия"]],[["O paralelismo pode aproximar ideias tanto pela semelhança quanto pelo contraste.","Параллелизм может сближать мысли как по сходству, так и по контрасту."],["Dois versos podem desenvolver imagens complementares.","Две строки могут развивать дополняющие друг друга образы."],["A tradução deve considerar a correspondência entre as estruturas.","Перевод должен учитывать соответствие структур."]],{"example":0,"answer":"tanto pela semelhança quanto pelo contraste"},["Создай две оригинальные параллельные поэтические строки и объясни связь.","Crie duas linhas poéticas originais em paralelo e explique a relação.","A manhã desperta a cidade; a brisa renova o jardim. As duas orações apresentam ações simultâneas ligadas à renovação. A estrutura paralela aproxima as imagens sem torná-las idênticas."]],
["B2","Nazaré","Imagens e campos semânticos","Образы и семантические поля","bíblico","Remeter a e associar-se a indicam relações de sentido.","Remeter a — отсылать к; associar-se a — ассоциироваться с.",[["campo semântico","семантическое поле"],["conotação","коннотация"],["denotação","денотация"],["polissemia","многозначность"],["evocar","вызывать образ"]],[["Uma imagem de caminho pode remeter a escolhas e mudanças.","Образ пути может отсылать к выбору и переменам."],["A palavra possui denotação e possíveis conotações.","У слова есть прямое значение и возможные коннотации."],["A polissemia exige atenção ao contexto de uso.","Многозначность требует внимания к контексту употребления."]],{"example":0,"answer":"remeter a"},["Проанализируй семантическое поле образа пути.","Analise um campo semântico ligado à imagem de caminho.","Estrada, passo e direção pertencem a um campo relacionado ao movimento. Em uma metáfora, podem evocar decisões ou mudanças. O sentido concreto continua disponível, e o contexto orienta a interpretação."]],
["B2","Galileia","O narrador e a focalização","Рассказчик и перспектива","bíblico","É narrado do ponto de vista de; aquilo que o narrador revela.","É narrado do ponto de vista de — повествуется с точки зрения; aquilo que — то, что.",[["focalização","фокализация"],["narrador onisciente","всеведущий рассказчик"],["perspectiva narrativa","перспектива повествования"],["seleção de detalhes","отбор деталей"],["ponto de observação","точка наблюдения"]],[["O acontecimento é narrado do ponto de vista de quem o observou.","Событие рассказано с точки зрения того, кто его наблюдал."],["Aquilo que o narrador revela influencia nossa compreensão.","То, что раскрывает рассказчик, влияет на понимание."],["A seleção de detalhes pode mudar a perspectiva narrativa.","Отбор деталей может менять перспективу повествования."]],{"example":0,"answer":"é narrado"},["Расскажи о вымышленной встрече с двух точек зрения.","Conte um encontro fictício a partir de dois pontos de vista.","Para a visitante, a sala parecia desconhecida e silenciosa. Para o responsável, era um ambiente familiar que precisava ser preparado. O encontro é o mesmo, mas cada perspectiva destaca detalhes diferentes."]],
["B2","Jerusalém","A função do contexto imediato","Функция ближайшего контекста","bíblico","Considerar não apenas X, mas também Y; referente anterior e posterior.","Considerar não apenas… mas também… — учитывать не только…, но и…",[["unidade textual","текстовая единица"],["contexto imediato","ближайший контекст"],["fragmentação","фрагментация"],["progressão temática","тематическое развитие"],["articulação textual","текстовая связь"]],[["Devemos considerar não apenas a frase, mas também o parágrafo em que ela aparece.","Нужно учитывать не только фразу, но и абзац, в котором она встречается."],["A fragmentação pode ocultar a progressão temática.","Разделение на фрагменты может скрыть развитие темы."],["A unidade textual ajuda a identificar o referente de um pronome.","Текстовая единица помогает определить референт местоимения."]],{"example":0,"answer":"mas também"},["Объясни, почему изолированную фразу можно понять неверно.","Explique por que uma frase isolada pode ser mal compreendida.","Uma frase pode conter um pronome cujo referente aparece no parágrafo anterior. Se a retirarmos de seu contexto, talvez atribuamos a ação à pessoa errada. Por isso, convém consultar a unidade textual inteira."]],
["B2","Betânia","Cronologia e flashback","Хронология и ретроспекция","bíblico","Já havia + particípio; antes disso estabelece anterioridade.","Já havia + причастие — действие к прошлому моменту; antes disso — до этого.",[["retrospectiva","ретроспектива"],["cronologia","хронология"],["ordem narrativa","порядок повествования"],["reconstituição","воссоздание"],["marcador temporal","временной маркер"]],[["Antes daquele encontro, a personagem já havia recebido uma notícia.","До той встречи персонаж уже получил известие."],["A retrospectiva interrompe a ordem cronológica da narrativa.","Ретроспекция прерывает хронологический порядок повествования."],["Os marcadores temporais permitem reconstituir a sequência dos fatos.","Временные маркеры позволяют восстановить порядок событий."]],{"example":0,"answer":"havia recebido"},["Расскажи три события не в хронологическом порядке и поясни последовательность.","Conte três fatos em ordem narrativa não cronológica e esclareça a sequência.","O grupo chegou à sala no final da tarde. Antes disso, havia preparado os materiais pela manhã. Depois da chegada, iniciou a leitura. Cronologicamente, a preparação veio primeiro."]],
["B2","Nazaré","A voz das personagens","Речь персонажей","bíblico","O discurso direto conserva a voz; o indireto adapta referências.","Прямая речь сохраняет голос персонажа; косвенная адаптирует отсылки.",[["discurso direto","прямая речь"],["discurso indireto","косвенная речь"],["marcação","обозначение"],["enunciação","высказывание"],["tom","тон"]],[["A narradora perguntou se a visitante tinha compreendido a explicação.","Рассказчица спросила, поняла ли посетительница объяснение."],["No discurso direto, a pergunta poderia começar por você entendeu.","В прямой речи вопрос мог бы начинаться с você entendeu."],["A tradução deve preservar o tom da pergunta.","Перевод должен сохранять тон вопроса."]],{"example":0,"answer":"tinha compreendido"},["Преобразуй вымышленные вопрос и ответ в косвенную речь.","Passe uma pergunta e uma resposta fictícias para o discurso indireto.","Ana perguntou se Rui havia lido o aviso. Ele respondeu que ainda não o tinha consultado. Ela sugeriu que o lesse antes da reunião."]],
["B2","Galileia","A pergunta retórica","Риторический вопрос","bíblico","Será que e acaso introduzem perguntas; nem toda pergunta solicita resposta literal.","Será que и acaso вводят вопросы; не всякий вопрос требует буквального ответа.",[["pergunta retórica","риторический вопрос"],["efeito retórico","риторический эффект"],["persuasão","убеждение"],["ênfase argumentativa","аргументативный акцент"],["interrogação","вопрос"]],[["Será que uma informação isolada basta para compreender o relato?","Разве отдельного сообщения достаточно, чтобы понять рассказ?"],["A pergunta retórica pode convidar o leitor à reflexão.","Риторический вопрос может побуждать читателя к размышлению."],["Seu efeito depende da situação comunicativa.","Его эффект зависит от коммуникативной ситуации."]],{"example":0,"answer":"Será que"},["Создай риторический вопрос и объясни его эффект.","Crie uma pergunta retórica e explique seu efeito.","Será que podemos compreender alguém sem escutar sua explicação? A pergunta não exige necessariamente uma resposta imediata. Ela introduz uma reflexão sobre a importância da escuta."]],
["B2","Jerusalém","A metáfora prolongada","Развёрнутая метафора","bíblico","Assim como... também... estabelece analogia sem identidade completa.","Assim como… também… — аналогия без полного тождества.",[["metáfora prolongada","развёрнутая метафора"],["analogia","аналогия"],["correspondência figurativa","образное соответствие"],["limitação interpretativa","граница толкования"],["desenvolvimento temático","тематическое развитие"]],[["Assim como uma planta depende de condições adequadas, o aprendizado também exige cuidado.","Как растение зависит от подходящих условий, так и учёба требует заботы."],["Uma metáfora prolongada desenvolve várias correspondências.","Развёрнутая метафора развивает несколько соответствий."],["Nem todos os detalhes da imagem precisam ter um equivalente figurativo.","Не все детали образа должны иметь переносный эквивалент."]],{"example":0,"answer":"Assim como"},["Развей оригинальную метафору обучения и объясни её границы.","Desenvolva uma metáfora original sobre aprendizagem e explique seus limites.","Aprender pode ser comparado a cuidar de um jardim. A prática regular se parece com a manutenção das plantas, e os resultados surgem gradualmente. No entanto, a comparação não significa que todos aprendam do mesmo modo."]],
["B2","Betânia","A alegoria e a interpretação","Аллегория и толкование","bíblico","Pode ser entendido como; não se deve pressupor que + subjuntivo.","Pode ser entendido como — можно понять как; não se deve pressupor que + subjuntivo.",[["alegoria","аллегория"],["representação simbólica","символическое представление"],["pressuposição","предположение"],["equívoco interpretativo","ошибка толкования"],["discernível","различимый"]],[["Não se deve pressupor que cada detalhe possua um significado oculto.","Не следует предполагать, что каждая деталь имеет скрытый смысл."],["Uma alegoria pode ser entendida como uma representação simbólica desenvolvida.","Аллегорию можно понять как развёрнутое символическое представление."],["O contexto limita as interpretações plausíveis.","Контекст ограничивает правдоподобные толкования."]],{"example":0,"answer":"possua"},["Объясни, почему символическому толкованию нужны критерии.","Explique por que uma interpretação simbólica precisa de critérios.","Uma interpretação simbólica precisa apoiar-se em elementos identificáveis do texto. Se cada detalhe receber um significado arbitrário, o leitor pode perder o tema principal. Convém reconhecer os limites da hipótese."]],
["B2","Nazaré","A linguagem de provérbios","Язык притч и изречений","bíblico","Quem... e aquele que... generalizam; nem sempre implica exceções.","Quem… и aquele que… обобщают; nem sempre допускает исключения.",[["provérbio","пословица, изречение"],["máxima","афоризм"],["generalização","обобщение"],["princípio","принцип"],["exceção contextual","контекстное исключение"]],[["Quem examina as circunstâncias evita algumas conclusões precipitadas.","Тот, кто изучает обстоятельства, избегает некоторых поспешных выводов."],["Uma máxima pode expressar um princípio geral sem descrever todos os casos.","Афоризм может выражать общий принцип, не описывая все случаи."],["Nem sempre uma orientação geral se aplica da mesma maneira.","Не всегда общее наставление применяется одинаково."]],{"example":0,"answer":"Quem examina"},["Придумай оригинальное изречение о благоразумии и укажи ограничение.","Crie uma máxima original sobre prudência e indique uma limitação.","Quem escuta antes de responder tem mais oportunidades de compreender. A frase valoriza a prudência, mas não garante que toda conversa termine em acordo. Trata-se de um princípio geral."]],
["B2","Galileia","A voz poética dos Salmos","Поэтический голос Псалмов","bíblico","Alternar primeira pessoa e vocativo; o vocativo não é sujeito.","Первое лицо и обращение; обращение не является подлежащим.",[["voz poética","поэтический голос"],["vocativo","обращение"],["lamento","сетование"],["súplica","мольба"],["celebração","прославление"]],[["Na poesia religiosa, o vocativo pode introduzir uma súplica.","В религиозной поэзии обращение может вводить мольбу."],["A voz poética expressa sentimentos por meio de imagens.","Поэтический голос выражает чувства через образы."],["O lamento e a celebração podem coexistir em um texto.","Сетование и прославление могут сосуществовать в тексте."]],{"example":0,"answer":"o vocativo"},["Напиши оригинальную поэтическую молитву с обращением, не копируя стихи.","Escreva uma oração poética original com vocativo, sem copiar versículos.","Senhor, ensina-me a reconhecer o valor de cada dia. Quando minhas perguntas se multiplicarem, ajuda-me a procurar sabedoria. Que a gratidão acompanhe minhas escolhas."]],
