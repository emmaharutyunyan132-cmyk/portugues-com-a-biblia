let mapLevel='all';let page='home',active=0,queue=[],pos=0,score=0,locked=false,review=false;const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:«»]/g,'').replace(/\s+/g,' ').trim();const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(s){if(!('speechSynthesis'in window)){alert(tr('Озвучка недоступна','Áudio indisponível'));return}let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';let v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase()==='pt-br');u.voice=v[Number($('#voice')?.value||0)]||v[0]||null;speechSynthesis.speak(u)}function audio(s){return `<button class="secondary" onclick="speak(${esc(JSON.stringify(s))})">🔊</button>`}function go(p){page=p;render();scrollTo(0,0)}function stats(){$('#stats').textContent=`⭐ ${S.xp} XP · ${S.done.length}/${L.length}`;$('#nav').innerHTML=[['home','⌂',tr('Главная','Início')],['map','🗺',tr('Карта','Mapa')],['dict','📚',tr('Словарь','Vocabulário')],['review','↻',tr('Повтор','Revisão')],['profile','⚙',tr('Профиль','Perfil')]].map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}
function render(){stats();let h='';if(page==='home'){h=`<article class="hero"><div><span class="tag">A1 → B2</span><h1>Português com a Bíblia</h1><p>${tr('Учись вместе с Luz','Aprenda com Luz')}</p><button onclick="go('map')">${tr('Начать обучение','Começar')}</button></div>${sheep}</article><article><b>${tr('Прогресс доступных уроков','Progresso das lições disponíveis')}</b><progress max="${L.length}" value="${S.done.length}"></progress><p>${S.done.length}/${L.length} · ${S.xp} XP</p><p class="muted">${tr("План курса: 400 уроков","Meta do curso: 400 lições")}</p></article><div class="grid">${[['bible','📖 Bíblia'],['prayer','🙏 Oração'],['grammar','✏️ Gramática'],['sermon','🎧 Pregações'],['dialog','💬 Diálogos']].map(x=>`<button class="secondary" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}else if(page==='map'){h=`<h1>${tr('Карта путешествия','Mapa da jornada')}</h1><p class="muted">${tr('Условная карта библейских мест, не географический атлас. Все уроки доступны.','Mapa temático, não geográfico. Todas as lições estão abertas.')}</p><div class="row">${["all","A1","A2","B1","B2"].map(v=>`<button class="${mapLevel===v?"":"secondary"}" onclick="mapLevel=\'${v}\';render()">${v==="all"?tr("Все","Todas"):v+" ("+L.filter(l=>l[0]===v).length+")"}</button>`).join("")}</div><p>${tr("Доступно","Disponíveis")}: ${L.filter(l=>mapLevel==="all"||l[0]===mapLevel).length}</p><div class="map">${L.map((l,i)=>({l,i})).filter(({l})=>mapLevel==="all"||l[0]===mapLevel).sort((a,b)=>a.l[0].localeCompare(b.l[0])).map(({l,i})=>`<div class="stop"><span class="tag">${l[0]} · ${l[1]} · ${l[4]}</span><h3>${S.done.includes(i)?'✓ ':''}${l[2]}</h3><p>${tr(l[3],l[2])}</p><button onclick="intro(${i})">${tr('Открыть урок','Abrir lição')}</button></div>`).join('')}</div>`}else if(page==='intro'){let l=L[active];h=`<h1>${l[2]}</h1><span class="tag">${l[0]} · ${l[4]}</span><article><h2>${tr('Новые слова','Palavras novas')}</h2>${l[7].map(w=>`<div class="row"><b>${w[0]}</b>${w[1]}${audio(w[0])}</div>`).join('')}</article><article><h2>${tr('Грамматика','Gramática')}</h2>${tr(l[6],l[5])}<details><summary>${tr('Примеры','Exemplos')}</summary>${l[8].map(w=>`<p>${w[0]} — ${w[1]} ${audio(w[0])}</p>`).join('')}</details></article><button class="wide" onclick="start(${active})">${tr('К упражнениям','Praticar')}</button>`}else if(page==='quiz'){let q=queue[pos];h=`<p>${pos+1}/${queue.length}</p><progress max="${queue.length}" value="${pos}"></progress><article><span class="tag">${q.type}</span><h2>${esc(q.prompt)}</h2>${q.listen?audio(q.listen):''}${q.opts?q.opts.map((o,i)=>`<button class="option" onclick="check(queue[pos].opts[${i}])">${esc(o)}</button>`).join(''):`<input id="answer" autocomplete="off" placeholder="${tr('Ответ','Resposta')}"><button onclick="check($('#answer').value)">${tr('Проверить','Verificar')}</button>`}<div id="feedback" aria-live="polite"></div></article>`}else if(page==='result'){h=`<article class="hero"><div><h1>Parabéns!</h1><p>${score}/${queue.length} · +${score*10} XP</p><button onclick="go('map')">${tr('К карте','Mapa')}</button></div>${sheep}</article>`}else if(page==='dict'){h=`<h1>${tr('Словарь','Vocabulário')}</h1><input id="search" placeholder="Pesquisar" oninput="filterWords(this.value)"><article id="words">${L.flatMap(l=>l[7].map(w=>`<div class="word row"><b>${w[0]}</b><span>${w[1]}</span>${audio(w[0])}</div>`)).join('')}</article>`}else if(page==='review'){h=`<h1>${tr('Повторение','Revisão')}</h1><article>${Object.keys(S.errors).length} ${tr('ошибок','erros')}<p>${tr('Ошибочные задания сохраняются до правильного ответа.','Os erros ficam salvos até uma resposta correta.')}</p><button ${Object.keys(S.errors).length?'':'disabled'} onclick="startReview()">${tr('Повторить','Revisar')}</button></article>`}else if(page==='grammar'){h='<h1>Gramática</h1>'+L.map(l=>`<article><b>${l[0]} · ${l[2]}</b><p>${tr(l[6],l[5])}</p></article>`).join('')+`<article><h2>Português bíblico × Brasil</h2><p>Vós sois → Vocês são</p><p>Tu és → Você é (tu também é usado em regiões do Brasil)</p><p>Porventura → Será que / acaso</p></article>`}else if(page==='bible'){h=`<h1>Bíblia</h1><article><p>${tr('ACF и Синодальный перевод: полный текст не включён до проверки лицензии.','ACF e tradução sinodal: texto integral não incluído até verificar a licença.')}</p><a href="https://www.bibliaonline.com.br/acf" target="_blank" rel="noopener">${tr('Открыть ACF','Abrir ACF')}</a><p>${tr('Учебная лексика по мотивам Псалма 23','Vocabulário inspirado no Salmo 23')}</p><p>pastor · descanso · caminho</p><details><summary>${tr('Показать перевод','Mostrar tradução')}</summary>пастырь · отдых · путь</details></article>`}else if(page==='prayer'){h=`<h1>Oração</h1><article><p>${tr('Составь собственную молитву. Используй Senhor, agradecer, pedir, confiar.','Escreva sua oração usando Senhor, agradecer, pedir, confiar.')}</p><textarea id="note" rows="7">${esc(S.notes)}</textarea><button onclick="S.notes=$('#note').value;save();this.textContent='✓'">${tr('Сохранить','Salvar')}</button><button class="secondary" onclick="speak($('#note').value)">🔊</button><p class="muted">${tr('Личная запись хранится только на этом устройстве. Автоматической проверки смысла пока нет.','Nota local. Sem correção automática de significado.')}</p></article>`}else if(page==='sermon'){h=`<h1>Pregações</h1><article><p>${tr('Учебная мини-проповедь (авторский текст)','Mensagem didática original')}</p>${audio('Quando enfrentamos dificuldades, podemos buscar a Deus e ajudar uns aos outros. A esperança nos encoraja a continuar.')}<textarea rows="5" placeholder="${tr('Твой перевод','Sua tradução')}"></textarea><details><summary>${tr('Показать пример перевода','Mostrar tradução')}</summary>Когда мы сталкиваемся с трудностями, мы можем искать Бога и помогать друг другу. Надежда побуждает нас продолжать.</details></article>`}else if(page==='dialog'){h=`<h1>Diálogos</h1><article><p>Olá! Tudo bem? Você veio ao culto hoje?</p>${audio('Olá! Tudo bem? Você veio ao culto hoje?')}<button class="option" onclick="this.parentNode.querySelector('output').textContent='Muito bem! Ответ подходит.'">Sim, vim ao culto.</button><button class="option" onclick="this.parentNode.querySelector('output').textContent='Попробуй ответить о посещении богослужения.'">Eu moro longe.</button><output></output></article>`}else if(page==='profile'){h=`<h1>${tr('Профиль','Perfil')}</h1><article><p>${S.xp} XP · ${S.days.length} ${tr('дней занятий','dias de estudo')}</p><p>${S.done.length?'🏅 Primeiros passos':'🔒 Primeiros passos'}</p><p>${S.xp>=100?'🏅 100 XP':'🔒 100 XP'}</p><label>Idioma<select onchange="S.lang=this.value;save();render()"><option value="ru" ${S.lang==='ru'?'selected':''}>Русский</option><option value="pt" ${S.lang==='pt'?'selected':''}>Português</option></select></label><p>${tr('Голос зависит от устройства','Voz depende do dispositivo')}</p><select id="voice"><option value="0">Voz 1</option><option value="1">Voz 2 (se disponível)</option></select>${audio('Olá! Eu sou Luz.')}<p class="muted">${tr('Гостевой режим без регистрации. Прогресс хранится в этом браузере.','Modo visitante sem cadastro. O progresso fica neste navegador.')}</p><button onclick="exportData()">${tr('Экспорт прогресса','Exportar progresso')}</button></article>`}$('#app').innerHTML=h}
function intro(i){active=i;go('intro')}function start(i){active=i;review=false;let l=L[i],words=l[7];queue=words.map(w=>({type:'Vocabulário',prompt:w[0],answer:w[1],opts:shuffle(words.map(x=>x[1])),ex:w.join(' — ')}));l[8].forEach((w,j)=>{queue.push({type:'Tradução',prompt:w[1],answer:w[0],ex:w.join(' — ')});queue.push({type:'Português → Русский',prompt:w[0],answer:w[1],opts:shuffle(l[8].map(x=>x[1])),ex:w.join(' — ')});if(j===0)queue.push({type:'Áudio',prompt:tr('Что ты услышала?','O que você ouviu?'),listen:w[0],answer:w[0],ex:w.join(' — ')})});let w=l[8][0][0].split(' '),missing=w[1];queue.push({type:'Gramática',prompt:w.map((x,j)=>j===1?'___':x).join(' '),answer:missing,ex:l[6]});begin()}function begin(){pos=0;score=0;locked=false;go('quiz')}function startReview(){review=true;queue=Object.values(S.errors);begin()}function check(v){if(locked||!v.trim())return;locked=true;let q=queue[pos],ok=norm(v)===norm(q.answer),key=q.type+q.prompt+(q.listen||'');if(ok){score++;S.xp+=10;delete S.errors[key]}else S.errors[key]=q;let day=new Date().toLocaleDateString('en-CA');if(!S.days.includes(day))S.days.push(day);save();stats();document.querySelectorAll('#app button,#answer').forEach(b=>b.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'Muito bem! +10 XP':tr('Ожидаемый вариант','Resposta esperada')}</b><p>${esc(q.answer)}</p><p>${esc(q.ex)}</p>${!ok?'<small>Другие корректные варианты перевода могут не распознаваться.</small>':''}</div><button onclick="next()">${tr('Продолжить','Continuar')}</button>`}function next(){pos++;locked=false;if(pos===queue.length){if(!review&&score/queue.length>=.7&&!S.done.includes(active))S.done.push(active);save();go('result')}else render()}function filterWords(v){document.querySelectorAll('.word').forEach(e=>e.hidden=!norm(e.textContent).includes(norm(v)))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='progresso.json';a.click();URL.revokeObjectURL(a.href)}render();
