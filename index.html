<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer"><title>Português com a Bíblia</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7faf6;color:#254638;font:16px system-ui}header{position:sticky;top:0;background:white;border-bottom:1px solid #e1eae0;padding:16px;z-index:2}header div,main{max-width:850px;margin:auto}main{padding:20px 16px 100px}h1{font-size:32px;line-height:1.1}h2{font-size:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 18px;background:#23834b;color:white;font-weight:700;margin:4px 0}button.secondary{background:#e5f4e7;color:#245c39}button.pink{background:#f9dce9;color:#843858}button:disabled{opacity:.55}input,textarea,select{padding:12px;border:1px solid #cbd9cd;border-radius:12px;width:100%;background:white;color:#254638}article{background:white;border:1px solid #e1eae0;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 3px 0 #e6ede3}.hero{background:#e2f5e6;display:flex;align-items:center;gap:12px}.hero svg{width:130px;flex-shrink:0;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.muted{color:#64786a;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.grid button{min-height:65px}nav{position:fixed;bottom:0;background:white;border-top:1px solid #dce7dc;width:100%;display:flex;justify-content:center;gap:5px;padding:8px;z-index:3}nav button{background:white;color:#245c39;padding:10px;font-size:13px}progress{width:100%;accent-color:#38a85f;height:16px}.map{background:linear-gradient(130deg,#f8e9d2,#e4f3d8 65%,#ccebf1);border-radius:20px;padding:16px}.stop{margin:12px auto;max-width:440px;background:#fff;border:2px solid #b9d9a8;border-radius:18px;padding:14px}.stop:nth-child(even){transform:translateX(8px)}.tag{display:inline-block;background:#f9dce9;color:#843858;padding:5px 9px;border-radius:8px;font-size:12px}.option{display:block;width:100%;text-align:left;background:#f1f7ef;color:#254638;border:1px solid #cbdccc}.feedback{padding:14px;border-radius:12px;background:#e4f5e5}.bad{background:#fce7e9}.wide{width:100%}details{margin:12px 0}a{color:#226e43}small{font-size:12px}</style><header><div class="row"><b>🌿 Português com a Bíblia</b><span id="stats"></span></div></header><main id="app"></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S={xp:0,done:[],errors:{},lang:'ru',sound:true,days:[],notes:''};try{Object.assign(S,JSON.parse(localStorage.getItem('pcb-v1')||'{}'))}catch(e){}function save(){try{localStorage.setItem('pcb-v1',JSON.stringify(S))}catch(e){}}const tr=(r,p)=>S.lang==='pt'?p:r;const sheep=`<svg viewBox="0 0 160 150" aria-label="Luz"><g stroke="#536b50" stroke-width="2.5"><path d="M52 110v25m52-25v25" stroke-width="9" stroke-linecap="round"/><path d="M33 67Q10 45 19 77Q25 90 44 83M117 67Q143 45 140 77Q133 90 115 83" fill="#f3b9ce"/><path d="M35 54Q17 34 42 25Q43 5 66 16Q84 0 100 18Q127 10 130 36Q151 48 132 69Q150 93 125 106Q117 129 91 118Q66 137 48 117Q17 120 23 94Q5 77 35 54" fill="#fffdf5"/><ellipse cx="80" cy="76" rx="39" ry="36" fill="#f5e3cd"/><circle cx="65" cy="70" r="4" fill="#304438"/><circle cx="96" cy="70" r="4" fill="#304438"/><path d="M76 83q5 6 10 0" fill="none"/><path d="M49 108q31 14 62 0l-7 15H56z" fill="#75bc84"/></g><g fill="#efacc4"><ellipse cx="54" cy="83" rx="7" ry="4"/><ellipse cx="106" cy="83" rx="7" ry="4"/></g></svg>`;
// Original instructional examples, not quotations from ACF.
const L=[
['A1','Belém','Fé e esperança','Вера и надежда','bíblico','Ter + substantivo: tenho fé, temos esperança. Confiar em + pessoa.','Ter — иметь; confiar em — доверять. Eu tenho, nós temos.',[['fé','вера'],['esperança','надежда'],['confiar','доверять'],['Deus','Бог']], [['Eu tenho fé em Deus.','У меня есть вера в Бога.'],['Eu confio em Deus.','Я доверяю Богу.'],['Nós temos esperança.','У нас есть надежда.']]],
['A1','Nazaré','Oração','Молитва','bíblico','Orar: eu oro, você ora, nós oramos.','Глагол orar: eu oro, você ora, nós oramos.',[['orar','молиться'],['oração','молитва'],['Senhor','Господь'],['ajudar','помогать']], [['Eu oro todos os dias.','Я молюсь каждый день.'],['Senhor, ajuda-me.','Господи, помоги мне.'],['Nós oramos juntos.','Мы молимся вместе.']]],
['A1','Galileia','Na igreja','В церкви','bíblico','Ir a / para: vou à igreja.','Ir — идти; a + a = à.',[['igreja','церковь'],['culto','богослужение'],['pastor','пастор'],['servir','служить']], [['Eu vou à igreja.','Я иду в церковь.'],['Quero servir a Deus.','Я хочу служить Богу.'],['Nós lemos a Bíblia.','Мы читаем Библию.']]],
['A1','Galileia','Bom dia!','Знакомство','Brasil','Ser: eu sou, você é.','Ser — быть; eu sou, você é.',[['nome','имя'],['estudante','ученик'],['morar','жить'],['cidade','город']], [['Eu sou estudante.','Я ученица.'],['Eu moro em uma cidade.','Я живу в городе.'],['Qual é o seu nome?','Как тебя зовут?']]],
['A2','Jerusalém','Salmos e confiança','Псалмы и доверие','bíblico','Pretérito perfeito: orar → orei; ouvir → ouvi.','Завершённое прошлое: orei, ouvi.',[['escudo','щит'],['socorro','помощь'],['ouvir','слышать'],['clamar','взывать']], [['Ontem eu orei.','Вчера я молилась.'],['Deus ouviu a minha oração.','Бог услышал мою молитву.'],['Eu clamei ao Senhor.','Я воззвала к Господу.']]],
['A2','Jericó','Uma viagem','Путешествие','Brasil','Ir + infinitivo expressa futuro.','Ir + инфинитив выражает будущее.',[['viagem','поездка'],['chegar','прибывать'],['cedo','рано'],['passagem','билет']], [['Vou chegar cedo.','Я приеду рано.'],['Nós vamos viajar amanhã.','Мы поедем завтра.'],['Comprei uma passagem.','Я купила билет.']]],
['B1','Betânia','Servir com alegria','Служить с радостью','bíblico','É importante que + subjuntivo.','После é importante que нужен subjuntivo.',[['serviço','служение'],['próximo','ближний'],['humildade','смирение'],['acolher','принимать']], [['É importante que você ajude.','Важно, чтобы ты помогала.'],['Espero que todos participem.','Надеюсь, что все примут участие.'],['Embora seja difícil, continuamos.','Хотя это трудно, мы продолжаем.']]],
['B2','Jerusalém','Traduzir uma mensagem','Перевод проповеди','bíblico','Ainda que + subjuntivo; à medida que + indicativo.','Ainda que — даже если; à medida que — по мере того как.',[['perseverança','стойкость'],['circunstância','обстоятельство'],['amadurecer','созревать'],['propósito','цель']], [['Ainda que seja difícil, mantenha a esperança.','Даже если это трудно, сохраняй надежду.'],['À medida que aprendemos, podemos ajudar mais.','По мере того как мы учимся, мы можем больше помогать.'],['É necessário que compreendamos a mensagem.','Необходимо, чтобы мы поняли послание.']]]];
let page='home',active=0,queue=[],pos=0,score=0,locked=false,review=false;const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:«»]/g,'').replace(/\s+/g,' ').trim();const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(s){if(!('speechSynthesis'in window)){alert(tr('Озвучка недоступна','Áudio indisponível'));return}let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';let v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase()==='pt-br');u.voice=v[Number($('#voice')?.value||0)]||v[0]||null;speechSynthesis.speak(u)}function audio(s){return `<button class="secondary" onclick="speak(${esc(JSON.stringify(s))})">🔊</button>`}function go(p){page=p;render();scrollTo(0,0)}function stats(){$('#stats').textContent=`⭐ ${S.xp} XP · ${S.done.length}/8`;$('#nav').innerHTML=[['home','⌂',tr('Главная','Início')],['map','🗺',tr('Карта','Mapa')],['dict','📚',tr('Словарь','Vocabulário')],['review','↻',tr('Повтор','Revisão')],['profile','⚙',tr('Профиль','Perfil')]].map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}
function render(){stats();let h='';if(page==='home'){h=`<article class="hero"><div><span class="tag">A1 → B2</span><h1>Português com a Bíblia</h1><p>${tr('Учись вместе с Luz','Aprenda com Luz')}</p><button onclick="go('map')">${tr('Начать обучение','Começar')}</button></div>${sheep}</article><article><b>${tr('Прогресс первой версии','Progresso da versão inicial')}</b><progress max="8" value="${S.done.length}"></progress><p>${S.done.length}/8 · ${S.xp} XP</p></article><div class="grid">${[['bible','📖 Bíblia'],['prayer','🙏 Oração'],['grammar','✏️ Gramática'],['sermon','🎧 Pregações'],['dialog','💬 Diálogos']].map(x=>`<button class="secondary" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}else if(page==='map'){h=`<h1>${tr('Карта путешествия','Mapa da jornada')}</h1><p class="muted">${tr('Условная карта библейских мест, не географический атлас. Все уроки доступны.','Mapa temático, não geográfico. Todas as lições estão abertas.')}</p><div class="map">${L.map((l,i)=>`<div class="stop"><span class="tag">${l[0]} · ${l[1]} · ${l[4]}</span><h3>${S.done.includes(i)?'✓ ':''}${l[2]}</h3><p>${tr(l[3],l[2])}</p><button onclick="intro(${i})">${tr('Открыть урок','Abrir lição')}</button></div>`).join('')}</div>`}else if(page==='intro'){let l=L[active];h=`<h1>${l[2]}</h1><span class="tag">${l[0]} · ${l[4]}</span><article><h2>${tr('Новые слова','Palavras novas')}</h2>${l[7].map(w=>`<div class="row"><b>${w[0]}</b>${w[1]}${audio(w[0])}</div>`).join('')}</article><article><h2>${tr('Грамматика','Gramática')}</h2>${tr(l[6],l[5])}<details><summary>${tr('Примеры','Exemplos')}</summary>${l[8].map(w=>`<p>${w[0]} — ${w[1]} ${audio(w[0])}</p>`).join('')}</details></article><button class="wide" onclick="start(${active})">${tr('К упражнениям','Praticar')}</button>`}else if(page==='quiz'){let q=queue[pos];h=`<p>${pos+1}/${queue.length}</p><progress max="${queue.length}" value="${pos}"></progress><article><span class="tag">${q.type}</span><h2>${esc(q.prompt)}</h2>${q.listen?audio(q.listen):''}${q.opts?q.opts.map((o,i)=>`<button class="option" onclick="check(queue[pos].opts[${i}])">${esc(o)}</button>`).join(''):`<input id="answer" autocomplete="off" placeholder="${tr('Ответ','Resposta')}"><button onclick="check($('#answer').value)">${tr('Проверить','Verificar')}</button>`}<div id="feedback" aria-live="polite"></div></article>`}else if(page==='result'){h=`<article class="hero"><div><h1>Parabéns!</h1><p>${score}/${queue.length} · +${score*10} XP</p><button onclick="go('map')">${tr('К карте','Mapa')}</button></div>${sheep}</article>`}else if(page==='dict'){h=`<h1>${tr('Словарь','Vocabulário')}</h1><input id="search" placeholder="Pesquisar" oninput="filterWords(this.value)"><article id="words">${L.flatMap(l=>l[7].map(w=>`<div class="word row"><b>${w[0]}</b><span>${w[1]}</span>${audio(w[0])}</div>`)).join('')}</article>`}else if(page==='review'){h=`<h1>${tr('Повторение','Revisão')}</h1><article>${Object.keys(S.errors).length} ${tr('ошибок','erros')}<p>${tr('Ошибочные задания сохраняются до правильного ответа.','Os erros ficam salvos até uma resposta correta.')}</p><button ${Object.keys(S.errors).length?'':'disabled'} onclick="startReview()">${tr('Повторить','Revisar')}</button></article>`}else if(page==='grammar'){h='<h1>Gramática</h1>'+L.map(l=>`<article><b>${l[0]} · ${l[2]}</b><p>${tr(l[6],l[5])}</p></article>`).join('')+`<article><h2>Português bíblico × Brasil</h2><p>Vós sois → Vocês são</p><p>Tu és → Você é (tu também é usado em regiões do Brasil)</p><p>Porventura → Será que / acaso</p></article>`}else if(page==='bible'){h=`<h1>Bíblia</h1><article><p>${tr('ACF и Синодальный перевод: полный текст не включён до проверки лицензии.','ACF e tradução sinodal: texto integral não incluído até verificar a licença.')}</p><a href="https://www.bibliaonline.com.br/acf" target="_blank" rel="noopener">${tr('Открыть ACF','Abrir ACF')}</a><p>${tr('Учебная лексика по мотивам Псалма 23','Vocabulário inspirado no Salmo 23')}</p><p>pastor · descanso · caminho</p><details><summary>${tr('Показать перевод','Mostrar tradução')}</summary>пастырь · отдых · путь</details></article>`}else if(page==='prayer'){h=`<h1>Oração</h1><article><p>${tr('Составь собственную молитву. Используй Senhor, agradecer, pedir, confiar.','Escreva sua oração usando Senhor, agradecer, pedir, confiar.')}</p><textarea id="note" rows="7">${esc(S.notes)}</textarea><button onclick="S.notes=$('#note').value;save();this.textContent='✓'">${tr('Сохранить','Salvar')}</button><button class="secondary" onclick="speak($('#note').value)">🔊</button><p class="muted">${tr('Личная запись хранится только на этом устройстве. Автоматической проверки смысла пока нет.','Nota local. Sem correção automática de significado.')}</p></article>`}else if(page==='sermon'){h=`<h1>Pregações</h1><article><p>${tr('Учебная мини-проповедь (авторский текст)','Mensagem didática original')}</p>${audio('Quando enfrentamos dificuldades, podemos buscar a Deus e ajudar uns aos outros. A esperança nos encoraja a continuar.')}<textarea rows="5" placeholder="${tr('Твой перевод','Sua tradução')}"></textarea><details><summary>${tr('Показать пример перевода','Mostrar tradução')}</summary>Когда мы сталкиваемся с трудностями, мы можем искать Бога и помогать друг другу. Надежда побуждает нас продолжать.</details></article>`}else if(page==='dialog'){h=`<h1>Diálogos</h1><article><p>Olá! Tudo bem? Você veio ao culto hoje?</p>${audio('Olá! Tudo bem? Você veio ao culto hoje?')}<button class="option" onclick="this.parentNode.querySelector('output').textContent='Muito bem! Ответ подходит.'">Sim, vim ao culto.</button><button class="option" onclick="this.parentNode.querySelector('output').textContent='Попробуй ответить о посещении богослужения.'">Eu moro longe.</button><output></output></article>`}else if(page==='profile'){h=`<h1>${tr('Профиль','Perfil')}</h1><article><p>${S.xp} XP · ${S.days.length} ${tr('дней занятий','dias de estudo')}</p><p>${S.done.length?'🏅 Primeiros passos':'🔒 Primeiros passos'}</p><p>${S.xp>=100?'🏅 100 XP':'🔒 100 XP'}</p><label>Idioma<select onchange="S.lang=this.value;save();render()"><option value="ru" ${S.lang==='ru'?'selected':''}>Русский</option><option value="pt" ${S.lang==='pt'?'selected':''}>Português</option></select></label><p>${tr('Голос зависит от устройства','Voz depende do dispositivo')}</p><select id="voice"><option value="0">Voz 1</option><option value="1">Voz 2 (se disponível)</option></select>${audio('Olá! Eu sou Luz.')}<p class="muted">${tr('Гостевой режим без регистрации. Прогресс хранится в этом браузере.','Modo visitante sem cadastro. O progresso fica neste navegador.')}</p><button onclick="exportData()">${tr('Экспорт прогресса','Exportar progresso')}</button></article>`}$('#app').innerHTML=h}
function intro(i){active=i;go('intro')}function start(i){active=i;review=false;let l=L[i],words=l[7];queue=words.map(w=>({type:'Vocabulário',prompt:w[0],answer:w[1],opts:shuffle(words.map(x=>x[1])),ex:w.join(' — ')}));l[8].forEach((w,j)=>{queue.push({type:'Tradução',prompt:w[1],answer:w[0],ex:w.join(' — ')});if(j===0)queue.push({type:'Áudio',prompt:tr('Что ты услышала?','O que você ouviu?'),listen:w[0],answer:w[0],ex:w.join(' — ')})});let w=l[8][0][0].split(' '),missing=w[1];queue.push({type:'Gramática',prompt:w.map((x,j)=>j===1?'___':x).join(' '),answer:missing,ex:l[6]});begin()}function begin(){pos=0;score=0;locked=false;go('quiz')}function startReview(){review=true;queue=Object.values(S.errors);begin()}function check(v){if(locked||!v.trim())return;locked=true;let q=queue[pos],ok=norm(v)===norm(q.answer),key=q.type+q.prompt+(q.listen||'');if(ok){score++;S.xp+=10;delete S.errors[key]}else S.errors[key]=q;let day=new Date().toLocaleDateString('en-CA');if(!S.days.includes(day))S.days.push(day);save();stats();document.querySelectorAll('#app button,#answer').forEach(b=>b.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'Muito bem! +10 XP':tr('Ожидаемый вариант','Resposta esperada')}</b><p>${esc(q.answer)}</p><p>${esc(q.ex)}</p>${!ok?'<small>Другие корректные варианты перевода могут не распознаваться.</small>':''}</div><button onclick="next()">${tr('Продолжить','Continuar')}</button>`}function next(){pos++;locked=false;if(pos===queue.length){if(!review&&score/queue.length>=.7&&!S.done.includes(active))S.done.push(active);save();go('result')}else render()}function filterWords(v){document.querySelectorAll('.word').forEach(e=>e.hidden=!norm(e.textContent).includes(norm(v)))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='progresso.json';a.click();URL.revokeObjectURL(a.href)}render();
</script></html>
